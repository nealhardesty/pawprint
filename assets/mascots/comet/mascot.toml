# Comet, an object on `orb`: a round icy head with a long tail of three
# streamers (white, pale blue, and teal) flowing back from it to the top
# left corner, as if it were racing to the right. The signature sets the
# tail streaming back and forth; the rare one zooms clean out of the frame
# to the right, and after a moment's empty crate comes back in from the
# left, having gone all the way round.
id = "comet"
name = "Comet"
category = "space"
aliases = []
accent = "teal"
extends = "orb"

[palette]
"l" = "white"       # ice light
"f" = "blue-1"      # ice
"F" = "blue-2"      # ice shadow
"w" = "white"       # tail core
"m" = "blue-1"      # tail streamer
"M" = "teal"        # tail streamer
"h" = "grey-3"      # eye highlight: white would vanish on pale ice

# The icy head.
[layers.head]
grid = """
................................
................................
................................
................................
.............kkkkkk.............
...........kkllllllkk...........
..........klllfffflffk..........
.........kllffffffffffk.........
........kllffffffffffFFk........
........klffffffffffffFk........
........klffffffffffffFk........
........klfffffffffffFFk........
.......kllfffffffffffFFFk.......
........klfffffffffffFFk........
........klfffffffffffFFk........
........klffffffffffFFFk........
........kffffffffffFFFFk........
.........kfFfffffFFFFFk.........
..........kFFFFFFFFFFk..........
...........kkFFFFFFkk...........
.............kkkkkk.............
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
"""

# The tail, streaming off to the top left; it never covers the head.
# Variants for the stream and for the tail-flick template.
[layers.tail]
at = [0, 0]
grid = """
...kmmmmk....
k...kmmmmk...
wkkk.kmmmmk..
wwwwkkkkmmmkk
wwwwwwkkkmmmm
wwwwwwwwkkm..
kkwwwwwwww...
..kwwwwww....
...kkwww.....
kkkk.kww.....
MMMMkkkw.....
MMMMMMMM.....
kkkMMMM......
...kkkMM.....
......kk.....
"""

[layers."tail.flick"]
at = [0, 0]
grid = """
k...kmmmk....
wkk..kmmmk...
wwwk..kmmmk..
wwwwk.kmmmmk.
wwwwwkkkmmmmk
kwwwwwwkkmm..
.kwwwwwwwk...
..kwwwwww....
k..kwwww.....
Mkkkkwww.....
MMMMkkkw.....
kMMMMMMM.....
.kkMMMM......
...kkMMM.....
.....kkk.....
"""

[layers."tail.sway"]
at = [0, 0]
grid = """
..kmmmmmk....
...kkmmmmkk..
kkk..kmmmmmk.
wwwkkkkkmmmmk
wwwwwwkkkmmmm
wwwwwwwwkkm..
kwwwwwwwww...
.kkwwwwww....
...kkwww.....
.kkkkkww.....
kMMMMMMk.....
MMMMMMMM.....
kMMMMMM......
.kkkkkkM.....
.......k.....
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: the tail streams back and forth behind it, and the comet leans
# into the speed, eyes squeezed happy.
[[actions]]
name = "stream"
weight = 4
frames = [
  { ops = ["tail=flick"], ms = 160 },
  { ops = ["tail=sway", "eyes=happy", "all+1,0"], ms = 160 },
  { ops = ["tail=flick", "eyes=happy", "all+1,0"], ms = 160 },
  { ops = ["tail=sway", "eyes=happy", "all+1,0"], ms = 160 },
  { ops = ["tail=flick", "eyes=happy"], ms = 400 },
  { ops = [], ms = 300 },
]

# Rare: it zooms out of the frame to the right, leaves the crate empty for a
# moment, and comes back in from the left, all the way round.
[[actions]]
name = "zoom"
weight = 1
frames = [
  { ops = ["eyes=closed", "all+-1,0"], ms = 400 },
  { ops = ["eyes=closed", "tail=flick", "all+9,0"], ms = 100 },
  { ops = ["all+40,0"], ms = 600 },
  { ops = ["tail=sway", "all+-26,0"], ms = 100 },
  { ops = ["tail=flick", "eyes=happy", "all+-9,0"], ms = 100 },
  { ops = ["eyes=happy", "all+1,0"], ms = 400 },
  { ops = [], ms = 200 },
]
