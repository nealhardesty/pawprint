# Drum: a red snare drum in the crate, a white head with silver hoops above
# and below its face, tension lugs down its sides, and two drumsticks
# resting on top. The signature is a little beat: the sticks lift
# and tap in turn and the drum dips with each hit. The rare one is a
# drumroll that ends on a crash, with sparkles like a cymbal.
id = "drum"
name = "Drum"
category = "things"
aliases = []
accent = "brick"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "pink-1"
"f" = "red-1"
"F" = "red-2"
"w" = "white"
"W" = "grey-1"
"m" = "grey-1"
"M" = "grey-2"
"b" = "brown-1"
"B" = "brown-2"
"c" = "cream"
"h" = "white"
"P" = "pink-1"
"p" = "pink-2"

[layers."head"]
grid = """
................................
.............kkkkkk.............
.......kkkkkkwwwwwwkkkkkk.......
.....kkwwwwwwwwwwwwwWWWWWkk.....
....kwwwwwwwwwwwwwwwWWWWWWWk....
....kwwwwwwwwwwwwwwwWWWWWWWk....
....kmmmmmmmmmmmmmmmmmmmmmmk....
....kMMMMMMMMMMMMMMMMMMMMMMk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klmMffffffffffffffffmMFk....
....klmMffffffffffffffffmMFk....
....klmMffffffffffffffffmMFk....
....klmMffffffffffffffffmMFk....
....klmMffffffffffffffffmMFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....kmmmmmmmmmmmmmmmmmmmmmmk....
....kMMMMMMMMMMMMMMMMMMMMMMk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
....klfffffffffffffffffffFFk....
"""

[layers."stick-l"]
at = [0, 0]
follows = "head"
grid = """
................
................
kkkkk...........
kBBBkkkkkkk.....
kkkkbbbbbbkkkk..
...kkkkkkkbbck..
.........kkkkk..
................
"""

[layers."stick-l.up"]
at = [0, 0]
follows = "head"
grid = """
.....kkkkbck....
..kkkkbbbkkk....
kkkBbbkkkk......
kBBkkkk.........
kkkk............
................
................
................
"""

[layers."stick-r"]
at = [16, 0]
follows = "head"
grid = """
................
................
...........kkkkk
.....kkkkkkkBBBk
..kkkkbbbbbbkkkk
..kcbbkkkkkkk...
..kkkkk.........
................
"""

[layers."stick-r.up"]
at = [16, 0]
follows = "head"
grid = """
....kcbkkkk.....
....kkkbbbkkkk..
......kkkkbbBkkk
.........kkkkBBk
............kkkk
................
................
................
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: a little beat. The sticks lift and tap the head in turn, and
# the drum dips with each hit.
[[actions]]
name = "tap"
weight = 4
frames = [
  { ops = ["stick-l=up", "eyes=left"], ms = 160 },
  { ops = ["all+0,1", "eyes=closed"], ms = 100 },
  { ops = ["stick-r=up", "eyes=right"], ms = 160 },
  { ops = ["all+0,1", "eyes=closed"], ms = 100 },
  { ops = ["stick-l=up", "stick-r=up", "eyes=happy"], ms = 200 },
  { ops = ["all+0,1", "eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: a drumroll. The sticks blur, the drum shakes, and it ends on a
# crash: a sparkle like a cymbal and a big grin.
[[actions]]
name = "drumroll"
weight = 1
frames = [
  { ops = ["stick-l=up", "eyes=closed", "all+1,0"], ms = 90 },
  { ops = ["stick-r=up", "eyes=closed", "all+-1,0"], ms = 90 },
  { ops = ["stick-l=up", "eyes=closed", "all+1,0"], ms = 90 },
  { ops = ["stick-r=up", "eyes=closed", "all+-1,0"], ms = 90 },
  { ops = ["stick-l=up", "stick-r=up", "eyes=closed", "all+0,-1"], ms = 200 },
  { ops = ["all+0,1", "eyes=happy", "mouth=open", "prop:sparkle@25,1", "prop:sparkle@0,2"], ms = 900 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
