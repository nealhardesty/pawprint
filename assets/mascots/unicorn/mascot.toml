follows = "head"
grid = """
.kk.
kyYk
kYyk
kyYk
kYyk
"""

# Rearing hooves.
[layers."hooves.up"]
at = [6, 16]
grid = """
.kk.............kk.
kllk...........kffk
kffk...........kffk
kfFk...........kfFk
kYYk...........kYYk
.kk.............kk.
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: tips its head, and the horn glints with a sparkle at the tip.
[[actions]]
name = "horn-sparkle"
weight = 4
frames = [
  { ops = ["head+0,-1"], ms = 200 },
  { ops = ["head+0,-1", "eyes=closed", "prop:sparkle@12,-2"], ms = 160 },
  { ops = ["head+0,-1", "eyes=closed", "prop:sparkle@19,-1"], ms = 400 },
  { ops = ["head+0,-1", "eyes=happy", "prop:sparkle@20,-3"], ms = 500 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: rears up out of the crate, and a star pops off the horn.
[[actions]]
name = "rear-star"
weight = 1
frames = [
  { ops = ["ears=flick"], ms = 300 },
  { ops = ["all+0,-2", "+hooves.up"], ms = 160 },
  { ops = ["all+0,-4", "eyes=closed", "+mouth.open", "+hooves.up", "prop:star@18,0"], ms = 300 },
  { ops = ["all+0,-4", "eyes=happy", "+mouth.open", "+hooves.up", "prop:star@21,-2"], ms = 900 },
  { ops = ["all+0,-3", "eyes=happy", "+hooves.up"], ms = 200 },
  { ops = ["all+0,1"], ms = 140 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
