# Unicorn on ungulate-head, mythical. A white horse with a long gentle face,
# violet eyes, a soft pink muzzle, and a tall gold spiral horn rising
# straight up between small upright ears: the horn is the first thing you
# see. Its pastel mane, banded pink, lilac, and sky blue, falls down the
# left side of the neck (the horse's goes right), with a matching forelock.
# The signature makes the horn glint and sparkle; the rare one rears up out
# of the crate, and a star pops from the tip of the horn.
id = "unicorn"
name = "Unicorn"
category = "mythical"
aliases = []
accent = "violet"
extends = "ungulate-head"

rest = ["body", "ears", "head", "eyes", "nose", "mane", "horn"]

[palette]
"l" = "white"       # coat light
"f" = "white"       # coat
"F" = "grey-1"      # coat shadow
"w" = "pink-1"      # NEW use: muzzle
"M" = "pink-2"      # mouth line
"e" = "purple-2"    # iris
"h" = "white"       # eye glint
"n" = "pink-2"      # nostrils
"p" = "pink-1"      # inner ear
"P" = "pink-2"      # NEW: mouth
"q" = "pink-1"      # NEW: mane, pink
"v" = "purple-1"    # NEW: mane, lilac
"u" = "blue-1"      # NEW: mane, sky
"y" = "yellow-1"    # NEW: horn light
"Y" = "yellow-2"    # NEW: horn twist

# The arched neck, with the pastel mane down the left side.
[layers.body]
grid = """
    ................................
    ................................
    ................................
    .........kk.....................
    ........kuqqFfffffff............
    .......kvuuqFfffffff............
    .......kvvuFffffffff............
    ......kqqvvFffffffff............
    ......kuqqvFffffffff............
    .....kvuuqqFffffffff............
    .....kvvuuqFffffffff............
    .....kqvvuuFfffffffffFk.........
    ....kuqqvvFfffffffffffFk........
    ....kuuqqvFffffffffffffFk.......
    ....kvuuqqFfffffffffffffFk......
    ...kqvvuuFfffffffffffffffFk.....
    ...kqqvvuFffffffffffffffffFk....
    ...kuqqvvFfffffffffffffffffFk...
    ...kuuqqFffffffffffffffffffFk...
    ...kvuuqFffffffffffffffffffFk...
    ...kvvuFfffffffffffffffffffFk...
    ...kqvvFfffffffffffffffffffFk...
    ...kqqvFfffffffffffffffffffFk...
    ...kuqqFfffffffffffffffffffFk...
    ...kuuqFfffffffffffffffffffFk...
    ...kvuuFfffffffffffffffffffFk...
    ...kvvuFfffffffffffffffffffFk...
    ...kqvvFfffffffffffffffffffFk...
    ...kqqvFfffffffffffffffffffFk...
    ...kuqqFfffffffffffffffffffFk...
    ...kuuqFfffffffffffffffffffFk...
    ...kvuuFfffffffffffffffffffFk...
"""

# Small upright ears.
[layers.ears]
at = [10, 1]
follows = "head"
grid = """
.k........k.
klk......kFk
kpfk....kfpk
kpfk....kfpk
.kfk....kfk.
"""

