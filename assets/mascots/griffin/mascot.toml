# Griffin on bird-perched. Half eagle, half lion: a golden feathered eagle
# head with pointed ear tufts, bright eyes under a heavy brow, and a short
# steel-grey hooked beak, on a tawny lion's body. Big lion paws with cream claws
# grip the rim where a bird would have talons, brown wings rise above its
# shoulders, and a lion's tail with a dark tuft curls up over the rim at
# the right. Signature: lifts one wing and preens it. Rare: spreads its
# wings wide and screeches.
id = "griffin"
name = "Griffin"
category = "mythical"
aliases = ["gryphon"]
accent = "honey"
extends = "bird-perched"

[palette]
"l" = "orange-1"    # lion light
"f" = "brown-1"     # lion body
"F" = "brown-2"     # lion shadow
"w" = "orange-1"    # chest
"m" = "orange-1"    # no breast markings
"L" = "orange-1"    # head feathers light
"g" = "yellow-2"    # golden head feathers
"G" = "orange-3"    # head shadow, brow
"q" = "brown-3"     # wing feathers
"Q" = "brown-4"     # wing shadow, tail tuft
"c" = "cream"       # wing edges, claws
"h" = "white"       # eye highlight
"b" = "grey-2"      # steel beak
"B" = "grey-3"      # beak shadow
"p" = "red-2"       # inside of the beak

# Wings folded but raised above the shoulders.
[layers.wings]
at = [0, 4]
grid = """
kk............................kk
kck..........................kck
kcqk........................kqck
kcqqk......................kqqck
kcqQqk....................kqQqck
kcqqQk....................kQqqck
kcqQqQk..................kQqQqck
.kcqQQk..................kQQqck.
.kcqqQk..................kQqqck.
..kcqQk..................kQqck..
..kkkkk..................kkkkk..
"""

# Wings spread wide.
