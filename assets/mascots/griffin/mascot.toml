[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "ear-flick"
weight = 2

[[actions]]
use = "doze"

# Signature: lifts one wing and preens it, nibbling at the feathers.
[[actions]]
name = "preen"
weight = 5
frames = [
  { ops = ["wings=preen"], ms = 200 },
  { ops = ["wings=preen", "head+-2,1", "eyes=closed"], ms = 300 },
  { ops = ["wings=preen", "head+-2,2", "eyes=closed"], ms = 160 },
  { ops = ["wings=preen", "head+-2,1", "eyes=closed"], ms = 160 },
  { ops = ["wings=preen", "head+-2,2", "eyes=closed"], ms = 160 },
  { ops = ["wings=preen", "head+-1,0", "eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: the full wingspan and a screech.
[[actions]]
name = "screech"
weight = 1
frames = [
  { ops = ["wings=preen", "tail=flick"], ms = 120 },
  { ops = ["wings=open", "tail=flick", "all+0,-1", "eyes=fierce"], ms = 300 },
  { ops = ["wings=open", "tail=flick", "all+0,-1", "eyes=fierce", "-beak", "+mouth.open", "prop:bang@27,0"], ms = 900 },
  { ops = ["wings=open", "all+0,-1", "eyes=fierce", "prop:bang@27,1"], ms = 400 },
  { ops = ["wings=open", "eyes=closed"], ms = 200 },
  { ops = [], ms = 300 },
]
