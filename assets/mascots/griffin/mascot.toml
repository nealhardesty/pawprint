grid = """
k.k.k......................k.k.k
kckckk....................kkckck
kcqcqqk..................kqqcqck
kcqqqqQk................kQqqqqck
.kcqqqQQk..............kQQqqqck.
.kcqqqqQk..............kQqqqqck.
..kcqqqQQk............kQQqqqck..
..kcqqqqQk............kQqqqqck..
