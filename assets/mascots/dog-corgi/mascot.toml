[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: ears relax, then perk straight up, and the whole loaf wiggles.
[[actions]]
name = "perk-wiggle"
weight = 4
frames = [
  { ops = ["ears=down", "head+0,1"], ms = 500 },
  { ops = ["ears=down", "head+0,1", "eyes=closed"], ms = 160 },
  { ops = ["head+0,-1"], ms = 400 },
  { ops = ["head+0,-1", "eyes=happy", "all+1,0"], ms = 120 },
  { ops = ["head+0,-1", "eyes=happy", "all+-1,0"], ms = 120 },
  { ops = ["head+0,-1", "eyes=happy", "all+1,0"], ms = 120 },
  { ops = ["head+0,-1", "eyes=happy", "all+-1,0"], ms = 120 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: ducks, turns round, and shows off the loaf with a wiggle.
[[actions]]
name = "loaf-reveal"
weight = 1
frames = [
  { ops = ["all+0,4"], ms = 120 },
  { ops = ["all+0,12"], ms = 300 },
  { grid = "loaf", ops = ["all+0,4"], ms = 160 },
  { grid = "loaf", ms = 500 },
  { grid = "loaf", ops = ["all+1,0"], ms = 130 },
  { grid = "loaf", ops = ["all+-1,0"], ms = 130 },
  { grid = "loaf", ops = ["all+1,0"], ms = 130 },
  { grid = "loaf", ops = ["all+-1,0"], ms = 130 },
  { grid = "loaf", ms = 400 },
  { ops = ["all+0,12"], ms = 300 },
  { ops = ["all+0,4"], ms = 120 },
  { ops = [], ms = 200 },
]
