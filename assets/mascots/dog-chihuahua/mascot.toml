grid = """
.nn.
"""

# A tiny bark.
[layers."mouth.open"]
at = [14, 12]
grid = """
.kk.
kPPk
.kk.
"""

[layers.paws]
at = [10, 17]
grid = """
.FFF......FFF.
FlllF....FlllF
klFlk....klFlk
"""

# Rare: snuggled into a blanket up to the eyes.
[layers."blanket.wrap"]
at = [2, 12]
grid = """
.....kkkkkkkkkkkkkkkkkkkk.....
...kkrrrrrrrrrrrrrrrrrrrrkk...
.kkrrrrrRrrrrrrrrrrrRrrrrrrkk.
krrrrrrRrrrrrrrrrrrrrRrrrrrrrk
krrrrrRrrrrrrrRrrrrrrrRrrrrrrk
krrrrRrrrrrrrRrrrrrrrrrRrrrrRk
krrrRrrrrrrrRrrrrrrrrrrrRrrRRk
krrRrrrrrrrRrrrrrrrrrrrrrRRRRk
krrrrrrrrrRrrrrrrrrrrrrrrRRRRk
krrrrrrrrRrrrrrrrrrrrrrrrRRRRk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: trembles, lets out one tiny bark, and trembles again.
[[actions]]
name = "tremble-bark"
weight = 4
frames = [
  { ops = ["all+1,0"], ms = 80 },
  { ops = ["all+-1,0"], ms = 80 },
  { ops = ["all+1,0"], ms = 80 },
  { ops = ["all+-1,0"], ms = 80 },
  { ops = ["head+0,-1", "+mouth.open", "prop:bang@25,2"], ms = 300 },
  { ops = ["prop:bang@25,2"], ms = 300 },
  { ops = ["all+1,0"], ms = 80 },
  { ops = ["all+-1,0"], ms = 80 },
  { ops = ["all+1,0"], ms = 80 },
  { ops = [], ms = 200 },
]

# Rare: burrows into a blanket until only the ears and eyes show, blinks
# contentedly, and pops back out.
[[actions]]
name = "blanket-burrito"
weight = 1
frames = [
  { ops = ["all+0,4"], ms = 150 },
  { ops = ["all+0,1", "+blanket.wrap"], ms = 400 },
  { ops = ["all+0,1", "+blanket.wrap", "eyes=closed"], ms = 400 },
  { ops = ["all+0,1", "+blanket.wrap", "eyes=happy", "prop:heart@22,1"], ms = 900 },
  { ops = ["all+0,1", "+blanket.wrap", "ears=flick"], ms = 500 },
  { ops = ["all+0,1", "+blanket.wrap"], ms = 300 },
  { ops = [], ms = 200 },
]
