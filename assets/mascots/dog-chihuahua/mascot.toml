# Chihuahua on dog-sit. Enormous bat ears with pink insides that span
# nearly the whole badge, a tiny apple-domed head with a short muzzle, big
# glossy eyes, and a slight body. It trembles; the rare action burrows
# into a blanket until only the ears and eyes show.
id = "dog-chihuahua"
name = "Chihuahua"
category = "cats-dogs"
aliases = ["chihuahua"]
accent = "cranberry"
extends = "dog-sit"

[palette]
"l" = "cream"       # fawn light
"f" = "orange-1"    # fawn
"F" = "brown-1"     # fawn shadow
"w" = "white"       # muzzle and chest
"M" = "grey-1"      # shadow on the white
"e" = "brown-3"     # iris
"p" = "pink-1"      # inner ear
"P" = "pink-2"      # tiny mouth
"r" = "red-1"       # blanket
"R" = "red-2"       # blanket shadow

# A thin sickle tail.
[layers.tail]
at = [23, 10]
grid = """
..kk.
.klFk
.kfk.
klFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
"""

[layers."tail.flick"]
at = [23, 9]
grid = """
...kk
..klk
.klFk
.kfk.
klFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
"""

# A slight body under a tiny head.
[layers.body]
at = [8, 14]
grid = """
..klffffffffFk..
.klffwwwwwwffFk.
klfffwwwwwwfffFk
klfffwwwwwwfffFk
klffffwwwwffffFk
klfffffwwfffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
klffffffffffffFk
"""

# Tiny apple-domed head, short muzzle.
[layers.head]
at = [9, 5]
grid = """
...kkkkkkkk...
.kkllllllffkk.
kllllffffffFFk
klffffffffffFk
klffffffffffFk
klffffffffffFk
.kfffwwwwfffk.
..kfwwwwwwFk..
...kwwwwwwk...
....kMMMMk....
"""

# Enormous bat ears.
[layers.ears]
at = [0, 0]
grid = """
.kk..........................kk.
.klkk......................kkFk.
.klppkk..................kkppFk.
..klpppkk..............kkpppFk..
..klppppfkk..........kkfppppFk..
...klppppffk........kffppppFk...
...klpppfffff......fffffpppFk...
....klppffff........ffffppFk....
.....klpfff..........fffpFk.....
......kkkk............kkkk......
"""

[layers."ears.flick"]
at = [0, 0]
grid = """
.kk.............................
.klkk.........................kk
.klppkk.....................kkFk
..klpppkk.................kkppFk
..klppppfkk.............kkpppFk.
...klppppffk..........kkfppppFk.
...klpppfffff........kffppppFk..
....klppffff........fffffpppFk..
.....klpfff..........ffffppFk...
......kkkk............fffpFk....
.......................kkkk.....
"""

# Big glossy eyes.
[layers.eyes]
at = [11, 9]
grid = """
hkk....hkk
kek....kek
"""

[layers."eyes.closed"]
at = [11, 10]
grid = """
kkk....kkk
"""

[layers."eyes.left"]
at = [11, 9]
grid = """
hkF....hkF
ekF....ekF
"""

[layers."eyes.happy"]
