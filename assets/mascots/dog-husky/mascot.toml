[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: throws its head back for a long awoo.
[[actions]]
name = "awoo"
weight = 4
frames = [
  { ops = ["eyes=closed", "head+0,1"], ms = 250 },
  { ops = ["head=awoo", "-eyes", "-nose", "head+0,-1"], ms = 300 },
  { ops = ["head=awoo", "-eyes", "-nose", "head+0,-2", "prop:note@23,4"], ms = 600 },
  { ops = ["head=awoo", "-eyes", "-nose", "head+0,-2", "prop:note@24,1"], ms = 700 },
  { ops = ["head=awoo", "-eyes", "-nose", "head+0,-1", "prop:note@25,0"], ms = 300 },
  { ops = ["eyes=closed"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a snowflake drifts down and lands on its nose.
[[actions]]
name = "snowflake"
weight = 1
frames = [
  { ops = ["+flake", "eyes=up"], ms = 500 },
  { ops = ["+flake.mid", "eyes=up"], ms = 500 },
  { ops = ["+flake.low", "eyes=cross"], ms = 500 },
  { ops = ["+flake.nose", "eyes=cross"], ms = 900 },
  { ops = ["eyes=closed", "nose=sniff", "all+0,-1"], ms = 150 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]
