# Siberian Husky on dog-sit. A dark grey cap and widow's peak over a white
# mask with white brows and "spectacles", ice-blue eyes, prick ears (the
# base's `ears.prick`, listed in rest), and a white chest. `head.awoo` is the
# head thrown back with the nose to the sky. The rare action is a snowflake
# drifting down onto its nose.
id = "dog-husky"
name = "Husky"
category = "cats-dogs"
aliases = ["husky"]
accent = "ice"
extends = "dog-sit"
rest = ["tail", "body", "head", "ears.prick", "eyes", "nose", "paws"]

[palette]
"l" = "grey-2"      # coat light
"f" = "grey-3"      # dark grey coat
"F" = "grey-4"      # coat shadow
"w" = "white"       # mask, chest, tail underside
"M" = "grey-1"      # shadow on the white
"s" = "grey-3"      # ears
"e" = "blue-2"      # ice-blue iris
"h" = "white"       # glint
"p" = "pink-1"      # inner ear, tongue
"b" = "blue-1"      # snowflake (arms in the iris blue)

[layers.tail]
at = [25, 11]
grid = """
..kk.
.kwk.
.kwFk
klwFk
klffk
klfFk
kffFk
kffFk
kffFk
"""

