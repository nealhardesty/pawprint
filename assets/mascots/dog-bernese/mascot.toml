# Bernese Mountain Dog on dog-sit: a big, gentle, tricolor softie. A glossy
# black coat; a white blaze running from the crown down into a white muzzle
# and the white cross on the chest; rust eyebrow dots, rust cheeks framing
# the muzzle, and rust socks above white toes; broad black floppy ears;
# warm brown eyes with a glint so they read on black fur; and a bushy
# white-tipped tail. `paws.reach` puts a paw up on the rim; `head.hope`
# lifts the brows for the rare chin-on-the-rim sigh.
id = "dog-bernese"
name = "Bernese Mountain Dog"
category = "cats-dogs"
aliases = ["bernese"]
accent = "copper"
extends = "dog-sit"

[palette]
"l" = "grey-3"      # sheen on the black coat
"f" = "grey-4"      # black coat
"F" = "fur-black"   # coat shadow
"w" = "white"       # blaze, muzzle, chest, toes
"M" = "grey-1"      # shadow on the white
"r" = "orange-3"    # NEW: rust brows, cheeks, socks
"R" = "brown-3"     # NEW: rust shadow
"s" = "grey-4"      # ears
"S" = "fur-black"   # ear shadow
"e" = "brown-2"     # warm brown iris
"h" = "white"       # glint
"n" = "ink"         # nose
"p" = "pink-2"      # tongue

# A bushy tail with a white tip.
[layers.tail]
at = [25, 11]
grid = """
..kk.
.kwwk
.kwMk
klfFk
klfFk
kffFk
kffFk
kffFk
kffFk
"""

