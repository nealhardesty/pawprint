at = [8, 15]
grid = """
.RrrR...........
RrrrrR..........
RwwwwR.....RrrR.
kwMwMk....RwwwwR
..........kwMwMk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "doze"

# Signature: plonks a big paw up on the rim, then tilts its head with one
# ear up, as if to ask what you're doing.
[[actions]]
name = "paw-tilt"
weight = 4
frames = [
  { ops = ["paws=reach"], ms = 300 },
  { ops = ["paws=reach", "eyes=right"], ms = 400 },
  { ops = ["paws=reach", "eyes=right", "head+1,0", "ears=flick"], ms = 1000 },
  { ops = ["paws=reach", "head+1,0", "ears=flick"], ms = 300 },
  { ops = ["paws=reach"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: it sinks down until its chin rests on the rim, gazes up at you,
# and lets out a long, contented sigh.
[[actions]]
name = "chin-sigh"
weight = 1
frames = [
  { ops = ["all+0,1"], ms = 200 },
  { ops = ["all+0,3", "head=hope", "eyes=up"], ms = 900 },
  { ops = ["all+0,3", "head=hope", "eyes=closed"], ms = 300 },
  { ops = ["all+0,3", "head=hope", "eyes=closed", "prop:puff@21,13"], ms = 600 },
  { ops = ["all+0,3", "head=hope", "eyes=up"], ms = 900 },
  { ops = ["all+0,1"], ms = 200 },
  { ops = [], ms = 200 },
]
