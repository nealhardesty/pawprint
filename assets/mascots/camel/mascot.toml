kppppk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: chews slowly, the lower lip grinding side to side, with one
# long lazy blink in the middle.
[[actions]]
name = "slow-chew"
weight = 4
frames = [
  { ops = ["jaw+-1,0"], ms = 300 },
  { ops = [], ms = 200 },
  { ops = ["jaw+1,0"], ms = 300 },
  { ops = ["eyes=closed"], ms = 700 },
  { ops = ["jaw+-1,0", "eyes=closed"], ms = 300 },
  { ops = ["eyes=closed"], ms = 300 },
  { ops = ["jaw+1,0"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a big, unimpressed sigh: the head sinks, the nostrils flare, and
# the lips flap out a puff.
[[actions]]
name = "sigh"
weight = 1
frames = [
  { ops = ["eyes=closed", "nose=sniff", "head+0,-1"], ms = 500 },
  { ops = ["eyes=closed", "+mouth.open", "jaw+0,1", "head+0,1"], ms = 160 },
  { ops = ["eyes=closed", "+mouth.open", "jaw+0,1", "head+0,1", "prop:puff@20,14"], ms = 400 },
  { ops = ["eyes=closed", "jaw+-1,0", "head+0,1", "prop:puff@22,12"], ms = 300 },
  { ops = ["eyes=closed", "head+0,1"], ms = 600 },
  { ops = [], ms = 300 },
]
