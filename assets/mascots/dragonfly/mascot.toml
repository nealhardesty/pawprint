[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: it hovers, wings blurring, bobbing up off the rim and back.
[[actions]]
name = "hover"
weight = 4
frames = [
  { ops = ["wings=open", "all+0,-1"], ms = 160 },
  { ops = ["wings=open", "all+0,-2"], ms = 400 },
  { ops = ["wings=open", "all+0,-1"], ms = 300 },
  { ops = ["wings=open", "all+0,-2"], ms = 400 },
  { ops = ["wings=open"], ms = 200 },
  { ops = [], ms = 300 },
]

# Rare: a quick dart to one side, the other, and back to the middle.
[[actions]]
name = "dart"
weight = 1
frames = [
  { ops = ["wings=open", "all+0,-2"], ms = 120 },
  { ops = ["wings=open", "all+-5,-2", "eyes=left"], ms = 300 },
  { ops = ["wings=open", "all+5,-2", "eyes=right"], ms = 300 },
  { ops = ["wings=open", "all+0,-2"], ms = 200 },
  { ops = ["wings=open", "all+0,-1", "eyes=happy"], ms = 300 },
  { ops = ["eyes=happy"], ms = 300 },
  { ops = [], ms = 200 },
]
