# Dragonfly, on bug. A teal dragonfly hovering at the rim, face on: two
# huge round blue compound eyes that almost meet on top of its head, four
# long, narrow, clear wings held straight out to the sides with white
# veins, and a striped teal thorax over a long thin tail that runs down
# into the crate. The signature is a hover, wings blurring as it bobs in
# the air; the rare one darts quickly left and right and back.
id = "dragonfly"
name = "Dragonfly"
category = "critters"
aliases = []
accent = "teal"
extends = "bug"

[palette]
"l" = "green-1"     # body light
"f" = "teal"        # body
"F" = "green-3"     # body shadow and stripes
"e" = "blue-2"      # compound eyes
"E" = "blue-1"      # compound eye shine
"D" = "blue-3"      # NEW: compound eye shadow
"w" = "blue-1"      # wings
"W" = "white"       # NEW: wing veins
"m" = "white"       # wing blur streaks
"g" = "grey-2"      # NEW: blurred wing edge

# Four clear wings held straight out.
