# Hedgehog, on small-quadruped. The defining feature is the spines: a big
# spiky dome of brown quills with cream tips, drawn as the `body` so it sits
# behind a small, pale, pointy face with a black button nose, rosy cheeks,
# and tiny round ears. No tail to see. `body.puff` bristles the spines out;
# `body.ball` is the curled-up spiky ball.
id = "hedgehog"
name = "Hedgehog"
category = "mammals"
aliases = ["hedgie"]
accent = "ochre"
extends = "small-quadruped"

[palette]
"l" = "cream"       # quill tips
"f" = "brown-3"     # quills
"F" = "brown-4"     # quill shadow
"w" = "brown-1"     # face and belly
"M" = "brown-2"     # face shadow
"s" = "brown-2"     # paws light
"S" = "brown-3"     # paws
"n" = "fur-black"   # nose
"p" = "pink-1"      # cheeks, mouth

# The spines hide any tail.
[layers.tail]
at = [16, 20]
grid = """
.
"""

