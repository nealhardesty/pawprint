[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 5

[[actions]]
use = "look-left"
weight = 2

[[actions]]
use = "doze"

# Signature: puffs its spines out, holds, and deflates with a sigh.
[[actions]]
name = "puff-up"
weight = 5
frames = [
  { ops = ["eyes=closed"], ms = 160 },
  { ops = ["body=puff", "eyes=closed", "all+0,-1"], ms = 200 },
  { ops = ["body=puff", "all+0,-1"], ms = 1000 },
  { ops = ["body=puff", "eyes=closed"], ms = 200 },
  { ops = ["eyes=happy", "prop:puff@22,6"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: curls into a spiky ball, rolls away and back, and uncurls with a
# leaf stuck on its spines.
[[actions]]
name = "roll"
weight = 1
frames = [
  { ops = ["eyes=closed", "all+0,1"], ms = 200 },
  { ops = ["body=ball", "-head", "-ears", "-eyes", "-nose", "-paws"], ms = 300 },
  { ops = ["body=ball", "-head", "-ears", "-eyes", "-nose", "-paws", "all+-2,0", "flipx"], ms = 150 },
  { ops = ["body=ball", "-head", "-ears", "-eyes", "-nose", "-paws", "all+-4,0"], ms = 150 },
  { ops = ["body=ball", "-head", "-ears", "-eyes", "-nose", "-paws", "all+-2,0", "flipx"], ms = 150 },
  { ops = ["body=ball", "-head", "-ears", "-eyes", "-nose", "-paws"], ms = 300 },
  { ops = ["eyes=closed", "prop:leaf@18,0"], ms = 300 },
  { ops = ["eyes=left", "prop:leaf@18,0"], ms = 900 },
  { ops = ["eyes=happy", "prop:leaf@18,0"], ms = 600 },
  { ops = [], ms = 200 },
]
