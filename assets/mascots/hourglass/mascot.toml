# Hourglass, an object: two glass bulbs pinched at the waist, held between
# a heavy wooden top and base by turned posts. The face sits on the upper
# bulb, its smile on the sand, and a fine stream of sand runs through the
# neck to the pile below. The signature lets the sand trickle while the
# hourglass watches it go; the rare one finds the top bulb empty, has a
# start, and flips itself over (a hop, a tumble, a landing) to start again.
id = "hourglass"
name = "Hourglass"
category = "things"
aliases = []
accent = "ochre"
extends = "object"

[palette]
"l" = "brown-1"     # wood light
"f" = "brown-2"     # wood
"F" = "brown-3"     # wood shadow
"w" = "blue-1"      # glass
"m" = "blue-2"      # glass shade
"g" = "white"       # NEW: glint on the glass
"z" = "yellow-1"    # NEW: sand light
"y" = "yellow-2"    # NEW: sand
"Y" = "orange-3"    # NEW: sand shadow
"p" = "brown-3"     # inside of the mouth

