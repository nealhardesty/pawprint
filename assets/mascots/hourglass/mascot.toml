# The falling sand in two steps, so it trickles.
[layers."stream.a"]
at = [15, 15]
follows = "head"
grid = """
y
w
y
"""

[layers."stream.b"]
at = [15, 15]
follows = "head"
grid = """
w
y
w
"""

# Watching the sand fall, and screwed shut for the tumble.
[layers."eyes.down"]
at = [11, 10]
follows = "head"
grid = """
hk......hk
kk......kk
"""

[layers."eyes.squeeze"]
at = [11, 8]
follows = "head"
grid = """
k........k
.k......k.
k........k
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "double-blink"
weight = 3

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the sand trickles through the neck while the hourglass
# watches it fall, then looks up, pleased.
[[actions]]
name = "trickle"
weight = 5
frames = [
  { ops = ["eyes=down", "stream=a"], ms = 160 },
  { ops = ["eyes=down", "stream=b"], ms = 160 },
  { ops = ["eyes=down", "stream=a"], ms = 160 },
  { ops = ["eyes=down", "stream=b"], ms = 160 },
  { ops = ["eyes=down", "stream=a"], ms = 160 },
  { ops = ["eyes=down", "stream=b"], ms = 160 },
  { ops = ["eyes=happy"], ms = 700 },
  { ops = [], ms = 200 },
]

# Rare: the top bulb has run dry. A start, a hop, a tumble head over heels,
# and it lands the right way up with all its sand back on top.
[[actions]]
name = "flip"
weight = 1
frames = [
  { ops = ["head=empty", "-stream", "eyes=down"], ms = 700 },
  { ops = ["head=empty", "-stream", "all+0,-1", "prop:bang@27,0"], ms = 400 },
  { ops = ["head=empty", "-stream", "eyes=squeeze", "all+0,-3"], ms = 120 },
  { grid = "tumble-1", ops = ["all+-2,-4"], ms = 130 },
  { grid = "tumble-2", ops = ["all+0,-4"], ms = 130 },
  { ops = ["eyes=squeeze", "all+0,-3"], ms = 120 },
  { ops = ["eyes=squeeze", "all+0,1"], ms = 120 },
  { ops = ["eyes=happy"], ms = 800 },
  { ops = [], ms = 200 },
]

