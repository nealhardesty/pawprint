...klk..kwwwwwwwwwwwwwmk..kfk...
...klk...kwwwwwwwwwwwmk...kfk...
...klk.....kwwzzzzwmk.....kfk...
...klk........kyYk........kfk...
...klk........kwwk........kfk...
