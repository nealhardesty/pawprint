at = [7, 17]
grid = """
.FFFFF......FFFFF.
FlllllF....FfffffF
kFfFfFk....kFfFfFk
"""

# Both arms draped along the rim, hugging the crate.
[layers."paws.hug"]
at = [0, 16]
grid = """
..kkkkkkkk............kkkkkkkk..
.klllllllfk..........kffffffffk.
kllffffffFk..........kFffffffffk
kFfFfffffFk..........kFfffffFfFk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: drapes both arms over the crate edge, rests its chin, dozes.
[[actions]]
name = "hug-doze"
weight = 4
frames = [
  { ops = ["paws=hug"], ms = 300 },
  { ops = ["paws=hug", "head+0,1", "eyes=happy"], ms = 400 },
  { ops = ["paws=hug", "head+0,2", "eyes=closed"], ms = 800 },
  { ops = ["paws=hug", "head+0,2", "eyes=closed", "prop:zzz@21,3"], ms = 900 },
  { ops = ["paws=hug", "head+0,2", "eyes=closed", "prop:zzz@22,1"], ms = 800 },
  { ops = ["paws=hug", "head+0,1"], ms = 300 },
]

# Rare: a eucalyptus leaf, munched slowly and with great contentment.
[[actions]]
name = "eucalyptus"
weight = 1
frames = [
  { ops = ["eyes=right", "prop:leaf@20,10"], ms = 500 },
  { ops = ["+mouth.open", "prop:leaf@16,12"], ms = 300 },
  { ops = ["eyes=happy", "prop:leaf@16,13"], ms = 300 },
  { ops = ["eyes=happy", "+mouth.open", "prop:leaf@16,14"], ms = 300 },
  { ops = ["eyes=happy"], ms = 300 },
  { ops = ["eyes=happy", "+mouth.open"], ms = 300 },
  { ops = ["eyes=happy"], ms = 700 },
]
