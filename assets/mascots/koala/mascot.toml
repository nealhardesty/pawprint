# Koala on bear. Soft grey fur, enormous round fluffy ears with white tufts
# filling them, small dark eyes, and the koala's big glossy black spoon nose
# down the middle of the face; a white chin and chest. `paws.hug` drapes
# both arms along the crate rim for the signature: it hugs the edge and
# dozes off. The rare one is a eucalyptus snack.
id = "koala"
name = "Koala"
category = "mammals"
aliases = []
accent = "sky"
extends = "bear"

[palette]
"l" = "grey-1"      # fur light
"f" = "grey-2"      # fur
"F" = "grey-3"      # fur shadow
"w" = "white"       # ear tufts, chin, chest
"M" = "grey-3"      # mouth lines
"n" = "fur-black"   # nose
"h" = "white"       # eye and nose glint
"p" = "pink-2"      # mouth inside

[layers.body]
at = [4, 14]
grid = """
....klffffffffffffFk....
..kklfffffffffffffFFkk..
.klfffffffwwwwfffffffFk.
klffffffwwwwwwwwffffFFFk
klffffffwwwwwwwwffffFFFk
klffffffwwwwwwwwffffFFFk
klfffffffwwwwwwfffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
klffffffffffffffffffFFFk
"""

# Huge round ears full of white fluff.
[layers.ears]
at = [0, 2]
follows = "head"
grid = """
..kkkkk..................kkkkk..
.kllfffk................kfffffk.
klwwwwffk..............kffwwwwfk
kwwwwwwfk..............kfwwwwwwk
kwwwwwwfk..............kfwwwwwwk
kwwwwwwfk..............kfwwwwwwk
klwwwwfFk..............kFfwwwwfk
.kfffFFk................kFFfffk.
..kkkkk..................kkkkk..
"""

[layers."ears.flick"]
