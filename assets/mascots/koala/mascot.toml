.kllfffk.................kkkkk..
klwwwwffk...............kfffffk.
kwwwwwwfk..............kffwwwwfk
kwwwwwwfk..............kfwwwwwwk
kwwwwwwfk..............kfwwwwwwk
klwwwwfFk..............kfwwwwwwk
.kfffFFk...............kFfwwwwfk
..kkkkk.................kFFfffk.
.........................kkkkk..
"""

[layers.head]
at = [6, 4]
grid = """
....kkkkkkkkkkkk....
..kkllllllllllffkk..
.kllfffffffffffffFk.
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
.kffffffMwwMfffffFk.
..kFFfffwwwwfffFFk..
...kkFFFFFFFFFFkk...
"""

[layers.eyes]
at = [11, 9]
follows = "head"
grid = """
hk......hk
kk......kk
"""

[layers."eyes.closed"]
at = [11, 10]
follows = "head"
grid = """
