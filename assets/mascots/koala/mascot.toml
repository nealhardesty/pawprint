at = [10, 9]
follows = "head"
grid = """
.kk......kk.
k..k....k..k
"""

# The big spoon nose, with a glint.
[layers.nose]
at = [14, 9]
follows = "head"
grid = """
.nn.
nhnn
nnnn
nnnn
.nn.
"""

[layers."nose.sniff"]
at = [14, 8]
follows = "head"
