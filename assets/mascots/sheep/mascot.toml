# Sheep on ungulate-head. A round white cloud of wool with a dark grey face
# peeking out of it: a bumpy wool cap and fringe on top, dark ears sticking
# straight out sideways from the fleece, and a soft grey muzzle. No horns.
# Its scalloped outline is unlike any sibling's. The signature fluffs up its
# wool and baas (a note); the rare one: the wool keeps growing until it is
# an enormous poof, then settles back.
id = "sheep"
name = "Sheep"
category = "mammals"
aliases = ["lamb", "ewe"]
accent = "ice"
extends = "ungulate-head"

rest = ["body", "ears", "head", "eyes", "nose", "cap"]

[palette]
"l" = "grey-2"      # face light
"f" = "grey-3"      # face
"F" = "grey-4"      # face shadow
"m" = "grey-2"      # NEW: muzzle
"M" = "grey-4"      # mouth line
"a" = "white"       # NEW: wool
"A" = "grey-1"      # NEW: wool shadow and curls
"n" = "fur-black"   # nose
"p" = "pink-2"      # inner ear, mouth

