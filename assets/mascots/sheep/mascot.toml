[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: fluffs up its wool and baas.
[[actions]]
name = "fluff-baa"
weight = 4
frames = [
  { ops = ["cap+0,-1", "eyes=closed"], ms = 160 },
  { ops = ["cap+0,-1", "eyes=closed", "all+0,-1"], ms = 200 },
  { ops = ["eyes=happy"], ms = 300 },
  { ops = ["+mouth.open", "ears=flick", "prop:note@24,2"], ms = 300 },
  { ops = ["+mouth.open", "prop:note@25,0"], ms = 500 },
  { ops = ["prop:note@25,-1"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: the wool grows, and grows, into an enormous poof, then shakes back.
[[actions]]
name = "big-poof"
weight = 1
frames = [
  { ops = ["eyes=wide", "cap+0,-1"], ms = 300 },
  { ops = ["eyes=wide", "body=poof", "cap=poof"], ms = 900 },
  { ops = ["eyes=happy", "body=poof", "cap=poof"], ms = 600 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 100 },
  { ops = ["eyes=closed", "all+1,0"], ms = 100 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 100 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
