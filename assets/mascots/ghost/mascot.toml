# Ghost, a bespoke oddball: a little sheet ghost hovering in the crate, its
# scalloped hem just clearing the rim. Alpha is only ever 0 or 255, so it
# fades in steps instead: `body.pale` swaps the ink outline and white sheet
# for blues, and `body.faint` keeps only a pale outline, so the crate shows
# through it. The signature floats up and fades a step; the rare one fades
# out, sinks through the crate front, and pops back up. It's nocturnal: at
# night it says boo.
id = "ghost"
name = "Ghost"
category = "oddballs"
aliases = ["boo", "spooky"]
accent = "ice"
nocturnal = true

[palette]
"." = "clear"
"k" = "ink"
"l" = "white"       # sheet light
"f" = "white"       # sheet
"F" = "blue-1"      # sheet shadow; the faint outline
"q" = "blue-2"      # the pale outline and faint eyes
"w" = "white"       # eye highlight
"p" = "pink-1"      # blush
"P" = "pink-2"      # inside the boo

# The sheet in four states: at rest, arms up for the boo, pale, and faint
# (outline only, so the crate shows through).
