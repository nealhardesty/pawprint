[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "look-right"
weight = 3

# Signature: it floats up out of the crate and fades a step at the top.
[[actions]]
name = "float"
weight = 4
frames = [
  { ops = ["all+0,-1"], ms = 160 },
  { ops = ["all+0,-2"], ms = 200 },
  { ops = ["all+0,-3"], ms = 300 },
  { ops = ["all+0,-3", "body=pale", "-blush"], ms = 700 },
  { ops = ["all+0,-3"], ms = 300 },
  { ops = ["all+0,-2"], ms = 200 },
  { ops = ["all+0,-1"], ms = 160 },
]

# Rare: it fades until the crate shows through it, sinks through the crate
# front, and pops back up.
[[actions]]
name = "phase"
weight = 1
frames = [
  { ops = ["body=pale", "-blush"], ms = 200 },
  { ops = ["body=faint", "eyes=faint", "-blush", "-mouth"], ms = 400 },
  { ops = ["body=faint", "eyes=faint", "-blush", "-mouth", "all+0,4"], ms = 160 },
  { ops = ["body=faint", "eyes=faint", "-blush", "-mouth", "all+0,9"], ms = 160 },
  { ops = ["body=faint", "eyes=faint", "-blush", "-mouth", "all+0,14"], ms = 160 },
  { ops = ["-body", "-eyes", "-blush", "-mouth"], ms = 500 },
  { ops = ["all+0,10"], ms = 120 },
  { ops = ["all+0,4"], ms = 120 },
  { ops = ["all+0,-2", "eyes=happy"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Night: arms up, boo! Then a giggle.
[[actions]]
name = "boo"
weight = 3
when = "night"
frames = [
  { ops = ["eyes=closed"], ms = 300 },
  { ops = ["all+0,-1", "body=boo", "mouth=boo"], ms = 120 },
  { ops = ["all+0,-2", "body=boo", "mouth=boo"], ms = 900 },
  { ops = ["all+0,-1", "eyes=happy"], ms = 200 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = ["eyes=happy", "all+0,1"], ms = 150 },
  { ops = ["eyes=happy"], ms = 300 },
]
