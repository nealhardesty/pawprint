# Giraffe on ungulate-head. Taller and slimmer than anything else here: a
# small tan head held up on a long narrow neck covered in a net of
# orange-brown patches, two ossicone horns with dark knobs on top, ears out
# to the sides, a pale muzzle, and lashes. The neck is the point: the
# signature stretches it up and up until the head leaves the top of the
# frame, then comes back down chewing a leaf. The rare one licks its own
# nose with a long dark tongue.
id = "giraffe"
name = "Giraffe"
category = "mammals"
aliases = []
accent = "ochre"
extends = "ungulate-head"

[palette]
"l" = "orange-1"    # coat light, the net between patches
"f" = "orange-1"    # coat
"F" = "orange-2"    # coat shadow
"d" = "orange-3"    # NEW: patches
"D" = "brown-3"     # NEW: patch shadow
"w" = "cream"       # muzzle
"M" = "orange-2"    # mouth line
"x" = "orange-2"    # ossicones
"X" = "brown-4"     # ossicone knobs
"n" = "brown-3"     # nostrils
"p" = "pink-2"      # inner ear
"t" = "purple-2"    # NEW: tongue

