[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the neck rises out of the top of the frame, and the head comes
# back down with a leaf, chewing.
[[actions]]
name = "browse"
weight = 4
frames = [
  { ops = ["body=tall", "head+0,-4", "eyes=closed"], ms = 200 },
  { ops = ["body=tall", "head+0,-16"], ms = 900 },
  { ops = ["body=tall", "head+0,-5", "eyes=happy", "prop:leaf@18,3"], ms = 220 },
  { ops = ["eyes=happy", "prop:leaf@18,9"], ms = 400 },
  { ops = ["+mouth.open", "prop:leaf@18,10"], ms = 200 },
  { ops = ["eyes=happy", "prop:leaf@18,9"], ms = 300 },
  { ops = ["+mouth.open", "prop:leaf@17,11"], ms = 200 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: sticks out a long dark tongue and licks its own nose.
[[actions]]
name = "nose-lick"
weight = 1
frames = [
  { ops = ["mouth=tongue"], ms = 300 },
  { ops = ["mouth=tongue", "eyes=cross"], ms = 400 },
  { ops = ["mouth=lick", "eyes=cross", "nose=sniff"], ms = 600 },
  { ops = ["mouth=lick", "eyes=closed"], ms = 300 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
