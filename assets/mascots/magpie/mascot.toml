keek
.ee.
"""

# A stout black beak, pointing left.
[layers.beak]
at = [2, 8]
follows = "head"
grid = """
..kkkkk
.kbbbbb
kbbbbBB
.kkBBBB
...kkkk
"""

[layers."mouth.open"]
at = [2, 7]
follows = "head"
grid = """
..kkkkk
.kbbbbb
kbbkkkk
kpppppp
.kkBBBB
...kkkk
"""

# The loot: a gold coin held in the beak.
[layers."loot.coin"]
at = [1, 10]
follows = "head"
grid = """
.kkkk.
kyyyYk
kyYYYk
kyyYYk
.kkkk.
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "tail-flick"
weight = 4

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: a glint on the rim; it snatches it up and stashes it away.
[[actions]]
name = "stash"
weight = 5
frames = [
  { ops = ["eyes=left", "prop:sparkle@0,13"], ms = 500 },
  { ops = ["all+0,1", "head+-1,2", "eyes=left"], ms = 140 },
  { ops = ["eyes=happy", "tail=flick", "prop:sparkle@0,5"], ms = 500 },
  { ops = ["all+0,4", "tail=flick"], ms = 140 },
  { ops = ["all+0,8"], ms = 300 },
  { ops = ["all+0,3"], ms = 120 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: pops up with a gold coin, shows it off, checks nobody's looking,
# and hides it again.
[[actions]]
name = "treasure"
weight = 1
frames = [
  { ops = ["all+0,8"], ms = 300 },
  { ops = ["all+0,3", "+loot.coin"], ms = 120 },
  { ops = ["+loot.coin", "wings=open", "tail=flick", "eyes=happy", "prop:sparkle@0,4"], ms = 600 },
  { ops = ["+loot.coin", "wings=open", "tail=flick", "eyes=happy", "prop:sparkle@5,13"], ms = 400 },
  { ops = ["+loot.coin", "eyes=right"], ms = 500 },
  { ops = ["+loot.coin", "eyes=left"], ms = 500 },
  { ops = ["all+0,4", "+loot.coin"], ms = 120 },
  { ops = ["all+0,9"], ms = 400 },
  { ops = ["all+0,3"], ms = 120 },
  { ops = ["eyes=happy"], ms = 400 },
]
