# Magpie on bird-perched. A glossy black-and-white thief in three-quarter
# view facing left: black head and bib, a big white belly, a white
# shoulder patch on the folded wing, blue-green sheen on the flight
# feathers, and a long iridescent tail laid out behind it over the rim.
# Signature: spots something shiny on the rim, grabs it, and stashes it in
# the crate. Rare: pops up with a gold coin, shows it off in a glitter,
# glances both ways, and hides it again.
id = "magpie"
name = "Magpie"
category = "birds"
aliases = []
accent = "charcoal"
extends = "bird-perched"

[palette]
"l" = "grey-3"      # black feathers, light
"f" = "grey-4"      # black feathers
"F" = "fur-black"   # black feathers, shadow
"W" = "white"       # belly and shoulder
"G" = "grey-1"      # white shadow
"u" = "blue-2"      # sheen light
"t" = "teal"        # blue-green sheen
"T" = "blue-3"      # sheen shadow
"e" = "grey-2"      # pale eye ring
"h" = "white"       # eye highlight
"b" = "grey-3"      # beak and feet
"B" = "fur-black"   # beak shadow
"p" = "red-2"       # inside of the beak
"y" = "yellow-1"    # coin
"Y" = "yellow-2"    # coin shadow

# Black bib on top, a big white belly in front.
[layers.body]
at = [5, 12]
grid = """
..kkllllllllllllffkk..
.klllfffffffffffffFFk.
kllfGWWWWWWWfffffffFFk
klfGWWWWWWWWWffffffFFk
kfGWWWWWWWWWWWfffffFFk
kGWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
kWWWWWWWWWWWWWWffffFFk
"""

# The folded wing: a white shoulder over blue-green flight feathers.
[layers.wings]
at = [16, 13]
grid = """
..kkkkkkk..
.kWWWWWWWk.
kWWWWWWWGGk
kfGGGGGGGfk
kutttttttTk
kuttTttTtTk
kutTttTtTTk
kttTtTtTTTk
.kTTTTTTTk.
..kkkkkkk..
"""

[layers."wings.open"]
at = [16, 9]
grid = """
.......kkk.
.....kkuttk
....kutttTk
..kkWWttTTk
.kWWWWWtTTk
kWWWWWWWGGk
kfGGGGGGGfk
kutttttttTk
kuttTttTtTk
kutTttTtTTk
kttTtTtTTTk
.kTTTTTTTk.
..kkkkkkk..
"""

# The long tail, laid out behind over the rim.
[layers.tail]
at = [24, 8]
grid = """
......kk
.....kuk
....kutk
...kuttk
..kuttTk
.kuttTk.
kuttTTk.
kttTTk..
kTTTk...
kkkk....
"""

[layers."tail.flick"]
at = [23, 6]
grid = """
.....kk.
....kuk.
....kutk
...kuttk
...kutTk
..kuttk.
..kutTk.
.kuttk..
.kutTk..
kttTk...
kTTk....
kkk.....
"""

# Three-quarter view, facing left: glossy black all over.
[layers.head]
at = [6, 3]
grid = """
.....kkkkkkkkkk.....
....kklllllfffkk....
...klllfffffffffk...
..klffffffffffffFk..
.klfffffffffffffFFk.
.klfffffffffffffFFFk
.kffffffffffffffFFFk
.kffffffffffffffFFFk
..kfffffffffffffFFk.
...ffffffffffffFFk..
...fffffffffffFFF...
"""

[layers.eyes]
at = [11, 7]
follows = "head"
grid = """
.ee.
ehke
ekke
.ee.
"""

[layers."eyes.closed"]
at = [11, 7]
follows = "head"
grid = """
.ee.
eeee
kkkk
.ee.
"""

[layers."eyes.left"]
at = [11, 7]
follows = "head"
