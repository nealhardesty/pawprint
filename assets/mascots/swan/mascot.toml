..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
..klfffffffffffffffffffffFFGGk
"""

# Wings arched high over the back, for the rare hiss.
