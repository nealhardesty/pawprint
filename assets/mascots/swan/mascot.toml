# Swan on bird-water. Drawn side on, facing left: a long white S of a neck
# rising from a floating body with raised wing tips, a small head with a
# black knob and mask, and an orange bill. The `head` layer carries the
# whole neck, so `head.curve` can bend it. The base `wings` and `feet` are
# left out of `rest`: the folded wing is drawn into the body, and a swan's
# feet are under water. Signature: the neck curves down and it preens its
# chest. Rare: wings arched high, it hisses like the goose it is mistaken
# for.
id = "swan"
name = "Swan"
category = "birds"
aliases = ["goose"]
accent = "ice"
extends = "bird-water"
rest = ["body", "head", "eyes", "bill"]

[palette]
"l" = "white"       # feathers light
"f" = "white"       # feathers
"F" = "grey-1"      # feather shadow
"G" = "grey-2"      # deepest shadow
"K" = "fur-black"   # knob and mask
"b" = "orange-2"    # bill
"B" = "orange-3"    # bill shadow
"p" = "orange-3"    # inside of the bill

[layers.body]
at = [1, 10]
grid = """
.....................kk.kk....
...................kkllkllk.k.
................kkkllffllffkFk
.......kklffffffllffffFffffFFk
.....kklllfffffffffffFfffffFFk
....klllffffffffffffFfffffFFGk
