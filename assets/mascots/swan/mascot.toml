[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "bob"
weight = 4

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the neck curves down, preens the chest twice, and rises.
[[actions]]
name = "preen"
weight = 5
frames = [
  { ops = ["head=curve", "eyes+1,3", "bill+1,3"], ms = 500 },
  { ops = ["head=curve", "eyes+1,3", "bill+1,3", "eyes=closed", "head+0,1"], ms = 200 },
  { ops = ["head=curve", "eyes+1,3", "bill+1,3", "eyes=closed"], ms = 160 },
  { ops = ["head=curve", "eyes+1,3", "bill+1,3", "eyes=closed", "head+0,1"], ms = 200 },
  { ops = ["head=curve", "eyes+1,3", "bill+1,3", "eyes=happy"], ms = 600 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: arches its wings, lowers its head, and hisses.
[[actions]]
name = "hiss"
weight = 1
frames = [
  { ops = ["+wings.arch", "wings+0,4"], ms = 120 },
  { ops = ["+wings.arch", "wings+0,1"], ms = 200 },
  { ops = ["+wings.arch", "head=curve", "eyes+1,3", "bill+1,3", "all+-1,0"], ms = 200 },
  { ops = ["+wings.arch", "head=curve", "eyes+1,3", "-bill", "+mouth.open", "mouth+1,3", "all+-2,0"], ms = 900 },
  { ops = ["+wings.arch", "head=curve", "eyes+1,3", "bill+1,3", "all+-1,0"], ms = 200 },
  { ops = ["+wings.arch", "wings+0,3"], ms = 160 },
  { ops = [], ms = 300 },
]
