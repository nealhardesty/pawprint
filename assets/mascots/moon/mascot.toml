# Moon, an object on `orb` (nocturnal): the pale grey moon, pocked with
# round craters, with a sleepy smile. It is up at night, of course. The
# signature makes its craters sparkle as it smiles; the rare one, after
# dark, pulls on a little striped nightcap with a pompom and dozes off.
id = "moon"
name = "Moon"
category = "space"
aliases = ["luna"]
accent = "ice"
nocturnal = true
extends = "orb"

[palette]
"l" = "white"       # light
"f" = "grey-1"      # moon grey
"F" = "grey-2"      # shadow
"M" = "grey-2"      # crater walls
"m" = "grey-1"      # crater floors
"W" = "white"       # crater rims
"h" = "grey-3"      # eye highlight: white would vanish on pale grey
"b" = "blue-2"      # nightcap
"B" = "blue-3"      # nightcap shadow
"w" = "white"       # nightcap trim and pompom

# The moon, the plain orb shape in pale grey.
[layers.head]
grid = """
................................
................................
................................
............kkkkkkkk............
..........kkllllllllkk..........
.........kllllllffffffk.........
........klfffffffffffffk........
.......klfllffffffffffffk.......
......klfflfffffffffffffFk......
......klffffffffffffffffFk......
.....klffffffffffffffffffFk.....
.....klffffffffffffffffffFk.....
.....klfffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
......kffffffffffffffffFFk......
......kffffffffffffffffFFk......
.......kffffffffffffffFFk.......
........kffffFFFFFFFFFFk........
.........kFFFFFFFFFFFFk.........
..........kkFFFFFFFFkk..........
............kkkkkkkk............
................................
................................
................................
................................
................................
................................
................................
"""

# Round craters with lit rims, kept clear of the face.
[layers.craters]
at = [7, 4]
follows = "head"
grid = """
.......MM.......
......MmmW...MM.
.......WW....MmW
..............W.
................
................
................
................
................
.MMM............
MMmmW...........
MmmmW.......MM..
.WWW...MW..MmmW.
............WW..
"""

# A nightcap for the rare action (hidden at rest).
[layers."cap.night"]
at = [2, 1]
follows = "head"
grid = """
.kkk...kkkkkk............
kwwwkkkbbbbbbBk..........
kwwWkbbbbbbbbbbBk........
.kkk.kbbbbbbbbbbbBBk.....
.....kbbbbbbbbbbbbbbBk...
....kbbbbbbbbbbbbbbbbBk..
...kwwwwwwwwwwwwwwwwwwwwk
...kkkkkkkkkkkkkkkkkkkkkk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "double-blink"
weight = 3

[[actions]]
use = "yawn"
weight = 2

[[actions]]
use = "content"
weight = 2

# Signature: its craters sparkle, one after the other, and it smiles a
# sleepy smile.
[[actions]]
name = "crater-sparkle"
weight = 4
frames = [
  { ops = ["prop:sparkle@5,11"], ms = 220 },
  { ops = ["eyes=happy", "prop:sparkle@17,2"], ms = 220 },
  { ops = ["eyes=happy", "prop:sparkle@17,13"], ms = 260 },
  { ops = ["eyes=happy"], ms = 900 },
  { ops = [], ms = 200 },
]

# Rare, at night: it pulls on a nightcap and dozes off.
[[actions]]
name = "nightcap"
weight = 1
when = "night"
frames = [
  { ops = ["+cap.night", "cap+0,-4", "eyes=happy"], ms = 200 },
  { ops = ["+cap.night", "cap+0,-1", "eyes=happy"], ms = 160 },
  { ops = ["+cap.night", "eyes=closed"], ms = 500 },
  { ops = ["+cap.night", "eyes=closed", "prop:zzz@21,4"], ms = 900 },
  { ops = ["+cap.night", "eyes=closed", "prop:zzz@21,2", "all+0,1"], ms = 900 },
  { ops = ["+cap.night", "eyes=closed", "prop:zzz@21,0", "all+0,1"], ms = 700 },
  { ops = [], ms = 200 },
]
