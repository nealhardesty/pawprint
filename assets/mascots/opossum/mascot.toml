# Opossum, on small-quadruped. A grizzled grey body under a white face
# with a long pointed snout and pink nose, dark patches round beady black
# eyes, bare black ears with pink tips, pink hands, and a naked pink tail
# curled up the right side. Nocturnal: busier after dark, napping by day.
# The signature plays dead belly-up (custom frames `dead` and `dead-peek`);
# `joeys` are the babies that ride along in the rare action.
id = "opossum"
name = "Opossum"
category = "mammals"
aliases = ["possum"]
accent = "charcoal"
nocturnal = true
extends = "small-quadruped"

[palette]
"l" = "grey-1"      # fur light, guard hairs
"f" = "grey-2"      # grizzled fur
"F" = "grey-3"      # fur shadow, eye patches
"w" = "white"       # face
"M" = "grey-1"      # shadow on the white
"E" = "fur-black"   # NEW: bare ears
"r" = "pink-1"      # NEW: ear tips
"s" = "pink-1"      # hands, feet, and tail light
"S" = "pink-2"      # hands, feet, and tail
"n" = "pink-2"      # nose
"p" = "pink-1"      # tongue, mouth

# A naked prehensile tail, hooked at the tip.
[layers.tail]
at = [23, 6]
grid = """
..kkkk..
.ksssSk.
kssk.kSk
kSk..kSk
.k..kSSk
....kSk.
...kSSk.
...kSk..
..kSSk..
..kSk...
.kSSk...
.kSk....
kSSk....
kSk.....
"""

[layers."tail.flick"]
at = [23, 5]
grid = """
..kkkk..
.ksssSk.
kssk.kSk
kSk..kSk
.k...kSk
....kSSk
....kSk.
...kSSk.
...kSk..
..kSSk..
..kSk...
.kSSk...
.kSk....
kSSk....
kSk.....
"""

# Grizzled: white-tipped guard hairs over grey.
[layers.body]
at = [6, 13]
grid = """
.klffffffffffffffFk.
klflfffflfffflfffFFk
klffffffffffffffffFk
klfflffflllfffflffFk
klffffflllllllfffFFk
klfffffllllllffffFFk
klfflffflllfffflffFk
