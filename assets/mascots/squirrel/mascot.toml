# Red squirrel, on rodent-upright. Russet and slender, with tufted ears, pale
# eye rings, and the defining feature: a huge bushy tail in an S that rises
# up the right side and curls its tip over the top. The whole body sits 2 px
# left of the base to give the tail room. `tail.flick` snaps the tail tip
# up; `paws.nut` holds a nut at the chest.
id = "squirrel"
name = "Squirrel"
category = "mammals"
aliases = []
accent = "copper"
extends = "rodent-upright"

[palette]
"l" = "orange-2"    # fur light
"f" = "orange-3"    # fur
"F" = "brown-3"     # fur shadow
"r" = "orange-1"    # NEW: tail fluff strands
"w" = "cream"       # belly, cheeks, eye rings
"M" = "brown-1"     # belly shadow
"t" = "white"       # teeth
"n" = "brown-4"     # nose
"p" = "pink-2"      # inner ear, mouth

