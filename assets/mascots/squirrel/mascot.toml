[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 4

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the tail flicks twice, then the squirrel freezes bolt upright,
# eyes wide, before relaxing.
[[actions]]
name = "flick-freeze"
weight = 4
frames = [
  { ops = ["tail=flick"], ms = 120 },
  { ops = [], ms = 120 },
  { ops = ["tail=flick"], ms = 120 },
  { ops = [], ms = 100 },
  { ops = ["all+0,-1", "eyes=right"], ms = 1300 },
  { ops = ["all+0,-1"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a nut drops out of the sky, bonks it on the head, and it catches it.
[[actions]]
name = "nut-bonk"
weight = 1
frames = [
  { ops = ["prop:seed@12,-6"], ms = 120 },
  { ops = ["prop:seed@12,-2"], ms = 100 },
  { ops = ["eyes=closed", "all+0,1", "prop:seed@13,-3", "prop:bang@24,2"], ms = 200 },
  { ops = ["eyes=closed", "prop:seed@14,6"], ms = 120 },
  { ops = ["eyes=left", "prop:seed@13,13"], ms = 500 },
  { ops = ["eyes=happy", "prop:seed@13,13"], ms = 900 },
  { ops = ["prop:seed@13,13"], ms = 300 },
]
