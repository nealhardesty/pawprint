at = [11, 8]
grid = """
k.k....k.k
.k......k.
k.k....k.k
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: a full shake, nose to tail. The head whips side to side with
# the ears flying, the body follows, and loose fur puffs off.
[[actions]]
name = "shake"
weight = 4
frames = [
  { ops = ["eyes=closed"], ms = 160 },
  { ops = ["eyes=closed", "ears=out", "head+-2,0"], ms = 90 },
  { ops = ["eyes=closed", "ears=out", "head+2,0"], ms = 90 },
  { ops = ["eyes=closed", "ears=out", "head+-2,0"], ms = 90 },
  { ops = ["eyes=closed", "ears=out", "head+2,0"], ms = 90 },
  { ops = ["eyes=closed", "all+-1,0", "tail=flick"], ms = 90 },
  { ops = ["eyes=closed", "all+1,0"], ms = 90 },
  { ops = ["eyes=happy", "prop:puff@22,4"], ms = 450 },
  { ops = ["eyes=happy"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: it spots its own tail and spins after it: side, back, mirrored
# side, front, twice round, then sits there dizzy.
[[actions]]
name = "tail-chase"
weight = 1
frames = [
  { ops = ["eyes=right", "tail=flick"], ms = 500 },
  { ops = ["eyes=right", "head+2,0"], ms = 150 },
  { ops = ["head=back", "-eyes", "-nose"], ms = 150 },
  { ops = ["flipx", "eyes=right", "head+2,0"], ms = 150 },
  { ops = ["eyes=right", "head+1,0", "tail=flick"], ms = 150 },
  { ops = ["head=back", "-eyes", "-nose"], ms = 150 },
  { ops = ["flipx", "eyes=right", "head+2,0"], ms = 150 },
  { ops = ["eyes=dizzy", "+mouth.open"], ms = 900 },
  { ops = ["eyes=dizzy", "+mouth.open", "all+1,0"], ms = 300 },
  { ops = ["eyes=closed"], ms = 300 },
  { ops = [], ms = 200 },
]
