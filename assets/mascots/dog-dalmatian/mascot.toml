[layers."ears.out"]
at = [1, 4]
grid = """
..kkkk..................kkkk..
.kdDddkk..............kkssssk.
kdDdddddk............kssddsssk
.kkddddDk............kSsssskk.
...kkkkk..............kkkkk...
"""

