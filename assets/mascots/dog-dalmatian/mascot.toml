# Dalmatian on dog-sit. Snow white and covered in irregular black spots of
# every size: on the crown, cheeks, and muzzle, over the shoulders and down
# the body, on one paw, and along the tail. One ear is solid black, the
# other white with a spot. `ears.out` flings both ears out sideways for the
# shake; `head.back` is the spotted back of the head for the rare tail
# chase, and `eyes.dizzy` is how that ends.
id = "dog-dalmatian"
name = "Dalmatian"
category = "cats-dogs"
aliases = ["dalmatian"]
accent = "cranberry"
extends = "dog-sit"

[palette]
"l" = "white"       # coat light
"f" = "white"       # white coat
"F" = "grey-1"      # coat shadow
"w" = "white"       # muzzle and chest
"M" = "grey-2"      # mouth lines, chin
"d" = "fur-black"   # NEW: spots, the black ear
"D" = "grey-4"      # NEW: sheen on the black ear
"s" = "white"       # white ear
"S" = "grey-1"      # white ear shadow
"h" = "grey-3"      # catchlight: white would vanish into the coat at 1x
"n" = "fur-black"   # nose
"p" = "pink-2"      # tongue

[layers.tail]
at = [25, 12]
grid = """
..kk.
.klk.
.kdFk
klfFk
kdfFk
kfdFk
kffFk
kfdFk
"""

[layers."tail.flick"]
at = [25, 12]
grid = """
...kk.
..klk.
..kdFk
.klfFk
kfdfFk
kdfFk.
kffFk.
kfdFk.
"""

[layers.body]
at = [5, 14]
grid = """
...klffffffffffffFk...
..klffffwwwwwwfffFFk..
.klfffffwwwwwwffffdFk.
kddffffwwwwwwwwffffFFk
kldffffwwwwwwwwffffddk
klfffffwwwwwwwwffffdFk
klffffffwwdwwwfffffFFk
klfddffffwwwwffffffFFk
klffdffffffffffddffFFk
klffffffddffffffdffFFk
klfffffffffffffffffFFk
kddffffffffffffffffFFk
klfffffffffddffffffFFk
klffffffffffffffffddFk
klfffffffffffffffffFFk
klfffddffffffffffffFFk
klffffffffffffdffffFFk
klfffffffffffffffffFFk
"""

[layers.head]
