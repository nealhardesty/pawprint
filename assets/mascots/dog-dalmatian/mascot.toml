# One solid black ear, one white ear with a spot.
[layers.ears]
at = [4, 5]
grid = """
..kkkk............kkkk..
.kdDddk..........kSsssk.
kdDdddk..........kSssssk
kdDdddk..........kSddssk
kdDdddk..........kSddssk
kdDdddk..........kSssssk
kddddDk..........kSssssk
.kdddk............kSsdk.
.kdddk............kSSSk.
..kkk..............kkk..
"""

[layers."ears.flick"]
at = [3, 4]
grid = """
..kkkk...................
.kdDddk............kkkk..
kdDdddk...........kSsssk.
kdDdddk...........kSssssk
kdDdddk...........kSddssk
.kdddDk...........kSddssk
.kdddk............kSssssk
