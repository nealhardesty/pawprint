# Otter, on small-quadruped. Sleek and brown, with a flat round head, tiny
# ears, a broad cream muzzle and chest, a big black nose, whiskers, a thick
# tapering tail, and its favourite pebble held to its chest at all times.
# `eyes.up` follows the pebble when it juggles; `clam` is the shellfish it
# cracks open in the rare action.
id = "otter"
name = "Otter"
category = "mammals"
aliases = []
accent = "sky"
extends = "small-quadruped"

[palette]
"l" = "brown-1"     # fur light
"f" = "brown-2"     # fur
"F" = "brown-3"     # fur shadow, whiskers
"w" = "cream"       # muzzle and chest
"M" = "brown-1"     # shadow on the cream
"s" = "brown-2"     # paws light
"S" = "brown-3"     # paws
"n" = "fur-black"   # nose
"p" = "pink-2"      # mouth
"g" = "grey-1"      # NEW: pebble light
"G" = "grey-2"      # NEW: pebble
"q" = "grey-3"      # NEW: pebble shadow
"c" = "blue-2"      # NEW: clam shell
"C" = "blue-3"      # NEW: clam shell shadow

