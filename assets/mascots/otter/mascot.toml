# Signature: tosses its pebble up, watches it, and catches it again.
[[actions]]
name = "juggle"
weight = 5
frames = [
  { ops = ["paws+0,-1", "pebble+0,-1"], ms = 140 },
  { ops = ["-pebble", "eyes=up", "prop:pebble@13,8"], ms = 110 },
  { ops = ["-pebble", "eyes=up", "head+0,-1", "prop:pebble@13,2"], ms = 160 },
  { ops = ["-pebble", "eyes=up", "head+0,-1", "prop:pebble@13,0"], ms = 260 },
  { ops = ["-pebble", "eyes=up", "prop:pebble@13,6"], ms = 110 },
  { ops = ["pebble+0,1", "paws+0,1", "eyes=happy"], ms = 160 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: it swaps the pebble for a clam, bangs the two together, and the
# clam pops open on a pearl.
[[actions]]
name = "clam-crack"
weight = 1
frames = [
  { ops = ["-pebble", "clam=shut", "eyes=left"], ms = 500 },
  { ops = ["-pebble", "clam=shut", "prop:pebble@13,7"], ms = 160 },
  { ops = ["-pebble", "clam=shut", "eyes=closed", "prop:pebble@13,10", "all+0,1"], ms = 120 },
  { ops = ["-pebble", "clam=shut", "prop:pebble@13,7"], ms = 160 },
  { ops = ["-pebble", "clam=shut", "eyes=closed", "prop:pebble@13,10", "all+0,1"], ms = 120 },
  { ops = ["-pebble", "clam=open", "eyes=up", "prop:sparkle@19,6"], ms = 900 },
  { ops = ["-pebble", "clam=open", "eyes=happy", "prop:sparkle@20,5"], ms = 700 },
  { ops = [], ms = 200 },
]
