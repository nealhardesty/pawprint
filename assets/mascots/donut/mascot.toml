# Shocked.
[layers."eyes.wide"]
at = [10, 8]
follows = "head"
grid = """
.kkk....kkk.
khkk....khkk
kkkk....kkkk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "hop"
weight = 2

[[actions]]
use = "doze"

# Signature: the sprinkles catch the light and twinkle, one, then another.
[[actions]]
name = "twinkle"
weight = 4
frames = [
  { ops = ["prop:sparkle@4,1"], ms = 300 },
  { ops = ["eyes=happy"], ms = 200 },
  { ops = ["eyes=happy", "prop:sparkle@22,8"], ms = 300 },
  { ops = ["eyes=happy"], ms = 200 },
  { ops = ["eyes=happy", "prop:sparkle@2,8"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: CHOMP. A bite vanishes from its own side, it stares in shock,
# chews, and then the bite fills back in as if nothing happened.
[[actions]]
name = "self-bite"
weight = 1
frames = [
  { ops = ["eyes=right"], ms = 400 },
  { ops = ["eyes=closed", "+mouth.open", "head=bitten", "sprinkles=bitten"], ms = 160 },
  { ops = ["eyes=wide", "head=bitten", "sprinkles=bitten", "all+0,-1"], ms = 900 },
  { ops = ["eyes=closed", "+mouth.open", "head=bitten", "sprinkles=bitten"], ms = 200 },
  { ops = ["eyes=closed", "head=bitten", "sprinkles=bitten"], ms = 200 },
  { ops = ["eyes=happy", "prop:sparkle@23,0"], ms = 700 },
  { ops = [], ms = 200 },
]
