# Donut, an object: a fat ring of dough under pink frosting that drips
# unevenly over the sides, covered in sprinkles, with the hole showing
# right through it above the face. The signature makes the sprinkles
# twinkle; the rare one takes a bite out of itself, is shocked, and then
# the bite quietly fills back in.
id = "donut"
name = "Donut"
category = "food"
aliases = ["doughnut"]
accent = "rose"
extends = "orb"

[palette]
"." = "clear"
"k" = "ink"
"l" = "pink-1"      # frosting light
"f" = "pink-2"      # frosting
"F" = "red-2"       # frosting shadow
"d" = "orange-1"    # dough
"D" = "brown-1"     # dough shadow, inside the hole
"y" = "yellow-1"    # sprinkles
"b" = "blue-1"
"w" = "white"
"g" = "green-1"
"h" = "white"       # eye highlight
"P" = "red-1"       # blush
"p" = "red-2"       # inside of the mouth

# The donut. The hole is a real hole: the desktop shows through it.
[layers."head"]
grid = """
................................
................................
