[[actions]]
use = "doze"

# Signature: the jowls wobble, then a big snort blows a puff.
[[actions]]
name = "wobble-snort"
weight = 4
frames = [
  { ops = ["head=wobble-l"], ms = 140 },
  { ops = ["head=wobble-r"], ms = 140 },
  { ops = ["head=wobble-l"], ms = 140 },
  { ops = ["head=wobble-r"], ms = 140 },
  { ops = [], ms = 300 },
  { ops = ["nose=sniff", "eyes=closed"], ms = 150 },
  { ops = ["eyes=squeeze", "all+0,-1", "prop:puff@20,9"], ms = 250 },
  { ops = ["eyes=closed", "prop:puff@21,7"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a colossal snore. Each one heaves the whole dog and blows a puff;
# on the last, it wakes itself up.
[[actions]]
name = "snore"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 400 },
  { ops = ["eyes=squeeze", "mouth=snore", "all+0,-1", "prop:puff@21,8"], ms = 300 },
  { ops = ["eyes=closed", "all+0,1"], ms = 600 },
  { ops = ["eyes=squeeze", "mouth=snore", "all+1,-2", "prop:puff@22,6"], ms = 120 },
  { ops = ["eyes=squeeze", "mouth=snore", "all+-1,-2", "prop:puff@22,5"], ms = 120 },
  { ops = ["eyes=squeeze", "mouth=snore", "all+0,-2", "prop:puff@23,4"], ms = 300 },
  { ops = ["all+0,-1", "prop:bang@27,0"], ms = 400 },
  { ops = ["eyes=left"], ms = 500 },
  { ops = [], ms = 200 },
]
