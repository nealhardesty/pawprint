# Bulldog on dog-sit: a sourpuss with a heart of gold. Red-fawn and white:
# an enormous, wide head wider than the body, a white blaze down to the nose,
# deep wrinkles over the brow, heavy white jowls
# hanging past the chin on both sides, and the underbite: a jutting lower
# jaw with two little teeth poking up over the lip. Small rose ears folded
# back at the top corners, wide-set eyes, a broad nose. `head.wobble-l` and
# `head.wobble-r` swing the jowls; `eyes.squeeze` and `mouth.snore` are for the rare snore.
id = "dog-bulldog"
name = "Bulldog"
category = "cats-dogs"
aliases = ["bulldog"]
accent = "brick"
extends = "dog-sit"
rest = ["tail", "body", "head", "ears.fold", "eyes", "nose", "paws"]

[palette]
"l" = "orange-2"    # red-fawn light
"f" = "orange-3"    # red-fawn coat
"F" = "brown-3"     # coat shadow, brow wrinkles
"w" = "white"       # blaze, jowls, chest, teeth
"M" = "grey-2"      # wrinkles and lip lines on the white
"q" = "brown-4"     # NEW: inside the mouth
"s" = "orange-3"    # rose ears
"S" = "brown-3"     # rose ear shadow
"h" = "white"       # glint
"n" = "fur-black"   # nose
"N" = "grey-4"      # NEW: nostril sheen
"p" = "pink-2"      # tongue

# A short screw tail.
[layers.tail]
