# Lava Lamp: a tapered glass lamp of glowing purple liquid between a silver
# cap and a ribbed cone base, orange wax blobs floating behind its face and
# a pool of wax at the bottom. The signature lets the lava flow: a blob
# lifts off the pool and drifts up while the top one sinks. The rare one
# splits a blob in two; the halves wander apart and join again.
id = "lava-lamp"
name = "Lava Lamp"
category = "things"
aliases = []
accent = "plum"
extends = "object"

