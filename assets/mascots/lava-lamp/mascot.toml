[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 2

[[actions]]
use = "doze"

# Signature: the lava flows. A blob lifts off the pool and drifts up past
# the face while the top blob sinks; the eyes watch it go.
[[actions]]
name = "flow"
weight = 4
frames = [
  { ops = ["head=r1", "eyes=left"], ms = 500 },
  { ops = ["head=r2", "eyes=left"], ms = 500 },
  { ops = ["head=r3"], ms = 600 },
  { ops = ["head=r2"], ms = 500 },
  { ops = ["head=r1"], ms = 400 },
  { ops = [], ms = 300 },
]

# Rare: a blob splits. The top blob pinches in two, the halves drift apart
# and wander, then meet and join again. It looks delighted.
[[actions]]
name = "split"
weight = 1
frames = [
  { ops = ["head=s1"], ms = 500 },
  { ops = ["head=s2", "eyes=happy"], ms = 500 },
  { ops = ["head=s3", "eyes=happy", "mouth=open"], ms = 800 },
  { ops = ["head=s2", "eyes=happy"], ms = 500 },
  { ops = ["head=s1"], ms = 500 },
  { ops = [], ms = 300 },
]
