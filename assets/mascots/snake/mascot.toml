# Snake, on critter. A corn snake piled in the crate: two coils of orange
# scales with dark red saddles, the tail tip poking up at the side (`tail`,
# so tail-flick works), and a small oval head held up on its neck with a
# forked tongue (`tongue.out`). `body.long` stretches the neck for the rare
# periscope look around. No feet, so the base's feet are left out.
id = "snake"
name = "Snake"
category = "critters"
aliases = ["python", "viper"]
accent = "moss"
extends = "critter"

rest = ["body", "head", "eyes", "nose", "tail"]

[palette]
"l" = "orange-1"    # scales light
"f" = "orange-2"    # scales
"F" = "orange-3"    # scales shadow, nostrils
"s" = "red-2"       # NEW: saddles
"w" = "cream"       # belly
"p" = "red-1"       # mouth and tongue

[layers.body]
at = [2, 12]
grid = """
.....kkkkkkkkkkkkkkkkkk.....
....kllllllkffffkllllllk....
....kfssfffklfffkfssfffk....
.kkkkFFFFFFFFFFFFFFFFFFkkkk.
kllllkkkkkkkkkkkkkkkkkkllllk
kffssffffssffffssffffssffffk
kFFFFFFFFFFFFFFFFFFFFFFFFFFk
kwwwwwwwwwwwwwwwwwwwwwwwwwwk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
"""

[layers."body.long"]
at = [2, 9]
grid = """
...........kffffk...........
...........klfssk...........
...........kffffk...........
.....kkkkkkklfffkkkkkkk.....
....kllllllkfffskllllllk....
....kfssfffklfffkfssfffk....
.kkkkFFFFFFFFFFFFFFFFFFkkkk.
kllllkkkkkkkkkkkkkkkkkkllllk
kffssffffssffffssffffssffffk
kFFFFFFFFFFFFFFFFFFFFFFFFFFk
kwwwwwwwwwwwwwwwwwwwwwwwwwwk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
kfssffffffssffffffssffffffsk
