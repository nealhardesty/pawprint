# Polar bear on bear. Cream fur with cool icy-blue shadows, small round ears
# set far back, a long narrow muzzle (the polar bear's Roman nose), a big
# black nose, small dark eyes, and grey claws on the rim. No patches, no big
# ears: it is the plain, long-faced one among the bears. The signature lifts
# its nose and sniffs the cold air; the rare one catches a snowflake.
id = "polar-bear"
name = "Polar Bear"
category = "aquatic"
aliases = []
accent = "ice"
extends = "bear"

[palette]
"h" = "grey-3"      # catchlight: white would vanish into the light fur at 1x
"l" = "white"       # fur light
"f" = "cream"       # fur
"F" = "blue-1"      # fur shadow: icy
"w" = "white"       # muzzle
"M" = "grey-2"      # mouth lines
"c" = "grey-3"      # NEW: claws
"n" = "fur-black"   # nose
"p" = "grey-2"      # inner ear
"e" = "grey-3"      # unused

[layers.body]
at = [4, 14]
grid = """
....klffffffffffffFk....
..kklfffffffffffffFFkk..
.klffffffffffffffffffFk.
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
klfffffffffffffffffffFFk
"""

# Small round ears, set back on the corners of the head.
[layers.ears]
at = [7, 3]
follows = "head"
grid = """
.kk............kk.
klpk..........kpFk
kffk..........kfFk
"""

[layers."ears.flick"]
at = [7, 2]
follows = "head"
grid = """
...............kk.
.kk...........kpFk
klpk..........kfFk
kffk..............
"""

# A long, narrow muzzle.
