grid = """
.FFFFF......FFFFF.
FlllllF....FfffffF
kcfcfck....kcfcfck
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: lifts its nose into the cold air and wiggles it, then lets out
# a frosty breath.
[[actions]]
name = "cold-sniff"
weight = 4
frames = [
  { ops = ["head+0,-1"], ms = 200 },
  { ops = ["head+0,-1", "nose=sniff", "eyes=closed"], ms = 120 },
  { ops = ["head+0,-1", "eyes=closed"], ms = 120 },
  { ops = ["head+0,-1", "nose=sniff", "eyes=closed"], ms = 120 },
  { ops = ["head+0,-1", "eyes=closed"], ms = 300 },
  { ops = ["head+0,-1", "nose=sniff", "eyes=closed"], ms = 120 },
  { ops = ["eyes=happy", "prop:puff@20,10"], ms = 600 },
  { ops = ["eyes=happy", "prop:puff@21,8"], ms = 300 },
]

# Rare: a snowflake drifts down onto its nose and melts.
[[actions]]
name = "snowflake"
weight = 1
frames = [
  { ops = ["prop:sparkle@18,0"], ms = 400 },
  { ops = ["eyes=right", "prop:sparkle@17,3"], ms = 400 },
  { ops = ["eyes=cross", "prop:sparkle@14,6"], ms = 400 },
  { ops = ["eyes=cross", "prop:sparkle@13,9"], ms = 700 },
  { ops = ["eyes=closed", "nose=sniff", "prop:sweat@13,10"], ms = 400 },
  { ops = ["eyes=happy"], ms = 600 },
]
