..kkllllllllllffkk..
.kllfffffffffffffFk.
klfffffffffffffffFFk
klfffffffffffffffFFk
klfffffffffffffffFFk
.kffffffffffffffFFk.
..kffffwwwwwwfffFk..
...kfwwwwwwwwwwFk...
...kfwwwwwwwwwwFk...
...kfwwwwMMwwwwFk...
....kFwwMwwMwwFk....
.....kkFFFFFFkk.....
"""

[layers.eyes]
