# Meerkat, on rodent-upright. The tallest, thinnest thing in a crate: a
# small sandy head that tapers to a pointed snout, dark crescent patches
# round the eyes, little dark ears low on the sides of the head, a slim
# neck with a cream front, two front paws dangling at the chest, and a thin
# dark-tipped tail standing up behind it. The signature is sentry duty: it
# stretches up tall and scans left, then right. The rare one is a second
# meerkat popping up beside it to look too; then both duck.
id = "meerkat"
name = "Meerkat"
category = "mammals"
aliases = []
accent = "ochre"
extends = "rodent-upright"

[palette]
"l" = "cream"       # fur light
"f" = "brown-1"     # sandy fur
"F" = "brown-2"     # fur shadow
"w" = "cream"       # muzzle and front
"M" = "brown-1"     # shadow on the cream
"d" = "brown-4"     # NEW: eye patches, ears, tail tip
"n" = "fur-black"   # nose
"h" = "white"       # eye glint

# A thin tail, held up behind, with a dark tip.
[layers.tail]
at = [24, 8]
grid = """
