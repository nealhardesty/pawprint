[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "tail-flick"
weight = 2

[[actions]]
use = "doze"

# Signature: on sentry. It stretches up tall, scans left, then right,
# then settles.
[[actions]]
name = "sentry"
weight = 5
frames = [
  { ops = ["all+0,-1"], ms = 120 },
  { ops = ["all+0,-2", "paws+0,-1"], ms = 300 },
  { ops = ["all+0,-2", "paws+0,-1", "head+-1,0", "eyes=left"], ms = 800 },
  { ops = ["all+0,-2", "paws+0,-1"], ms = 160 },
  { ops = ["all+0,-2", "paws+0,-1", "head+1,0", "eyes=right"], ms = 800 },
  { ops = ["all+0,-2", "paws+0,-1"], ms = 300 },
  { ops = ["all+0,-1"], ms = 120 },
  { ops = [], ms = 200 },
]

# Rare: a second meerkat pops up beside it. They swap a look, then both
# duck into the crate, and only one comes back up.
[[actions]]
name = "two-on-watch"
weight = 1
frames = [
  { ops = ["+buddy.up", "buddy+0,10"], ms = 120 },
  { ops = ["+buddy.up", "buddy+0,3"], ms = 120 },
  { ops = ["+buddy.up", "eyes=left", "head+-1,0"], ms = 900 },
  { ops = ["+buddy.up", "eyes=happy"], ms = 500 },
  { ops = ["+buddy.up", "all+0,6"], ms = 100 },
  { ops = ["+buddy.up", "all+0,15"], ms = 700 },
  { ops = ["all+0,4"], ms = 140 },
  { ops = [], ms = 300 },
]
