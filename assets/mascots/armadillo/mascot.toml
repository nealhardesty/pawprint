# Armadillo (dillo), a bespoke showcase mascot: no base. Drawn in profile,
# facing left, so the banded shell reads at a glance: a high dome with
# shadow seams between the bands, a narrow pointed head under a head shield,
# tall upright ears, a ringed tail, and clawed front feet on the rim. It
# curls into a ball (custom frames) whose seams turn as it rolls.
id = "armadillo"
name = "Armadillo"
category = "mammals"
aliases = ["dillo"]
accent = "slate"

[palette]
"." = "clear"
"k" = "ink"
"l" = "grey-1"      # shell light
"f" = "grey-2"      # shell
"F" = "grey-3"      # shell shadow
"B" = "grey-4"      # seams between the bands
"s" = "pink-1"      # inner ears
"S" = "pink-2"      # inner ear shadow
"M" = "grey-3"      # tail tip in the ball
"n" = "pink-2"      # nose tip
"h" = "white"       # eye highlight

# The banded dome. Bands run top to bottom between the front (left) and
# rear (right) shields.
[layers.body]
at = [8, 5]
grid = """
........kkkkk........
......kkBllBlkk......
....kkllBllBlfBkk....
...klBllBllBlfBfFk...
..kllBllBllBlfBffFk..
..klfBffBffBffBffFk..
.klffBffBffBffBfffFk.
.klffBffBffBffBfffFk.
klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
