klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
klfffBffBffBffBffffFk
"""

[layers.tail]
at = [27, 13]
grid = """
kkk..
BfBk.
kkfBk
..kfk
..kBk
..kfk
..kkk
"""

# A narrow head under a shell-colored head shield, the snout tapering down
# to the left, and the throat running down to the feet.
[layers.head]
at = [0, 7]
grid = """
.......kkkkkk.
.....kkllllllk
....kllllffffk
...kllfffffffk
..klfffffffffk
.klffffffffFFk
klfffffffFFFk.
knfFFFFFFFFk..
.kkkkkFFFFFk..
.....kfFFFFk..
.....kfFFFFk..
"""

[layers.ears]
at = [8, 1]
grid = """
.k...k.
ksk.kSk
ksk.kSk
kssksSk
kSsSkSk
.kSsSk.
"""

[layers.eyes]
at = [8, 9]
grid = """
hk
kk
"""

[layers."eyes.closed"]
at = [8, 10]
grid = """
kk
"""

# Front feet with long pale claws hooked over the rim.
[layers.paws]
at = [4, 17]
grid = """
..kfffk..
.kffFFFk.
klFlFlFk.
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "peek"
weight = 4

[[actions]]
use = "doze"

# Signature: curls into a ball, rolls half a turn, peeks out of the top.
[[actions]]
name = "curl-roll"
weight = 4
frames = [
  { ops = ["eyes=closed"], ms = 150 },
  { grid = "ball-0", ms = 400 },
  { grid = "ball-90", ms = 160 },
  { grid = "ball-180", ms = 500 },
  { grid = "ball-peek-top", ms = 900 },
  { grid = "ball-180", ms = 200 },
  { ops = [], ms = 300 },
]

# Rare: rolls right off the crate, then rolls back in from the other side.
[[actions]]
name = "roll-away"
weight = 1
frames = [
  { grid = "ball-0", ms = 300 },
  { grid = "ball-90", ops = ["all+5,0"], ms = 110 },
  { grid = "ball-180", ops = ["all+10,0"], ms = 110 },
  { grid = "ball-270", ops = ["all+16,0"], ms = 110 },
  { grid = "ball-0", ops = ["all+21,0"], ms = 110 },
  { ops = ["all+40,0"], ms = 800 },
  { grid = "ball-90", ops = ["all+-21,0"], ms = 110 },
  { grid = "ball-180", ops = ["all+-14,0"], ms = 110 },
  { grid = "ball-270", ops = ["all+-7,0"], ms = 110 },
  { grid = "ball-0", ms = 300 },
  { grid = "ball-peek", ms = 600 },
  { ops = [], ms = 300 },
]

