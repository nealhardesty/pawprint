[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "doze"

# Signature: grooms a paw. Two licks, a wipe over the eye, a last lick.
[[actions]]
name = "groom"
weight = 4
frames = [
  { ops = ["paws=lick"], ms = 250 },
  { ops = ["paws=lick", "+mouth.lick", "eyes=closed"], ms = 200 },
  { ops = ["paws=lick", "eyes=closed"], ms = 160 },
  { ops = ["paws=lick", "+mouth.lick", "eyes=closed"], ms = 200 },
  { ops = ["paws=wipe", "eyes=closed", "head+1,0"], ms = 450 },
  { ops = ["paws=lick", "+mouth.lick", "eyes=closed"], ms = 200 },
  { ops = ["paws=lick"], ms = 200 },
  { ops = [], ms = 250 },
]

# Rare: a leaf drifts down. It wiggles, pounces, and sits back with the
# leaf in its mouth, very proud.
[[actions]]
name = "leaf-pounce"
weight = 1
frames = [
  { ops = ["eyes=right", "prop:leaf@21,0"], ms = 400 },
  { ops = ["eyes=right", "prop:leaf@18,3"], ms = 400 },
  { ops = ["eyes=right", "all+1,0", "prop:leaf@20,5"], ms = 130 },
  { ops = ["eyes=right", "all+-1,0", "prop:leaf@20,5"], ms = 130 },
  { ops = ["eyes=right", "all+1,0", "prop:leaf@19,6"], ms = 130 },
  { ops = ["all+0,-3", "paws=up", "eyes=closed", "prop:leaf@18,6"], ms = 200 },
  { ops = ["eyes=happy", "prop:leaf@13,12"], ms = 1200 },
  { ops = [], ms = 250 },
]
