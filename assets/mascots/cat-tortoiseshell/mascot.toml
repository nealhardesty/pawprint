# Tortoiseshell cat on cat-sit. No white anywhere: a black coat mottled all
# over with orange and rust, an orange blaze down the nose, a split nose
# (half pink, half black), mismatched paws (one orange, one black), and a
# tail with an orange tip. A heart-shaped face: a broad flat crown over
# round cheeks, narrowing to a small chin. Small ears, one black and one
# orange. Amber eyes. `paws.lick`, `paws.wipe`, and `mouth.lick` make the
# grooming signature; `paws.up` is the rare pounce.
id = "cat-tortoiseshell"
name = "Tortoiseshell Cat"
category = "cats-dogs"
aliases = ["tortie", "tortoiseshell"]
accent = "copper"
extends = "cat-sit"

[palette]
"l" = "grey-4"      # fur sheen
"f" = "fur-black"   # fur
"F" = "fur-black"   # fur shadow
"o" = "orange-1"    # NEW: mottle, light
"O" = "orange-2"    # NEW: mottle
"R" = "orange-3"    # NEW: rust mottle, and closed-eye lines
"M" = "orange-3"    # mouth lines
"e" = "amber"       # iris
"h" = "white"       # eye glint
"n" = "pink-2"      # nose (the left half)
"p" = "pink-2"      # inner ear, toe beans, tongue

