[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: it drops a little way down its string, bobs at the bottom,
# and climbs back up.
[[actions]]
name = "drop"
weight = 5
frames = [
  { ops = ["head+0,1", "string=one"], ms = 100 },
  { ops = ["head+0,3", "string=three", "eyes=happy"], ms = 120 },
  { ops = ["head+0,2", "string=two", "eyes=happy"], ms = 400 },
  { ops = ["head+0,3", "string=three", "eyes=happy"], ms = 300 },
  { ops = ["head+0,1", "string=one"], ms = 140 },
  { ops = ["head+0,-1"], ms = 140 },
  { ops = [], ms = 200 },
]

# Rare: a trick. It drops all the way into the crate, walks the dog (rolls
# out along the rim on its string and back), and climbs home, proud.
[[actions]]
name = "walk-the-dog"
weight = 1
frames = [
  { ops = ["head+0,4", "string=two", "eyes=closed"], ms = 100 },
  { ops = ["head+0,9", "string=down", "eyes=closed"], ms = 120 },
  { ops = ["head+-7,9", "string=walk", "eyes=happy"], ms = 300 },
  { ops = ["head+-13,9", "string=far", "eyes=happy"], ms = 500 },
  { ops = ["head+-7,9", "string=walk", "eyes=happy"], ms = 300 },
  { ops = ["head+0,9", "string=down", "eyes=right"], ms = 200 },
  { ops = ["head+0,4", "string=two"], ms = 100 },
  { ops = ["head+0,-1"], ms = 140 },
  { ops = ["eyes=happy"], ms = 700 },
  { ops = [], ms = 200 },
]
