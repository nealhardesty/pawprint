........kfwwffffffffwwFkkFk.....
.........kfwwffffffwwFkkFk......
.........kffwwwwwwwwFFkFk.......
..........kkfFwwwwFFkkFk........
............kkFFFFkkkkk.........
..............kkkk..............
................................
