# Yo-Yo, an object: a cranberry-red yo-yo seen a little from the side, so
# the back half peeks out behind the front one past the dark groove, a white
# band round the front disc, and the face inside the band. Its string runs
# from the groove straight up out of the frame. The signature drops it a
# little way down its string and it climbs back up; the rare one is a trick:
# it drops all the way, walks the dog, rolling out along the crate and back
# on its string, and climbs home looking very pleased with itself.
id = "yoyo"
name = "Yo-Yo"
category = "things"
aliases = []
accent = "cranberry"
extends = "orb"

[palette]
"l" = "red-1"       # front disc light
"f" = "red-2"       # front disc
"F" = "brown-4"     # shadow
"B" = "brown-3"     # NEW: the back half
"w" = "white"       # the band
"g" = "grey-2"      # NEW: the string
"P" = "pink-1"      # blush
"p" = "pink-2"      # inside of the mouth

[layers.head]
grid = """
................................
................................
................................
..............kkkkkkkk..........
............kkllllkkBBkk........
..........kkllwwwwllkkBBk.......
.........kllwwwwwwwwffkBBk......
.........klwwllllffwwfkkBBk.....
........klwwlllllfffwwfkkBBk....
.......klwwllffffffffwwfkBFk....
.......klwlllfffffffffwFkkFk....
.......klwllffffffffffwFkkFk....
