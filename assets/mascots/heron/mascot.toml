# Heron on bird-water. A grey heron, side on and facing left: a white face
# and neck streaked with black, a black crest plume trailing behind, a
# yellow dagger of a bill, and grey folded wings. It rests hunched with a
# short kinked neck; `head.mid` and `head.long` carry the neck at full
# stretch. The base's side `wings` and `feet` are left out of `rest`.
# Signature: the neck extends slowly and retracts. Rare: it strikes into
# the crate and swallows a fish whole.
id = "heron"
name = "Heron"
category = "birds"
aliases = ["egret"]
accent = "sky"
extends = "bird-water"
rest = ["body", "head", "eyes", "bill"]

[palette]
"l" = "grey-1"      # feathers light
"f" = "grey-2"      # feathers
"F" = "grey-3"      # feather shadow
"W" = "white"       # face and neck
"w" = "grey-1"      # breast
"d" = "fur-black"   # crest, neck streaks
"y" = "yellow-1"    # bill
"Y" = "yellow-2"    # bill shadow
"s" = "blue-1"      # fish
"S" = "grey-2"      # fish back

