# Signature: the neck stretches up, slow and smooth, looks about, and
# settles back down.
[[actions]]
name = "neck-stretch"
weight = 5
frames = [
  { ops = ["head=mid", "eyes+0,-2", "bill+0,-2"], ms = 400 },
  { ops = ["head=long", "eyes+0,-4", "bill+0,-4"], ms = 500 },
  { ops = ["head=long", "eyes+0,-4", "bill+0,-4", "eyes=left"], ms = 900 },
  { ops = ["head=long", "eyes+0,-4", "bill+0,-4", "eyes=closed"], ms = 140 },
  { ops = ["head=long", "eyes+0,-4", "bill+0,-4"], ms = 400 },
  { ops = ["head=mid", "eyes+0,-2", "bill+0,-2"], ms = 400 },
  { ops = [], ms = 300 },
]

# Rare: spots something in the crate, strikes, and comes up with a fish,
# which goes down in one gulp.
[[actions]]
name = "strike"
weight = 1
frames = [
  { ops = ["eyes=left"], ms = 300 },
  { ops = ["head+0,1", "eyes=left"], ms = 200 },
  { ops = ["all+0,10"], ms = 100 },
  { ops = ["all+0,10"], ms = 300 },
  { ops = ["all+0,2", "+fish.held"], ms = 120 },
  { ops = ["+fish.held", "eyes=happy"], ms = 700 },
  { ops = ["head+0,-1", "eyes=closed"], ms = 200 },
  { ops = ["+lump.down", "eyes=closed"], ms = 250 },
  { ops = ["+lump.down", "lump+0,2", "eyes=happy"], ms = 250 },
  { ops = ["eyes=happy"], ms = 400 },
]
