follows = "head"
grid = """
.k..
kdk.
kDk.
.kDk
.kDk
.kDk
"""

[layers."antenna.right"]
at = [10, 0]
follows = "head"
grid = """
..k.
.kdk
.kDk
kDk.
kDk.
kDk.
"""

[layers."antenna.salute"]
at = [10, 0]
follows = "head"
grid = """
