# Walkie-Talkie: a chunky green two-way radio in the crate, a stubby
# rubber antenna on the left, a dial and a talk light on top, a push-to-talk
# button on its side, and a slotted speaker grille under the face. The
# signature takes a call: the light comes on, the antenna wobbles, and a
# crackle floats up. The rare one signs off over and out: the antenna snaps
# to its brow in a salute, with a wink.
id = "walkie-talkie"
name = "Walkie-Talkie"
category = "things"
aliases = ["walkie"]
accent = "moss"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "green-1"
"f" = "green-2"
"F" = "green-3"
"d" = "grey-3"
"D" = "grey-4"
"m" = "grey-2"
"M" = "grey-3"
"o" = "grey-4"
"r" = "red-1"
"h" = "white"
"P" = "pink-1"
"p" = "pink-2"

