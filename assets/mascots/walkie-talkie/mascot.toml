................................
................................
................................
..................kkkk..........
.........kkkkkkkkkkmMkk.........
........kllllllolllllFFk........
.......klfffffffffffffFFk.......
.......klfffffffffffffFFk.......
.....kkklfffffffffffffFFk.......
.....kDDlfffffffffffffFFk.......
.....kDDlfffffffffffffFFk.......
.....kDDlfffffffffffffFFk.......
.....kkklfffffffffffffFFk.......
.......klfffffffffffffFFk.......
.......klFFFFFFFFFFFFFFFk.......
.......klFDDDDDDDDDDDDFFk.......
.......klFFFFFFFFFFFFFFFk.......
.......klFDDDDDDDDDDDDFFk.......
.......klFFFFFFFFFFFFFFFk.......
.......klFDDDDDDDDDDDDFFk.......
.......klFFFFFFFFFFFFFFFk.......
.......klFDDDDDDDDDDDDFFk.......
.......klFFFFFFFFFFFFFFFk.......
.......klFFFFFFFFFFFFFFFk.......
