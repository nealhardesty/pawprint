"""

[layers."light.on"]
at = [15, 5]
follows = "head"
grid = """
r
"""

[layers."eyes.wink"]
at = [10, 9]
follows = "head"
grid = """
.kk.....hk
k..k....kk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: a call comes in. The talk light comes on, the antenna wobbles,
# and a crackle of sound floats up beside it.
[[actions]]
name = "crackle"
weight = 4
frames = [
  { ops = ["+light.on", "antenna=left"], ms = 120 },
  { ops = ["+light.on", "antenna=right", "prop:note@1,3"], ms = 120 },
  { ops = ["+light.on", "antenna=left", "prop:note@1,2"], ms = 120 },
  { ops = ["+light.on", "prop:note@0,1", "mouth=open"], ms = 600 },
  { ops = ["+light.on", "prop:note@0,0", "eyes=right"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: over and out. The antenna snaps to its brow in a salute, with a
# wink, held a beat.
[[actions]]
name = "over-and-out"
weight = 1
frames = [
  { ops = ["+light.on", "mouth=open"], ms = 300 },
  { ops = ["antenna=right"], ms = 100 },
  { ops = ["antenna=salute", "eyes=wink", "all+0,-1"], ms = 1200 },
  { ops = ["antenna=salute", "eyes=wink"], ms = 300 },
  { ops = ["antenna=right"], ms = 100 },
  { ops = [], ms = 200 },
]
