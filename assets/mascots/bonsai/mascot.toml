......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
......klffffffffffffffffFk......
"""

# The trunk and its pads of needles, one branch cascading over the rim.
[layers."tree"]
follows = "head"
grid = """
.......kkkkkkkk.................
.....kkvvvvgggGkk.......kkkk....
....kvvgggggggggGk...kkkvvggkk..
....kGgggggggggGGk..kvvggggggGk.
.....kkGGGGkkGGkk..kvggggggggGk.
........kkkTTkk.kkkkGGGGGGGGGk..
..kkkk...kTTDkkTTTkkkkkkkkkkk...
.kvvgGkkkkTTDDDkkk..............
kvggggGTTTkTTDk.................
kGgGGGGkkk.kkk..................
.kGGGGk.........................
