# Bonsai, an object: a tiny twisted pine in a glazed blue pot, the face on
# the pot. What makes it itself is the gnarled trunk and the flat cloud
# pads of needles, one branch cascading down over the rim. The signature
# drops a single leaf and watches it fall; the rare one bursts into pink
# blossom for a moment and sparkles.
id = "bonsai"
name = "Bonsai"
category = "nature"
aliases = []
accent = "pine"
extends = "object"
# Template props go to the right of the pot, under the right-hand pad.
prop_offset = [3, 4]

[palette]
"." = "clear"
"k" = "ink"
"w" = "blue-1"      # pot rim and band, light
"l" = "blue-1"      # pot light
"f" = "blue-2"      # pot glaze
"F" = "blue-3"      # pot shadow
"M" = "blue-3"      # rim shadow at the right
"t" = "brown-1"     # trunk light
"T" = "brown-2"     # trunk
"D" = "brown-3"     # trunk shadow
"v" = "green-1"     # needles light
"g" = "green-2"     # needles
"G" = "green-3"     # needles shadow
"h" = "white"       # eye highlight
"P" = "pink-1"      # blush, blossoms
"p" = "pink-2"      # inside of the mouth

# The pot, running down behind the crate front.
[layers."head"]
grid = """
................................
................................
................................
................................
................................
................................
