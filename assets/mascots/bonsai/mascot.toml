[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "double-blink"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: one leaf lets go of the cascading branch and drifts down; the
# eyes follow it all the way to the rim.
[[actions]]
name = "leaf-fall"
weight = 4
frames = [
  { ops = ["eyes=left", "prop:leaf@0,8"], ms = 300 },
  { ops = ["eyes=left", "prop:leaf@1,11"], ms = 300 },
  { ops = ["eyes=left", "prop:leaf@0,14"], ms = 300 },
  { ops = ["eyes=left", "prop:leaf@1,17"], ms = 400 },
  { ops = ["eyes=left"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: for a moment the whole tree bursts into pink blossom.
[[actions]]
name = "blossom"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 300 },
  { ops = ["eyes=closed", "+blossom.open", "head+0,-1"], ms = 160 },
  { ops = ["eyes=happy", "+blossom.open", "prop:sparkle@24,0"], ms = 700 },
  { ops = ["eyes=happy", "+blossom.open", "prop:sparkle@4,0"], ms = 700 },
  { ops = ["eyes=happy", "+blossom.open"], ms = 600 },
  { ops = [], ms = 200 },
]
