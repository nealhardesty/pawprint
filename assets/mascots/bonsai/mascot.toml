"""

# Pink blossom across the pads, hidden until the rare action.
[layers."blossom.open"]
follows = "head"
grid = """
................P...............
........P......PhP..............
.......PhP...P..P......P........
........P...PhP.......PhP..P....
.............P.........P..PhP...
...........................P....
................................
..P.............................
.PhP............................
..P..P..........................
....PhP.........................
.....P..........................
................................
................................
................................
................................
................................
................................
................................
................................
................................
