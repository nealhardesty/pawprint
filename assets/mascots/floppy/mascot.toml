# Floppy, a bespoke oddball: a blue 3.5" diskette standing in the crate,
# with a face doodled on its label. The metal shutter has a window; sliding
# it left lines the window up with the hole and shows the brown disk inside.
# The rare action flips the disk round to show its back, where the metal hub
# spins, and flips it back.
id = "floppy"
name = "Floppy Disk"
category = "oddballs"
aliases = ["diskette"]
accent = "slate"

[palette]
"." = "clear"
"k" = "ink"
"l" = "blue-1"      # plastic light
"f" = "blue-2"      # plastic
"F" = "blue-3"      # plastic shadow, label recess
"w" = "white"       # label, shutter light
"c" = "grey-1"      # label shadow, shutter metal
"C" = "grey-2"      # shutter shadow
"d" = "grey-4"      # hub holes
"o" = "brown-3"     # the disk inside
"O" = "brown-4"     # the disk inside, shadow
"r" = "red-1"       # label stripe
"R" = "red-2"       # label stripe shadow
"p" = "pink-1"      # blush

# Front: chamfered top-right corner, the hole the shutter covers, a striped
# label. It continues behind the crate front.
[layers.body]
at = [4, 1]
grid = """
kkkkkkkkkkkkkkkkkkkkk...
kllllllllllllllllllllk..
klffffffOOOOffffffffffk.
klffffffoooofffffffffffk
