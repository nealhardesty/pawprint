[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "hop"
weight = 3

# Signature: it glances up and slides its shutter open, then closed.
[[actions]]
name = "shutter"
weight = 4
frames = [
  { ops = ["eyes=up"], ms = 300 },
  { ops = ["eyes=up", "shutter+-2,0"], ms = 100 },
  { ops = ["eyes=up", "shutter+-4,0"], ms = 800 },
  { ops = ["eyes=up", "shutter+-2,0"], ms = 100 },
  { ops = ["eyes=up"], ms = 250 },
  { ops = ["eyes=closed"], ms = 140 },
  { ops = [], ms = 200 },
]

# Rare: it flips round to show its back, spins the hub, and flips back.
[[actions]]
name = "flip"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 200 },
  { ops = ["body=edge", "-shutter", "-blush", "-eyes", "-mouth"], ms = 110 },
  { ops = ["body=back", "+hub.a", "-blush", "-eyes", "-mouth", "flipx"], ms = 400 },
  { ops = ["body=back", "+hub.b", "-blush", "-eyes", "-mouth", "flipx"], ms = 140 },
  { ops = ["body=back", "+hub.c", "-blush", "-eyes", "-mouth", "flipx"], ms = 140 },
  { ops = ["body=back", "+hub.d", "-blush", "-eyes", "-mouth", "flipx"], ms = 140 },
  { ops = ["body=back", "+hub.a", "-blush", "-eyes", "-mouth", "flipx"], ms = 400 },
  { ops = ["body=edge", "-shutter", "-blush", "-eyes", "-mouth"], ms = 110 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]
