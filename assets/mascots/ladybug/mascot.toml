# Ladybug, on bug. A round red ladybug climbing up the crate toward you: a
# glossy red dome with a seam down the middle and black spots, a black
# head and collar with two white patches, big white eyes, and short
# antennae. The signature splits the shell open and buzzes its clear wings
# out from underneath; the rare one tips over onto its back, legs waving,
# and flips itself upright again.
id = "ladybug"
name = "Ladybug"
category = "critters"
aliases = ["ladybird"]
accent = "cranberry"
extends = "bug"

# The wings are tucked under the shell at rest.
rest = ["body", "head", "antennae", "eyes", "mouth", "legs"]

[palette]
"l" = "pink-1"      # shell shine
"f" = "red-1"       # shell
"F" = "red-2"       # shell shadow, seam
"j" = "fur-black"   # NEW: spots
"s" = "grey-4"      # head light, underside
"S" = "fur-black"   # head, legs, underside segments
"W" = "white"       # NEW: eyes, collar patches, wing shine
"w" = "blue-1"      # wings
"m" = "grey-1"      # wing shade
"g" = "grey-2"      # NEW: closed eyes and smile on the black head

