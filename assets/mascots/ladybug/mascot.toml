# Signature: the shell splits open and the clear wings buzz out from under
# it, then fold away again.
[[actions]]
name = "wing-buzz"
weight = 4
frames = [
  { ops = ["body=open", "+wings"], ms = 200 },
  { ops = ["body=open", "+wings", "antennae=twitch"], ms = 90 },
  { ops = ["body=open", "wings=open", "all+0,-1"], ms = 90 },
  { ops = ["body=open", "+wings", "all+0,-1"], ms = 90 },
  { ops = ["body=open", "wings=open", "all+0,-1"], ms = 90 },
  { ops = ["body=open", "+wings"], ms = 200 },
  { ops = ["body=open", "+wings"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: it tips over onto its back, legs waving, then flips upright.
[[actions]]
name = "flip-over"
weight = 1
frames = [
  { ops = ["all+0,-2"], ms = 120 },
  { ops = ["body=back", "-head", "-eyes", "-mouth", "-antennae", "-legs"], ms = 300 },
  { ops = ["body=back-kick", "-head", "-eyes", "-mouth", "-antennae", "-legs"], ms = 200 },
  { ops = ["body=back", "-head", "-eyes", "-mouth", "-antennae", "-legs"], ms = 200 },
  { ops = ["body=back-kick", "-head", "-eyes", "-mouth", "-antennae", "-legs"], ms = 200 },
  { ops = ["all+0,-3", "eyes=closed"], ms = 140 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
