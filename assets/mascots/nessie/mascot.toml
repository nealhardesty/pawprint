[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "duck"
weight = 2

[[actions]]
use = "doze"

# Signature: the neck stretches up out of the water and it has a careful
# look around, this way and that.
[[actions]]
name = "look-around"
weight = 4
frames = [
  { ops = ["head=tall", "eyes+0,-3"], ms = 300 },
  { ops = ["head=tall", "eyes+0,-3", "eyes=left"], ms = 600 },
  { ops = ["head=look", "eyes=back", "eyes+2,-3"], ms = 700 },
  { ops = ["head=tall", "eyes+0,-3"], ms = 300 },
  { ops = ["eyes=closed"], ms = 150 },
  { ops = [], ms = 200 },
]

# Rare: it dives, head first and then the humps, leaving a trail of
# bubbles, and pops back up pleased with itself.
[[actions]]
name = "dive"
weight = 1
frames = [
  { ops = ["eyes=closed", "head+0,4", "water=ripple"], ms = 150 },
  { ops = ["head+0,14", "body+0,2", "water=ripple", "prop:bubble@10,9"], ms = 200 },
  { ops = ["head+0,14", "body+0,8", "prop:bubble@9,4", "prop:bubble@20,9"], ms = 400 },
  { ops = ["head+0,14", "body+0,8", "prop:bubble@21,4"], ms = 500 },
  { ops = ["head+0,6", "body+0,4", "water=ripple"], ms = 150 },
  { ops = ["eyes=happy", "water=ripple"], ms = 600 },
  { ops = [], ms = 200 },
]
