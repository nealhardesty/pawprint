# Nessie, on sea-creature. A shy little lake monster, side-on and facing
# left: a small round head with two stubby nubs on top and a long snout, a
# long neck with a cream front rising straight out of the water, and two
# green humps of back and tail breaking the surface behind it. The
# signature stretches the neck up out of the water and has a careful look
# around, this way and that; the rare one dives, humps and all, leaving a
# trail of bubbles, and pops back up looking pleased with itself.
id = "nessie"
name = "Nessie"
category = "mythical"
aliases = ["lochness"]
accent = "moss"
extends = "sea-creature"

# The humps replace the base body; there are no front flippers.
rest = ["body", "head", "eyes", "water"]

[palette]
"l" = "green-1"     # skin light
"f" = "green-2"     # skin
"F" = "green-3"     # skin shadow, mouth line
"w" = "yellow-1"    # neck front
"p" = "pink-2"      # mouth inside

# Two humps of back and tail behind the neck.
