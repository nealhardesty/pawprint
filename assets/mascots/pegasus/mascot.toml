# Pegasus on ungulate-head, mythical. A dapple-grey horse with a dark
# muzzle, a blue mane down the right side of its neck, and a pair of big
# white wings folded and resting on the crate rim either side of it, their
# feather tips blue: the wings make a silhouette nothing else has. The
# signature raises the wings high and flaps them; the rare one flaps hard,
# lifts clear off the crate for a moment, and lands with a puff.
id = "pegasus"
name = "Pegasus"
category = "mythical"
aliases = []
accent = "sky"
extends = "ungulate-head"

rest = ["body", "ears", "head", "eyes", "nose", "mane", "wings"]

[palette]
"l" = "white"       # coat light
"f" = "grey-1"      # coat
"F" = "grey-2"      # coat shadow
"d" = "white"       # NEW: dapples
"m" = "grey-3"      # NEW: muzzle
"M" = "grey-4"      # mouth line
"h" = "white"       # eye glint
"n" = "fur-black"   # nostrils
"p" = "pink-2"      # inner ear, mouth
"s" = "blue-2"      # NEW: mane
"S" = "blue-3"      # NEW: mane shadow
"a" = "white"       # NEW: feathers
"c" = "blue-1"      # NEW: feather shade
"C" = "blue-2"      # NEW: feather tips

