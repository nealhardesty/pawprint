[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: lifts its wings high and gives two big flaps.
[[actions]]
name = "wing-flap"
weight = 4
frames = [
  { ops = ["wings=up"], ms = 240 },
  { ops = [], ms = 160 },
  { ops = ["wings=up", "eyes=closed"], ms = 240 },
  { ops = ["all+0,1"], ms = 160 },
  { ops = ["wings=up", "eyes=happy"], ms = 600 },
  { ops = [], ms = 300 },
]

# Rare: flaps hard, lifts right off the crate, hovers, and lands in a puff.
[[actions]]
name = "lift-off"
weight = 1
frames = [
  { ops = ["wings=up", "all+0,1"], ms = 200 },
  { ops = ["all+0,-2"], ms = 160 },
  { ops = ["wings=up", "all+0,-4", "eyes=happy"], ms = 200 },
  { ops = ["all+0,-5", "eyes=happy"], ms = 200 },
  { ops = ["wings=up", "all+0,-4", "eyes=happy"], ms = 600 },
  { ops = ["all+0,-1"], ms = 140 },
  { ops = ["all+0,1", "prop:puff@0,13", "prop:puff@23,13"], ms = 400 },
  { ops = [], ms = 300 },
]
