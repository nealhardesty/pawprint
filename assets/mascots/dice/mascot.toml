# Dice: a white die standing in the crate, seen a little from above and to
# the right, with blue pips on its top and side. On its front, four corner
# pips frame its face, so the face makes a five. The signature is a roll:
# it tumbles over a corner, lands showing new pips, and tumbles back. The
# rare one rolls a six: six big pips fill its front for a beat, then its
# face pops back delighted, with a sparkle.
id = "dice"
name = "Dice"
category = "things"
aliases = ["die"]
accent = "ice"
extends = "object"

[palette]
