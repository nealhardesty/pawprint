[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "hop"
weight = 2

[[actions]]
use = "doze"

# Signature: a roll. It tumbles over a corner and lands showing new pips,
# has a look, and tumbles back.
[[actions]]
name = "tumble"
weight = 4
frames = [
  { ops = ["head=tilt", "eyes=closed", "all+1,-2"], ms = 140 },
  { ops = ["head=b", "eyes=right"], ms = 700 },
  { ops = ["head=b"], ms = 400 },
  { ops = ["head=tilt", "eyes=closed", "all+-1,-2"], ms = 140 },
  { ops = [], ms = 300 },
]

# Rare: it rolls a six. It tumbles, lands with six big pips on its front,
# then its face pops back delighted, with a hop and a sparkle.
[[actions]]
name = "six"
weight = 1
frames = [
  { ops = ["head=tilt", "eyes=closed", "all+1,-2"], ms = 140 },
  { ops = ["head=tilt", "eyes=closed", "all+-1,-2"], ms = 140 },
  { ops = ["head=six", "-eyes", "-mouth", "-blush"], ms = 900 },
  { ops = ["head=b", "eyes=happy", "mouth=open", "all+0,-2", "prop:sparkle@24,0"], ms = 300 },
  { ops = ["head=b", "eyes=happy", "prop:sparkle@25,1"], ms = 800 },
  { ops = ["head=tilt", "eyes=closed", "all+0,-1"], ms = 140 },
  { ops = [], ms = 200 },
]
