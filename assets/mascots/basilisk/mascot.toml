# Signature: the golden frill flares out behind the crown, and it holds a
# fierce little pose.
[[actions]]
name = "frill-flare"
weight = 4
frames = [
  { ops = ["all+0,-1"], ms = 120 },
  { ops = ["body=flare", "all+0,-1", "+mouth.open"], ms = 150 },
  { ops = ["body=flare", "+mouth.open"], ms = 900 },
  { ops = ["body=flare"], ms = 300 },
  { ops = ["eyes=closed"], ms = 150 },
  { ops = [], ms = 200 },
]

# Rare: a hypnotic stare, the eyes narrowing to slits and leaning in...
# then it cracks into a goofy grin.
[[actions]]
name = "hypno-stare"
weight = 1
frames = [
  { ops = ["eyes=narrow"], ms = 500 },
  { ops = ["eyes=narrow", "head+0,1"], ms = 900 },
  { ops = ["eyes=narrow", "head+0,1"], ms = 400 },
  { ops = ["eyes=goofy", "-mouth", "+mouth.grin"], ms = 700 },
  { ops = ["eyes=happy", "-mouth", "+mouth.grin"], ms = 600 },
  { ops = [], ms = 200 },
]
