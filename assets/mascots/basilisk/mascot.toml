# Basilisk, on critter. The little serpent king: a teal lizard face on,
# wearing a three-pointed golden crown on its head, with a fierce, heavy-
# lidded golden stare (slit pupils), two tiny white fangs, a yellow scaled
# belly, a snaky tail curling up beside it, and claws on the rim. Fierce,
# but mostly cute. The signature flares a spiky golden frill out behind
# its head like a royal collar; the rare one is a hypnotic stare, eyes
# narrowing to slits, that falls apart into a goofy grin.
id = "basilisk"
name = "Basilisk"
category = "mythical"
aliases = []
accent = "teal"
extends = "critter"

[palette]
"l" = "green-1"     # scales light
"f" = "teal"        # scales
"F" = "green-3"     # scales shadow
"w" = "yellow-1"    # belly plates
"M" = "yellow-2"    # NEW: belly shadow
"e" = "yellow-1"    # iris
"g" = "amber"       # NEW: crown
"G" = "orange-3"    # NEW: crown band shadow
"y" = "yellow-2"    # NEW: frill
"Y" = "orange-2"    # NEW: frill spines
"W" = "white"       # NEW: fangs
"p" = "red-1"       # mouth inside and tongue

