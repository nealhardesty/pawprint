# Signature: the slowest blink in the catalog, and a smile.
[[actions]]
name = "slow-blink"
weight = 5
frames = [
  { ops = ["eyes=half"], ms = 600 },
  { ops = ["eyes=closed"], ms = 1400 },
  { ops = ["eyes=half"], ms = 700 },
  { ops = ["eyes=happy"], ms = 1000 },
]

# Rare: raises one long arm, ever so slowly, and waves hello.
[[actions]]
name = "slow-wave"
weight = 1
frames = [
  { ops = ["eyes=half"], ms = 500 },
  { ops = ["paws=wave", "eyes=half"], ms = 700 },
  { ops = ["paws=wave2", "eyes=happy"], ms = 700 },
  { ops = ["paws=wave", "eyes=happy"], ms = 700 },
  { ops = ["paws=wave2", "eyes=happy"], ms = 700 },
  { ops = ["eyes=half"], ms = 500 },
]
