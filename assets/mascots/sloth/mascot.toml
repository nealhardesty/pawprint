# Sloth on primate. Where the monkey is all ears and mischief, the sloth has
# no visible ears (`ears` is left out of `rest`), a round shaggy brown
# head, a cream face mask with the sloth's dark stripes running from the eyes
# down and back, a permanent gentle smile drawn into the head, and long
# cream claws hooked over the rim. The signature is the slowest blink in the
# catalog (about three seconds, with a half-lidded stop each way); the rare
# one is a wave, also very slow.
id = "sloth"
name = "Sloth"
category = "mammals"
aliases = []
accent = "moss"
extends = "primate"

rest = ["body", "head", "eyes", "nose", "paws"]

[palette]
"l" = "brown-1"     # fur light
"f" = "brown-2"     # fur
"F" = "brown-3"     # fur shadow
"w" = "cream"       # face mask
"M" = "brown-3"     # smile
"d" = "brown-4"     # NEW: eye stripes, nose
"c" = "cream"       # NEW: claws
"h" = "white"       # eye glint
"p" = "pink-2"      # mouth inside

