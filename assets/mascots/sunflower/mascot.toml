[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 2

[[actions]]
use = "doze"

# Signature: it turns its face up toward the sun and basks for a moment.
[[actions]]
name = "sun-turn"
weight = 4
frames = [
  { ops = ["eyes=right"], ms = 300 },
  { ops = ["eyes=right", "head+1,0"], ms = 160 },
  { ops = ["eyes=happy", "head+1,-1"], ms = 200 },
  { ops = ["eyes=happy", "head+1,-1", "prop:sparkle@25,0"], ms = 900 },
  { ops = ["eyes=happy", "head+1,-1"], ms = 400 },
  { ops = ["eyes=right", "head+1,0"], ms = 160 },
  { ops = [], ms = 200 },
]

# Rare: a shake, and a few ripe seeds spill out and fall into the crate.
[[actions]]
name = "seed-drop"
weight = 1
frames = [
  { ops = ["eyes=closed", "head+1,0"], ms = 100 },
  { ops = ["eyes=closed", "head+-1,0"], ms = 100 },
  { ops = ["eyes=closed", "head+1,0", "prop:seed@5,10"], ms = 120 },
  { ops = ["+mouth.open", "prop:seed@5,13", "prop:seed@21,11"], ms = 240 },
  { ops = ["+mouth.open", "prop:seed@5,17", "prop:seed@21,15"], ms = 240 },
  { ops = ["eyes=happy", "prop:seed@21,19"], ms = 240 },
  { ops = ["eyes=happy"], ms = 700 },
  { ops = [], ms = 200 },
]
