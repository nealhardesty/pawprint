# Sunflower, an object: a big brown seed disc with the face on it, a ring
# of golden petals, and two leaves resting on the crate rim. What makes it
# itself is the oversized disc and the petal ring that frames the whole
# face. The signature turns its face up toward the sun and basks; the rare
# one gives a shake and spills a few seeds into the crate, then beams.
id = "sunflower"
name = "Sunflower"
category = "nature"
aliases = []
accent = "marigold"
extends = "object"
# Template props sit high in the top right corner, over the petal tips.
prop_offset = [3, -3]

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-1"     # disc light
"f" = "brown-2"     # disc
"F" = "brown-3"     # disc shadow, seeds
"y" = "yellow-1"    # petal light
"Y" = "yellow-2"    # petal
"o" = "orange-2"    # petal shadow
"v" = "green-1"     # leaf light
"g" = "green-2"     # leaf, stem
"G" = "green-3"     # leaf shadow, stem shadow
"h" = "white"       # eye highlight
"P" = "pink-1"      # blush
"p" = "pink-2"      # inside of the mouth

# The flower head and its stem, which runs down behind the crate front.
[layers."head"]
grid = """
...............kk...............
..............kyYk..............
.........kkk..kyYk..kkk.........
.........kyyk.kyYk.kYYk.........
.........kyyykYYookYYYk.........
