# Kitsune, on small-quadruped. A white spirit fox with a fan of tails:
# snow-white fur, red-rimmed ears, red flame markings over the eyes and on
# the brow, golden eyes, red-tipped toes, and four white tails with
# crimson tips rising behind it like a halo. The signature fans the tails out to all
# nine; the rare one, at night, sends blue foxfire wisps drifting up on
# either side while it smiles with its eyes closed.
id = "kitsune"
name = "Kitsune"
category = "mythical"
aliases = []
accent = "cranberry"
extends = "small-quadruped"

[palette]
"l" = "white"       # fur light
"f" = "white"       # white fur
"F" = "grey-1"      # fur shadow
"w" = "white"       # cheeks, chest
"M" = "grey-1"      # shadow on the white
"S" = "red-2"       # ear rims
"r" = "red-2"       # NEW: markings, tail tips
"R" = "red-1"       # NEW: tail tip light
"e" = "amber"       # iris
"h" = "white"       # eye glint
"n" = "fur-black"   # nose
"p" = "red-2"       # mouth inside
"b" = "blue-1"      # NEW: foxfire
"B" = "blue-2"      # NEW: foxfire core

