[layers."foxfire.lit"]
at = [0, 12]
grid = """
...k.......................k...
..kbk.....................kbk..
.kbbk.....................kbbk.
kbhbBk...................kBbhbk
kbhBBk...................kBBhbk
.kBBk.....................kBBk.
..kk.......................kk..
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "content"
weight = 2

[[actions]]
use = "doze"

# Signature: the tails fan out, all nine, and hold; then fold back.
[[actions]]
name = "tail-fan"
weight = 5
frames = [
  { ops = ["tail=flick"], ms = 120 },
  { ops = ["tail=fan"], ms = 160 },
  { ops = ["tail=fan", "eyes=happy", "all+0,-1"], ms = 1200 },
  { ops = ["tail=fan", "eyes=happy"], ms = 300 },
  { ops = ["tail=flick"], ms = 140 },
  { ops = [], ms = 300 },
]

# Rare, at night: foxfire. Blue wisps flicker up on either side and drift
# away while it smiles with its eyes closed, tails fanned.
[[actions]]
name = "foxfire"
weight = 1
when = "night"
frames = [
  { ops = ["eyes=happy", "tail=flick", "+foxfire.lit", "foxfire+0,6"], ms = 200 },
  { ops = ["eyes=happy", "tail=fan", "+foxfire.lit", "foxfire+0,2"], ms = 400 },
  { ops = ["eyes=happy", "tail=fan", "+foxfire.lit", "foxfire+0,-3"], ms = 500 },
  { ops = ["eyes=happy", "tail=fan", "+foxfire.lit", "foxfire+0,-8"], ms = 500 },
  { ops = ["eyes=happy", "tail=fan", "+foxfire.lit", "foxfire+0,-13"], ms = 400 },
  { ops = ["eyes=happy", "tail=flick"], ms = 300 },
  { ops = [], ms = 200 },
]
