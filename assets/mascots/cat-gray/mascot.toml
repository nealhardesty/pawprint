"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "double-blink"
weight = 3

[[actions]]
use = "doze"

# Signature: the tail curls into a hook and the eyes squint, pleased.
[[actions]]
name = "curl-squint"
weight = 4
frames = [
  { ops = ["tail=curl"], ms = 300 },
  { ops = ["tail=curl", "eyes=squint"], ms = 1200 },
  { ops = ["tail=curl", "eyes=closed"], ms = 300 },
  { ops = ["tail=curl", "eyes=squint"], ms = 700 },
  { ops = [], ms = 200 },
]

# Rare: a sparkle drifts down and lands on its nose. It goes cross-eyed,
# winds up, and sneezes it away.
[[actions]]
name = "sparkle-sneeze"
weight = 1
frames = [
  { ops = ["eyes=right", "prop:sparkle@20,0"], ms = 400 },
  { ops = ["prop:sparkle@16,4"], ms = 400 },
  { ops = ["eyes=cross", "prop:sparkle@13,9"], ms = 1000 },
  { ops = ["eyes=closed", "head+0,-1", "prop:sparkle@13,8"], ms = 350 },
  { ops = ["eyes=closed", "all+0,1", "prop:puff@11,13"], ms = 220 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
