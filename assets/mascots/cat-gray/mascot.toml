# Gray cat on cat-sit: a plush, solid blue-gray shorthair. A pear-shaped
# head with full jowls, softly rounded ears, puffy pale whisker pads, a
# slate nose, and wide-set copper eyes. Silver tipping (`S`) flecks the
# coat. The thick tail is `tail.curl` in the signature: a question-mark hook.
# `eyes.squint` is the contented half-closed look; `eyes.cross` is for the
# sparkle that lands on its nose.
id = "cat-gray"
name = "Gray Cat"
category = "cats-dogs"
aliases = ["graycat", "greycat", "bluecat"]
accent = "slate"
extends = "cat-sit"

[palette]
"l" = "grey-2"      # fur light
"f" = "grey-3"      # fur
"F" = "grey-4"      # fur shadow
"S" = "grey-1"      # NEW: silver tipping
"w" = "grey-2"      # whisker pads
"M" = "grey-4"      # mouth lines
"e" = "orange-2"    # iris (copper)
"h" = "white"       # eye glint
"n" = "grey-4"      # nose
"p" = "pink-2"      # inner ear and mouth

[layers.tail]
at = [25, 7]
grid = """
.kkk.
klSfk
klffk
klfFk
klfFk
klfFk
klfFk
klfFk
klfFk
klfFk
klfFk
klfFk
klfFk
"""

[layers."tail.flick"]
at = [24, 6]
grid = """
.kkk..
klSfk.
kllffk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
.klfFk
"""

# The signature curl: the tip hooks over into a question mark.
[layers."tail.curl"]
