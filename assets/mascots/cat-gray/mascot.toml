grid = """
......kkkkkkkkkk......
....kkllSSllllffkk....
...kllffffffffffFFk...
..klfffffffffffffFFk..
.klfffffffffffffffFFk.
.klfffffffffffffffFFk.
.klfffffffffffffffFFk.
klffffffffffffffffFFFk
klfffffwwwwwwwwfffFFFk
klffffwwwwMMwwwwffFFFk
klfffwwwwMwwMwwwwfFFFk
.kfffffwwwwwwwwfffFFk.
...kkFFFFFFFFFFFFkk...
"""

# Medium ears with softly rounded tips.
[layers.ears]
at = [6, 1]
grid = """
.kk..............kk.
klfk............kfFk
klpfk..........kfpFk
klppfk........kfppFk
klppff........ffppFk
klf..............fFk
"""

