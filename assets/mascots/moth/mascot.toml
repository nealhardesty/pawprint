# Moth, on bug. A rosy maple moth: broad pink wings with a buttery yellow
# band spread wide at rest (`wings`, +open), a fuzzy yellow head and
# thorax, a pink-banded abdomen, big dark eyes, and feathery antennae
# (`antennae`, +twitch). Nocturnal: it dozes by day, and at night it is
# drawn to a glowing star and bumps into it. The signature is a wing
# flutter; the rare one shakes off a puff of wing dust and sneezes.
id = "moth"
name = "Moth"
category = "critters"
aliases = []
accent = "honey"
nocturnal = true
extends = "bug"

[palette]
"l" = "cream"       # fuzz light
"f" = "yellow-1"    # fuzz
"F" = "yellow-2"    # fuzz shadow, smile
"w" = "pink-1"      # wings and abdomen bands
"W" = "pink-2"      # NEW: wing edges and band shadow
"y" = "yellow-1"    # NEW: wing band
"a" = "brown-1"     # NEW: antennae and legs

[layers.wings]
