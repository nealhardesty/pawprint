[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

# Nocturnal: it naps through the day instead of the night.
[[actions]]
use = "doze"
when = "day"

# Signature: a quick wing flutter with the feathery antennae twitching.
[[actions]]
name = "flutter"
weight = 4
frames = [
  { ops = ["wings=open", "antennae=twitch"], ms = 110 },
  { ops = [], ms = 110 },
  { ops = ["wings=open"], ms = 110 },
  { ops = ["antennae=twitch"], ms = 110 },
  { ops = ["wings=open", "all+0,-1"], ms = 130 },
  { ops = ["antennae=twitch"], ms = 300 },
  { ops = [], ms = 200 },
]

# Night: a glowing star appears, the moth flutters up to it, bumps it, and
# drifts back down, delighted anyway.
[[actions]]
name = "to-the-light"
weight = 4
when = "night"
frames = [
  { ops = ["eyes=right", "prop:star@22,0"], ms = 400 },
  { ops = ["wings=open", "all+1,-1", "eyes=right", "prop:star@22,0"], ms = 150 },
  { ops = ["all+2,-2", "eyes=right", "prop:star@22,0"], ms = 150 },
  { ops = ["wings=open", "all+3,-2", "eyes=closed", "prop:star@22,0"], ms = 250 },
  { ops = ["all+2,-1", "eyes=happy", "prop:star@22,0"], ms = 300 },
  { ops = ["wings=open", "all+1,0", "eyes=happy", "prop:star@22,0"], ms = 300 },
  { ops = ["eyes=happy", "prop:star@22,0"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: a wing shake throws off a puff of dust, and it sneezes.
[[actions]]
name = "dust-sneeze"
weight = 1
frames = [
  { ops = ["wings=open", "all+1,0"], ms = 90 },
  { ops = ["all+-1,0"], ms = 90 },
  { ops = ["wings=open", "all+1,0", "prop:puff@3,2"], ms = 90 },
  { ops = ["all+-1,0", "prop:puff@2,1"], ms = 250 },
  { ops = ["eyes=closed", "prop:puff@1,0"], ms = 300 },
  { ops = ["eyes=closed", "all+0,1", "prop:bang@26,0"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
