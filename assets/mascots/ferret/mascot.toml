[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "curious"
weight = 2

[[actions]]
use = "doze"

# Signature: the slink. It pours itself left along the rim, glances back
# over its shoulder, and pours back again.
[[actions]]
name = "slink"
weight = 5
frames = [
  { ops = ["head+-1,1", "paws+-1,0"], ms = 160 },
  { ops = ["all+-2,0", "head+-1,1", "eyes=left"], ms = 160 },
  { ops = ["all+-4,0", "head+-1,1", "eyes=left"], ms = 600 },
  { ops = ["all+-4,0", "eyes=right"], ms = 700 },
  { ops = ["all+-2,0", "eyes=right"], ms = 160 },
  { ops = ["eyes=right"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: the war dance. Back arched high, mouth open, it bounces sideways
# across the rim and back, then flops.
[[actions]]
name = "war-dance"
weight = 1
frames = [
  { ops = ["body=arch", "+mouth.open", "eyes=happy"], ms = 220 },
  { ops = ["body=arch", "+mouth.open", "eyes=happy", "all+-2,-2"], ms = 120 },
  { ops = ["body=arch", "+mouth.open", "eyes=happy", "all+-4,0"], ms = 120 },
  { ops = ["body=arch", "+mouth.open", "eyes=happy", "all+-2,-2", "flipx"], ms = 120 },
  { ops = ["body=arch", "+mouth.open", "eyes=happy", "flipx"], ms = 160 },
  { ops = ["body=arch", "+mouth.open", "eyes=happy"], ms = 200 },
  { ops = ["all+0,1", "eyes=closed", "prop:heart@20,1"], ms = 800 },
  { ops = [], ms = 200 },
]
