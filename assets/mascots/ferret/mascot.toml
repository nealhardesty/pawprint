# Ferret, on small-quadruped. The longest body in the catalog: instead of
# sitting up, it lies along the crate rim like a furry tube, a low arched
# back running from the head at the left to a dark tail at the right. A
# sable coat with dark legs, a cream face with a dark bandit mask across
# the eyes, a cream stripe up the forehead, small round cream-rimmed ears,
# and a pink nose. The signature is a slink: it pours itself along the rim
# to the left, glances back, and pours back. The rare one is the war
# dance: back arched, mouth open, bouncing sideways hops.
id = "ferret"
name = "Ferret"
category = "mammals"
aliases = []
accent = "charcoal"
extends = "small-quadruped"

[palette]
"l" = "brown-2"     # fur light
"f" = "brown-3"     # sable fur, mask
"F" = "brown-4"     # fur shadow
"w" = "cream"       # face, ear rims, underside
"M" = "brown-1"     # shadow on the cream
"s" = "brown-3"     # legs light
"S" = "brown-4"     # legs
"n" = "pink-2"      # nose
"p" = "pink-2"      # mouth inside
"q" = "pink-1"      # NEW: inner ears

# A long tail, held out and up at the right end.
[layers.tail]
at = [26, 8]
grid = """
..kk.
.kSSk
.kSSk
.kfSk
kffSk
kffSk
kfSk.
kfSk.
"""

