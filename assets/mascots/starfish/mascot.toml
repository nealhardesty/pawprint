use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: it waves hello with its upper right arm.
[[actions]]
name = "wave"
weight = 4
frames = [
  { ops = ["head=wave", "eyes=happy"], ms = 200 },
  { ops = ["head=wave-low", "eyes=happy"], ms = 180 },
  { ops = ["head=wave", "eyes=happy"], ms = 180 },
  { ops = ["head=wave-low", "eyes=happy"], ms = 180 },
  { ops = ["head=wave", "eyes=happy", "mouth=open"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: a cartwheel off to the right and back, a fifth of a turn at a time.
[[actions]]
name = "cartwheel"
weight = 1
frames = [
  { ops = ["head=turn", "head+2,-1", "eyes=happy"], ms = 120 },
  { ops = ["head=flip", "head+4,-2", "eyes=happy"], ms = 120 },
  { ops = ["head=turn-more", "head+5,-1", "eyes=happy"], ms = 120 },
  { ops = ["head+5,0", "eyes=happy", "mouth=open"], ms = 500 },
  { ops = ["head=turn-more", "head+3,-1", "eyes=happy"], ms = 120 },
  { ops = ["head=flip", "head+1,-2", "eyes=happy"], ms = 120 },
  { ops = ["head=turn", "head+0,-1", "eyes=happy"], ms = 120 },
  { ops = ["eyes=happy"], ms = 400 },
]
