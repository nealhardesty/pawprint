# Starfish, on sea-creature. A chubby coral sea star sitting on the water,
# its two lower arms dangling in: five fat rounded arms with a dotted cream
# texture, and a little smiling face in the middle. The signature waves
# its upper right arm hello; the rare one cartwheels off to the side and
# back, turning a fifth of a circle at a time, beaming.
id = "starfish"
name = "Starfish"
category = "aquatic"
aliases = ["seastar"]
accent = "rose"
extends = "sea-creature"

# No body or flippers under the water: just the star, its face, the water.
rest = ["head", "eyes", "mouth", "water"]

[palette]
"l" = "pink-1"      # skin light
"f" = "red-1"       # skin
"F" = "red-2"       # skin shadow
"d" = "cream"       # NEW: dotted texture
"p" = "red-2"       # mouth inside

