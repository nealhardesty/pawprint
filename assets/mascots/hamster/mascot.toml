# Golden hamster, on rodent-upright. Round and golden, with a white muzzle
# and the defining feature: fat white cheek pouches that bulge past the head
# (`head.stuffed` bulges them further, `head.mega` further still). No tail
# to speak of. `paws.left` / `paws.right` are the running-in-place steps.
id = "hamster"
name = "Hamster"
category = "mammals"
aliases = []
accent = "honey"
extends = "rodent-upright"

[palette]
"h" = "grey-3"      # catchlight: white would vanish into the light fur at 1x
"l" = "yellow-1"    # fur light
"f" = "orange-1"    # golden fur
"F" = "orange-2"    # fur shadow
"w" = "white"       # cheeks, muzzle, belly
"M" = "grey-1"      # shadow on the white
"t" = "white"       # teeth
"n" = "pink-2"      # nose
"p" = "pink-1"      # inner ear
"P" = "pink-2"      # NEW: mouth inside

# A hamster's tail is hidden in its fur.
[layers.tail]
at = [24, 18]
grid = """
.
"""

