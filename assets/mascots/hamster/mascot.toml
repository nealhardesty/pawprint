weight = 2

[[actions]]
use = "doze"

# Signature: tucks a seed into its cheeks, which puff, then runs in place.
[[actions]]
name = "stuff-and-run"
weight = 5
frames = [
  { ops = ["prop:seed@13,13"], ms = 300 },
  { ops = ["prop:seed@13,12", "head+0,1", "eyes=closed"], ms = 160 },
  { ops = ["head=stuffed", "eyes=happy"], ms = 700 },
  { ops = ["head=stuffed", "paws=left", "all+0,-1"], ms = 110 },
  { ops = ["head=stuffed", "paws=right"], ms = 110 },
  { ops = ["head=stuffed", "paws=left", "all+0,-1"], ms = 110 },
  { ops = ["head=stuffed", "paws=right"], ms = 110 },
  { ops = ["head=stuffed", "paws=left", "all+0,-1"], ms = 110 },
  { ops = ["head=stuffed", "paws=right"], ms = 110 },
  { ops = ["head=stuffed"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: one seed too many. The cheeks go enormous, a seed shoots back out,
# and the hamster sweats.
[[actions]]
name = "overstuffed"
weight = 1
frames = [
  { ops = ["head=stuffed", "prop:seed@13,13"], ms = 300 },
  { ops = ["head=stuffed", "eyes=closed", "head+0,1"], ms = 160 },
  { ops = ["head=mega", "eyes=closed"], ms = 500 },
  { ops = ["head=mega", "eyes=happy"], ms = 600 },
  { ops = ["head=stuffed", "+mouth.open", "prop:seed@20,9"], ms = 120 },
  { ops = ["head=stuffed", "prop:seed@25,3"], ms = 120 },
  { ops = ["head=stuffed", "eyes=left", "prop:sweat@24,4"], ms = 900 },
  { ops = ["eyes=left", "prop:sweat@24,5"], ms = 300 },
  { ops = [], ms = 200 },
]
