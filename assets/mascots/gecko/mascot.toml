[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: the tongue curls up and wipes right across one eye.
[[actions]]
name = "eye-lick"
weight = 4
frames = [
  { ops = ["+mouth.open"], ms = 120 },
  { ops = ["+mouth.open", "+tongue.reach"], ms = 100 },
  { ops = ["+mouth.open", "+tongue.lick"], ms = 300 },
  { ops = ["+mouth.open", "+tongue.reach"], ms = 100 },
  { ops = ["+mouth.open", "+tongue.lick"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 150 },
]

# Rare: three lizard push-ups, toes stuck to the rim, then a proud sparkle.
[[actions]]
name = "push-ups"
weight = 1
frames = [
  { ops = ["all+0,-2", "feet+0,2"], ms = 160 },
  { ops = [], ms = 160 },
  { ops = ["all+0,-2", "feet+0,2"], ms = 160 },
  { ops = [], ms = 160 },
  { ops = ["all+0,-2", "feet+0,2"], ms = 160 },
  { ops = ["eyes=happy", "prop:sparkle@24,0"], ms = 600 },
  { ops = [], ms = 200 },
]
