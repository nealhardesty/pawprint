# Gecko, on critter. A spotted leopard gecko in profile, facing right: a
# rounded snout with the wide gecko smile, a big round eye (green iris, slit
# pupil), a fat banded tail curled up behind it (`tail`, so tail-flick
# works), and splayed legs with sticky white toe pads on the rim. The
# signature licks its own eyeball (`tongue.reach`, `tongue.lick`); the rare
# one does lizard push-ups and shows off.
id = "gecko"
name = "Gecko"
category = "critters"
aliases = ["lizard"]
accent = "moss"
extends = "critter"

[palette]
"l" = "yellow-1"    # skin light
"f" = "yellow-2"    # skin
"F" = "orange-3"    # skin shadow, smile, nostrils
"s" = "brown-3"     # NEW: leopard spots and tail bands
"w" = "cream"       # chin and belly
"e" = "green-1"     # iris
"m" = "white"       # NEW: toe pads
"p" = "pink-2"      # mouth and tongue

