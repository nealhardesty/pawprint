FF......................FF
..FFF................FFF..
"""

[layers."cheese.up"]
at = [0, 13]
grid = """
......kk.
....kkcck
..kkccCck
kkcccccck
kcCcccCck
kcccccccc
kkkkkkkkk
"""

[layers."cheese.rise"]
at = [0, 16]
grid = """
......kk.
....kkcck
..kkccCck
kkcccccck
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "peek"
weight = 3

[[actions]]
use = "doze"

# Signature: whiskers twitch, then it nibbles a cheese crumb down to nothing.
[[actions]]
name = "nibble"
weight = 5
frames = [
  { ops = ["whiskers=twitch"], ms = 100 },
  { ops = [], ms = 100 },
  { ops = ["whiskers=twitch", "nose=sniff"], ms = 100 },
  { ops = ["paws=crumb"], ms = 300 },
  { ops = ["paws=crumb", "head+0,1", "mouth=nibble"], ms = 140 },
  { ops = ["paws=crumb"], ms = 140 },
  { ops = ["paws=bit", "head+0,1", "mouth=nibble"], ms = 140 },
  { ops = ["paws=bit", "eyes=happy"], ms = 500 },
  { ops = ["whiskers=twitch"], ms = 120 },
  { ops = [], ms = 200 },
]

# Rare: a whole wedge of cheese rises over the rim. The mouse can't believe it.
[[actions]]
name = "cheese-wedge"
weight = 1
frames = [
  { ops = ["whiskers=twitch", "nose=sniff"], ms = 200 },
  { ops = ["cheese=rise", "eyes=left"], ms = 300 },
  { ops = ["cheese=up", "eyes=left", "whiskers=twitch"], ms = 500 },
  { ops = ["cheese=up", "all+0,-2", "eyes=left", "prop:bang@24,1"], ms = 300 },
  { ops = ["cheese=up", "eyes=happy", "prop:heart@22,2"], ms = 900 },
  { ops = ["cheese=up", "eyes=happy", "prop:heart@22,0"], ms = 600 },
  { ops = ["cheese=rise", "eyes=happy"], ms = 200 },
  { ops = [], ms = 200 },
]
