.kllffffffffFFk.
klfffffffffffFFk
klfffffffffffFFk
klffwwffffwwffFk
.kfwwwwwwwwwwFk.
..kwwwwwwwwwwk..
...kkwwwwwwkk...
.....kkkkkk.....
"""

# Two huge round ears, set behind the head's top corners.
[layers.ears]
at = [2, 0]
follows = "head"
grid = """
..kkkkk..............kkkkk..
.kllllFk............kllllFk.
kllppppFk..........kllppppFk
klpppppFk..........klpppppFk
klpppppFk..........klpppppFk
klpppppFk..........klpppppFk
kfppppFk............kpppFFk.
.kfFFk..............kFFFFk..
..kk..................kk....
"""

[layers."ears.flick"]
at = [2, 0]
follows = "head"
grid = """
..kkkkk.....................
.kllllFk..............kkkkk.
kllppppFk............kllllFk
klpppppFk..........kllppppFk
klpppppFk..........klpppppFk
klpppppFk..........klpppppFk
kfppppFk...........klpppppFk
.kfFFk..............kppFFk..
..kk.................kkk....
"""

# Eyes set closer together than the base's, to suit the small face.
[layers.eyes]
