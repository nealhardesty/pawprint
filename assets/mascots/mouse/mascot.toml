# House mouse, on rodent-upright. Tiny: a small grey head and body sitting
# low in the crate, two huge round pink-lined ears, whiskers, and a thin pink
# tail hooked up the right side. `whiskers.twitch` fans the whiskers;
# `paws.crumb` holds a cheese crumb (and `.bit`, the last of it); `cheese`
# is the wedge from the rare action.
id = "mouse"
name = "Mouse"
category = "mammals"
aliases = ["mice"]
accent = "slate"
extends = "rodent-upright"

[palette]
"l" = "grey-1"      # fur light
"f" = "grey-2"      # fur
"F" = "grey-3"      # fur shadow, whiskers
"w" = "white"       # muzzle and belly
"M" = "grey-1"      # belly shadow
"t" = "white"       # teeth
"n" = "pink-2"      # nose
"p" = "pink-1"      # inner ear, mouth, tail
"P" = "pink-2"      # NEW: tail shadow
"c" = "yellow-1"    # NEW: cheese
"C" = "yellow-2"    # NEW: cheese holes

[layers.tail]
at = [20, 9]
grid = """
....kkk..
...kpppk.
...kpkkPk
....k.kPk
......kPk
.....kpPk
....kpPk.
...kpPk..
..kpPk...
.kpPk....
kpPk.....
"""

[layers."tail.flick"]
at = [20, 8]
grid = """
.....kkk..
....kpppk.
....kpkPk.
....k.kPk.
.......kPk
......kpPk
.....kpPk.
....kpPk..
...kpPk...
..kpPk....
.kpPk.....
kpPk......
"""

[layers.body]
at = [9, 13]
grid = """
..klffffffFk..
.klfffffffFFk.
klffwwwwwwffFk
klfwwwwwwwwfFk
klfwwwwwwwwfFk
klfwwwwwwwwfFk
klfwwwwwwwMfFk
