[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: a long, round-eyed blue stare, then two silent meows.
[[actions]]
name = "silent-meow"
weight = 4
frames = [
  { ops = ["eyes=stare"], ms = 1000 },
  { ops = ["eyes=stare", "head+0,-1", "+mouth.open"], ms = 450 },
  { ops = ["eyes=stare"], ms = 400 },
  { ops = ["eyes=stare", "head+0,-1", "+mouth.open"], ms = 450 },
  { ops = ["eyes=stare"], ms = 500 },
  { ops = ["eyes=closed"], ms = 200 },
  { ops = [], ms = 300 },
]

# Rare: the meow is not silent after all. It throws its head back and
# sings, then stares as if nothing happened.
[[actions]]
name = "aria"
weight = 1
frames = [
  { ops = ["eyes=closed", "head+0,-1"], ms = 250 },
  { ops = ["eyes=closed", "head+0,-2", "+mouth.open", "prop:note@23,7"], ms = 450 },
  { ops = ["eyes=closed", "head+0,-2", "+mouth.open", "prop:note@24,4", "prop:note@19,0"], ms = 550 },
  { ops = ["eyes=happy", "head+0,-1", "+mouth.open", "prop:note@25,1"], ms = 500 },
  { ops = ["eyes=stare"], ms = 900 },
  { ops = [], ms = 250 },
]
