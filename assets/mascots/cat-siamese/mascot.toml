# Siamese cat on cat-sit. A slim cream cat with a wedge-shaped head and big,
# wide-set ears that flare outward. Dark seal points: a diamond face mask
# that fades at its edges, dark ears, dark paws, and a long, slender dark
# tail. Blue eyes, pupils turned slightly in. `eyes.stare` is the
# round-eyed stare of the signature; `mouth.open` is a small round meow.
id = "cat-siamese"
name = "Siamese Cat"
category = "cats-dogs"
aliases = ["siamese"]
accent = "sky"
extends = "cat-sit"

[palette]
"l" = "white"       # fur light
"f" = "cream"       # fur
"F" = "brown-1"     # fur shadow (warm fawn)
"w" = "white"       # chest
"M" = "brown-3"     # mouth lines on the mask
"q" = "brown-2"     # NEW: point, fading edge
"Q" = "brown-3"     # NEW: point, light
"P" = "brown-4"     # NEW: seal point
"e" = "blue-2"      # iris
"h" = "white"       # eye glint
"n" = "brown-3"     # nose
"p" = "pink-2"      # inner ear and mouth

