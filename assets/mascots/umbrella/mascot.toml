# Umbrella, an object: a wide open canopy of five panels, sky blue and
# white, radiating from the tip, with a scalloped hem and a little wooden
# crook handle peeking over the rim. The face sits on the middle panel. The
# signature lets rain drip from the points of the hem, one side, then the
# other; the rare one has a gust blow it inside out (a startled O) before it
# pops back into shape with a shake.
id = "umbrella"
name = "Umbrella"
category = "things"
aliases = ["brolly"]
accent = "sky"
extends = "object"

[palette]
"l" = "blue-1"      # canopy light
"f" = "blue-2"      # canopy
"F" = "blue-3"      # canopy shadow
"w" = "white"       # white panel
"m" = "grey-1"      # white panel in shadow
"M" = "grey-2"      # the metal tip
"s" = "brown-2"     # NEW: wooden handle
"S" = "brown-3"     # NEW: handle shadow
"p" = "red-2"       # inside of the mouth

[layers.head]
grid = """
...............kk...............
..............kMMk..............
..........kkkklffFkkkk..........
........kkllwwffffmmFFkk........
......kkllwwwffffffmmmFFkk......
.....klllwwwffffffffmmmFFFk.....
....klllwwwwffffffffmmmmFFFk....
...kllfwwwwffffffffffmmmmFFFk...
..kllffwwwwffffffffffmmmmFFFFk..
..klffwwwwwffffffffffmmmmmFFFk..
.kllffwwwwwffffffffffmmmmmFFFFk.
.kllffwwwwffffffffffffmmmmFFFFk.
.klffwwwwwffffffffffffmmmmmFFFk.
kllffwwwwwffffffffffffmmmmmFFFFk
kllffwwwwwffffffffffffmmmmmFFFFk
.klffkwwwkkkffffffffkkkmmmkFFFk.
..kkk.kkk...kkksskkk...kkk.kkk..
..........kk..kssk..............
..........ksk.kssk..............
..........ksskssSk..............
...........kkkkkk...............
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: a raindrop gathers at a point of the hem and drips off, then
# one on the other side; the umbrella watches each go and blinks.
[[actions]]
name = "drip"
weight = 5
frames = [
  { ops = ["eyes=left", "prop:sweat@1,13"], ms = 450 },
  { ops = ["eyes=left", "prop:sweat@1,16"], ms = 120 },
  { ops = ["eyes=closed", "prop:sweat@1,20"], ms = 120 },
  { ops = ["eyes=right", "prop:sweat@26,13"], ms = 450 },
  { ops = ["eyes=right", "prop:sweat@26,16"], ms = 120 },
  { ops = ["eyes=closed", "prop:sweat@26,20"], ms = 120 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]

# Rare: a gust catches it and turns it inside out. A startled O, a beat,
# then it pops back the right way and gives itself a shake.
[[actions]]
name = "inside-out"
weight = 1
frames = [
  { ops = ["eyes=right", "prop:puff@0,6"], ms = 300 },
  { ops = ["all+1,0", "eyes=closed", "prop:puff@2,6"], ms = 120 },
  { grid = "inverted", ms = 700 },
  { grid = "inverted", ops = ["all+1,0"], ms = 120 },
  { ops = ["all+0,-1", "eyes=closed"], ms = 120 },
  { ops = ["all+-1,0", "eyes=closed"], ms = 100 },
  { ops = ["all+1,0", "eyes=closed"], ms = 100 },
  { ops = ["eyes=happy"], ms = 700 },
  { ops = [], ms = 200 },
]

