[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the ears swivel one way, then the other, and the head tilts,
# listening hard.
[[actions]]
name = "listen-tilt"
weight = 4
frames = [
  { ops = ["ears=left", "eyes=left"], ms = 500 },
  { ops = ["ears=right", "eyes=right"], ms = 500 },
  { ops = [], ms = 200 },
  { ops = ["head+1,0", "ears=right"], ms = 200 },
  { ops = ["head+1,1", "ears=right", "eyes=right"], ms = 1000 },
  { ops = ["head+1,0"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: a leaf drifts down, gets tracked all the way, and is snapped out of
# the air; held proudly, then dropped.
[[actions]]
name = "leaf-catch"
weight = 1
frames = [
  { ops = ["eyes=up", "prop:leaf@22,0"], ms = 500 },
  { ops = ["eyes=up", "ears=right", "prop:leaf@20,3"], ms = 500 },
  { ops = ["eyes=right", "prop:leaf@17,6"], ms = 400 },
  { ops = ["+mouth.open", "head+0,-1", "prop:leaf@14,8"], ms = 150 },
  { ops = ["eyes=happy", "prop:leaf@13,11"], ms = 1000 },
  { ops = ["eyes=happy"], ms = 300 },
  { ops = [], ms = 200 },
]
