# German Shepherd on dog-sit. Tan with a black saddle over the shoulders, a
# black cap and nose bridge widening into a black muzzle, tan brows and
# cheeks, and tall, wide, black-rimmed ears standing straight up. The ears
# swivel (`ears.left`, `ears.right`) for the signature; the rare action
# tracks a falling leaf and snaps it out of the air.
id = "dog-german-shepherd"
name = "German Shepherd"
category = "cats-dogs"
aliases = ["shepherd", "gsd", "alsatian"]
accent = "brick"
extends = "dog-sit"

[palette]
"l" = "orange-1"    # tan light, inner ear
"f" = "orange-2"    # tan
"F" = "orange-3"    # tan shadow
"w" = "orange-1"    # pale tan chest
"M" = "orange-3"    # shadow on the chest
"x" = "fur-black"   # saddle, cap, muzzle, ear rims
"X" = "grey-4"      # sheen on the black
"e" = "brown-3"     # iris
"p" = "pink-2"      # tongue

# A bushy tail, black along the top.
[layers.tail]
