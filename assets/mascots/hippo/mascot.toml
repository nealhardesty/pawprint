[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-left"
weight = 2

[[actions]]
use = "doze"

# Signature: the enormous yawn. Eyes squeeze shut and the whole upper head
# swings up off the jaw: pink mouth, four white tusks. Then it snaps shut.
[[actions]]
name = "big-yawn"
weight = 5
frames = [
  { ops = ["eyes=closed", "head+0,-1", "+mouth.open"], ms = 160 },
  { ops = ["eyes=closed", "head+0,-3", "+mouth.open"], ms = 200 },
  { ops = ["eyes=closed", "head+0,-5", "+mouth.open"], ms = 1200 },
  { ops = ["eyes=closed", "head+0,-2", "+mouth.open"], ms = 120 },
  { ops = ["eyes=closed"], ms = 160 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: it wiggles its little ears, sinks to the nostrils, and blows a
# string of bubbles.
[[actions]]
name = "ear-wiggle-bubbles"
weight = 1
frames = [
  { ops = ["ears=flick"], ms = 120 },
  { ops = ["ears+0,-1"], ms = 120 },
  { ops = ["ears=flick"], ms = 120 },
  { ops = ["head+0,2", "jaw+0,2", "eyes=happy", "prop:bubble@6,8"], ms = 400 },
  { ops = ["head+0,2", "jaw+0,2", "eyes=happy", "prop:bubble@5,4", "prop:bubble@20,9"], ms = 400 },
  { ops = ["head+0,2", "jaw+0,2", "eyes=happy", "prop:bubble@4,0", "prop:bubble@21,5"], ms = 400 },
  { ops = ["eyes=happy", "prop:bubble@22,1"], ms = 400 },
  { ops = [], ms = 200 },
]
