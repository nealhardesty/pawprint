# Hippo (hippopotamus), bespoke (no base). Wallowing in a crate full of
# water: a huge grey head that is mostly muzzle, wider at the bottom than
# the top, two eye bumps on top with the eyes peering out under them,
# tiny round ears on the corners, and wide nostrils on the front of the
# snout. The signature is the enormous yawn: the whole upper head swings
# up to show a pink mouth and four white tusks. The rare one wiggles its
# little ears, then blows a string of bubbles through its nostrils.
id = "hippo"
name = "Hippo"
category = "mammals"
aliases = ["hippopotamus"]
accent = "plum"

[palette]
"." = "clear"
"k" = "ink"
"l" = "grey-1"      # hide light
"f" = "grey-2"      # grey hide
"F" = "grey-3"      # hide shadow, lip line
"p" = "pink-1"      # inner ears, mouth
"P" = "pink-2"      # throat
"w" = "white"       # tusks, eye glint
"u" = "blue-1"      # foam
"v" = "blue-2"      # water
"V" = "blue-3"      # deep water

