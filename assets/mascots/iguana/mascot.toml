......kskkslffffffffffffffffFk..
......ksklffffffffccffffffffFk..
......klfffffffffcWWcFFFFFFFFk..
.....klffffffffffCccCdddddddk...
....klfFfffFffffffCCfddddDk.....
...klffFfffFffffffffDdddDk......
...klffFfffFfffffffffddDk.......
...klffFfffFfffffffffdDk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
...klffFfffFffffffffffFk........
"""

[layers.eyes]
at = [22, 8]
grid = """
hk
kk
