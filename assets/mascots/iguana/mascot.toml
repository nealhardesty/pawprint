[layers.feet]
at = [2, 17]
grid = """
.kffk............kffk.
kfffFk..........kfffFk
kfkfkk..........kfkfkk
"""

# The dewlap fanned out wide.
[layers."dewlap.flare"]
at = [20, 12]
grid = """
kwddddddk
kwdddddDk
kwdddddDk
.kwddddDk
.kwdddDk.
.kwdddDk.
..kDDDk..
...kkk...
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "sniff"
weight = 3

[[actions]]
use = "doze"

# Signature: a territorial head bob, three dips, with the dewlap flared.
[[actions]]
name = "bob-and-flare"
weight = 4
frames = [
  { ops = ["all+0,-1", "+dewlap.flare"], ms = 200 },
  { ops = ["all+0,1", "+dewlap.flare"], ms = 140 },
  { ops = ["all+0,-1", "+dewlap.flare"], ms = 140 },
  { ops = ["all+0,1", "+dewlap.flare"], ms = 140 },
  { ops = ["+dewlap.flare"], ms = 600 },
  { ops = [], ms = 200 },
]

# Rare: it basks in the sun, eyes shut, flattening happily onto the rim.
[[actions]]
name = "bask"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 300 },
  { ops = ["eyes=happy", "all+0,1", "prop:sparkle@1,1"], ms = 600 },
  { ops = ["eyes=happy", "all+0,1", "prop:sparkle@5,0"], ms = 600 },
  { ops = ["eyes=happy", "all+0,1", "prop:sparkle@1,1"], ms = 600 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
