# Iguana, on critter. A green iguana side-on on the crate rim, facing right:
# a row of tall yellow spikes running down its neck and back, a long flat
# head with a blunt snout, a big round pale cheek scale under the eye, a
# pale dewlap hanging from its throat, dark bands across its body, and
# clawed feet over the rim. The signature is a territorial head bob with
# the dewlap flaring out into a big fan; the rare one basks in the sun,
# eyes shut and sparkling with contentment.
id = "iguana"
name = "Iguana"
category = "critters"
aliases = []
accent = "pine"
extends = "critter"
# Template props go top-left, over its tail end, clear of the head.
prop_offset = [-18, 0]

# One drawing for head, crest, and body; the base head is unused.
rest = ["body", "eyes", "nose", "feet"]

[palette]
"l" = "green-1"     # skin light
"f" = "green-2"     # skin
"F" = "green-3"     # skin shadow, bands, mouth line, nostril
"s" = "yellow-2"    # NEW: crest spikes
"d" = "green-1"     # NEW: dewlap
"D" = "green-2"     # NEW: dewlap shadow
"w" = "yellow-1"    # dewlap edge
"c" = "grey-1"      # NEW: cheek scale
"C" = "grey-2"      # NEW: cheek scale shadow
"W" = "white"       # NEW: cheek scale shine
"p" = "pink-2"      # mouth inside

# Crest, head, cheek scale, dewlap, and banded body.
[layers.body]
at = [0, 0]
grid = """
................................
................................
................................
