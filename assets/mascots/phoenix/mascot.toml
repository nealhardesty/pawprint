# Phoenix on bird-perched. The firebird: gold and orange feathers shading
# to red, a pale gold breast with flame-shaped markings, a crest of three
# flame tongues, and a streaming flame of a tail behind its right shoulder.
# The crest is the `ears` slot, so `ears.flick` makes it flicker;
# `wings.open` spreads wings tipped with fire. Signature: the wings flare
# and embers spark off them. Rare: it bursts into flame (custom frames
# `blaze-1` and `blaze-2`), burns down to a heap of embers, and rises from
# them again, reborn.
id = "phoenix"
name = "Phoenix"
category = "mythical"
aliases = []
accent = "marigold"
extends = "bird-perched"

[palette]
"l" = "yellow-1"    # feathers light
"f" = "yellow-2"    # golden feathers
"F" = "orange-3"    # feather shadow
"w" = "yellow-1"    # breast
"m" = "orange-2"    # breast flame marks
"h" = "white"       # eye highlight
"e" = "red-2"       # eye ring
"b" = "yellow-2"    # beak and talons
"B" = "orange-3"    # beak shadow
"p" = "red-2"       # inside of the beak
"R" = "red-2"       # flame, outer
"O" = "orange-2"    # flame
"Y" = "orange-1"    # flame, inner
"c" = "orange-1"    # flame, core

# The body, with the flame of a tail streaming up behind it.
[layers.body]
at = [5, 4]
grid = """
.........................kk
........................kRk
.......................kROk
......................kROk.
.....................kROYk.
....................kROYOk.
...................kROYYRk.
..................kROYYORk.
