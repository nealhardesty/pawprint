.klllfffffffffffffFFkRRk...
kllffffffwwwwffffffFFk.....
klfffffwwwwwwwwfffffFk.....
klffffwwwwwwwwwwffffFk.....
klfffwwwwwwwwwwwwfffFk.....
klfffwwwmwwwwmwwwfffFk.....
klfffwwwwwwwwwwwwfffFk.....
