klfffffwwwwwwwwfffffFk.....
klffffffwwwwwwffffffFk.....
klffffffffffffffffffFk.....
klffffffffffffffffffFk.....
klffffffffffffffffffFk.....
klffffffffffffffffffFk.....
klffffffffffffffffffFk.....
"""

# Wings spread, their tips on fire.
[layers."wings.open"]
at = [0, 9]
grid = """
.k............................k.
kRk.k......................k.kRk
kRkkRk....................kRkkRk
kOROROk..................kOROROk
kYOOOROk................kOROOOYk
.kYOOFFk................kFFOOYk.
.kfOFFk..................kFFOfk.
..kfOFk..................kFOfk..
..kffFk..................kFffk..
..kkFkk..................kkFkk..
"""

# The crest: three flame tongues.
[layers.ears]
at = [9, 0]
follows = "head"
grid = """
......kk......
.kk..kRRk..kk.
.kRk.kOOk.kRk.
..kRkROORkRk..
...ROOYYOOR...
"""

[layers."ears.flick"]
at = [9, 0]
follows = "head"
grid = """
.......kk.....
..kk..kRRk..kk
..kRk.kOOk.kRk
..kRkROORkRk..
...ROOYYOOR...
"""

# Glowing eyes: a red ring round each.
[layers.eyes]
at = [10, 7]
follows = "head"
grid = """
.ee......ee.
ehke....ehke
ekke....ekke
.ee......ee.
"""

[layers."eyes.closed"]
at = [10, 8]
follows = "head"
grid = """
eeee....eeee
kkkk....kkkk
"""

[layers."eyes.left"]
at = [10, 7]
follows = "head"
grid = """
.ee......ee.
hkee....hkee
kkee....kkee
.ee......ee.
"""

[layers."eyes.right"]
at = [10, 7]
follows = "head"
grid = """
.ee......ee.
eehk....eehk
eekk....eekk
.ee......ee.
"""

[layers."eyes.happy"]
at = [10, 8]
follows = "head"
grid = """
.kk......kk.
k..k....k..k
"""

[layers.beak]
at = [14, 10]
follows = "head"
grid = """
kbbk
kbBk
.kk.
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: the wings flare open and embers spark off the tips.
[[actions]]
name = "flare"
weight = 5
frames = [
  { ops = ["ears=flick", "wings=open"], ms = 120 },
  { ops = ["wings=open", "all+0,-1", "prop:sparkle@0,2"], ms = 300 },
  { ops = ["ears=flick", "wings=open", "all+0,-1", "eyes=happy", "prop:sparkle@25,3"], ms = 300 },
  { ops = ["wings=open", "all+0,-1", "eyes=happy", "prop:sparkle@1,1"], ms = 300 },
  { ops = ["wings=open"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: bursts into flame, burns down to embers, and rises again.
[[actions]]
name = "rebirth"
weight = 1
frames = [
  { ops = ["wings=open", "ears=flick", "eyes=closed"], ms = 160 },
  { grid = "blaze-1", ms = 150 },
  { grid = "blaze-2", ms = 150 },
  { grid = "blaze-1", ms = 150 },
  { grid = "embers", ms = 700 },
  { grid = "embers", ms = 300, ops = ["prop:sparkle@12,6"] },
  { ops = ["all+0,7", "eyes=closed"], ms = 150 },
  { ops = ["all+0,2", "eyes=closed", "wings=open"], ms = 150 },
  { ops = ["wings=open", "ears=flick", "eyes=happy", "prop:sparkle@0,2", "prop:sparkle@25,1"], ms = 700 },
  { ops = [], ms = 300 },
]

