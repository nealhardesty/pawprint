# Fennec fox, on small-quadruped. A tiny desert fox that is mostly ears:
# two enormous pink-lined ears fan out from a small pale face and fill the
# whole top of the frame. Big dark eyes, a little black nose, white cheeks,
# pale sand fur, cream socks, and a bushy tail with a black tip. The
# signature swivels the giant ears toward one side, then the other, like
# radar dishes; the rare one is a gust of wind that flattens them sideways
# (a puff) until they spring back up.
id = "fennec"
name = "Fennec Fox"
category = "mammals"
aliases = []
accent = "marigold"
extends = "small-quadruped"

[palette]
"l" = "cream"       # fur light
"f" = "brown-1"     # pale sand fur
"F" = "brown-2"     # fur shadow
"w" = "white"       # cheeks, chest
"M" = "grey-1"      # shadow on the white
"s" = "cream"       # socks light
"S" = "brown-1"     # socks
"p" = "pink-1"      # inner ears
"n" = "fur-black"   # nose, tail tip
"h" = "white"       # eye glint

