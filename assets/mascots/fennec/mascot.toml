# Signature: radar ears. Both ears swing to listen left, hold, swing to
# the right, hold, and come back to the middle.
[[actions]]
name = "ear-swivel"
weight = 5
frames = [
  { ops = ["ears=flick"], ms = 140 },
  { ops = ["ears=flick", "eyes=left"], ms = 800 },
  { ops = [], ms = 140 },
  { ops = ["ears=right"], ms = 140 },
  { ops = ["ears=right", "eyes=right"], ms = 800 },
  { ops = ["ears=right"], ms = 140 },
  { ops = [], ms = 300 },
]

# Rare: a gust of desert wind flattens the ears out sideways. It squints,
# braces, and they spring back up.
[[actions]]
name = "gust"
weight = 1
frames = [
  { ops = ["ears=flat", "eyes=squint", "prop:puff@0,1"], ms = 160 },
  { ops = ["ears=flat", "eyes=squint", "all+1,0", "prop:puff@3,1"], ms = 400 },
  { ops = ["ears=flat", "eyes=squint", "all+1,0", "prop:puff@7,0"], ms = 400 },
  { ops = ["ears=flat", "eyes=closed"], ms = 300 },
  { ops = ["all+0,-1"], ms = 120 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
