[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "tail-flick"
weight = 4

[[actions]]
use = "bob"
weight = 3

[[actions]]
use = "doze"

# Signature: two quacks and a waggle of the tail.
[[actions]]
name = "quack"
weight = 5
frames = [
  { ops = ["-bill", "+mouth.open", "head+0,-1"], ms = 160 },
  { ops = [], ms = 120 },
  { ops = ["-bill", "+mouth.open", "head+0,-1"], ms = 200 },
  { ops = ["eyes=closed"], ms = 200 },
  { ops = ["tail=flick", "all+1,0"], ms = 120 },
  { ops = [], ms = 120 },
  { ops = ["tail=flick", "all+1,0"], ms = 120 },
  { ops = [], ms = 300 },
]

# Rare: tips bottoms up into the crate and paddles, then pops back up.
[[actions]]
name = "bottoms-up"
weight = 1
frames = [
  { ops = ["all+0,6"], ms = 120 },
  { ops = ["all+0,17", "+rump.up", "rump+0,-17"], ms = 500 },
  { ops = ["all+0,17", "+rump.kick", "rump+0,-17"], ms = 160 },
  { ops = ["all+0,17", "+rump.up", "rump+0,-17"], ms = 160 },
  { ops = ["all+0,17", "+rump.kick", "rump+0,-17"], ms = 160 },
  { ops = ["all+0,17", "+rump.up", "rump+0,-17"], ms = 600 },
  { ops = ["all+0,5"], ms = 120 },
  { ops = ["all+0,-1", "eyes=happy"], ms = 160 },
  { ops = ["eyes=happy"], ms = 500 },
]
