# Duck on bird-water: a mallard drake. Glossy green head, white neck ring,
# chestnut breast, grey body, a wide yellow bill, and the black curl of a
# tail feather sticking up at its side (a `tail` slot, so tail-flick works).
# Signature: a quack and a tail waggle. Rare: bottoms up, dabbling in the
# crate with its feet in the air.
id = "duck"
name = "Duck"
category = "birds"
aliases = ["mallard"]
accent = "teal"
extends = "bird-water"

[palette]
"l" = "green-1"     # head light
"f" = "green-2"     # head
"F" = "green-3"     # head shadow
"W" = "white"       # neck ring, undertail
"a" = "white"       # body light
"g" = "grey-1"      # body
"G" = "grey-2"      # body shadow
"c" = "brown-2"     # chestnut breast
"C" = "brown-3"     # breast shadow
"K" = "fur-black"   # tail curl
"b" = "yellow-1"    # bill
"B" = "yellow-2"    # bill shadow, nostrils
"o" = "orange-2"    # feet
"O" = "orange-3"    # feet shadow
"p" = "brown-3"     # inside of the bill

[layers.body]
at = [3, 14]
grid = """
