# Dachshund on dog-sit. A black-and-tan doxie: a long tapering snout that
# reaches the rim, tan brow dots, muzzle, and chest, and long floppy ears
# hanging past the jaw. The signature slides the long body up out of the
# crate; the rare action lies the whole sausage along the rim, head at one
# end and wagging tail at the other.
id = "dog-dachshund"
name = "Dachshund"
category = "cats-dogs"
aliases = ["dachshund", "wiener", "doxie"]
accent = "copper"
extends = "dog-sit"

[palette]
"l" = "grey-3"      # coat sheen
"f" = "grey-4"      # black coat
"F" = "fur-black"   # coat shadow
"w" = "orange-2"    # tan points: brows, muzzle, chest, paws
"M" = "orange-3"    # shadow on the tan
"s" = "grey-4"      # ears
"S" = "fur-black"   # ear shadow
"e" = "brown-1"     # iris: light enough to read against the black coat
"p" = "pink-2"      # tongue

