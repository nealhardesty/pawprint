[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: the long body slides up and further out of the crate, holds,
# and slides back down.
[[actions]]
name = "long-slide"
weight = 4
frames = [
  { ops = ["all+0,-1"], ms = 150 },
  { ops = ["all+0,-2"], ms = 150 },
  { ops = ["all+0,-3", "eyes=happy"], ms = 150 },
  { ops = ["all+0,-4", "eyes=happy", "tail=flick"], ms = 900 },
  { ops = ["all+0,-4", "eyes=happy"], ms = 300 },
  { ops = ["all+0,-2"], ms = 200 },
  { ops = ["all+0,-1"], ms = 150 },
  { ops = [], ms = 200 },
]

# Rare: ducks, then the whole dog lies along the rim, end to end, wagging.
[[actions]]
name = "full-length"
weight = 1
frames = [
  { ops = ["all+0,4"], ms = 120 },
  { ops = ["all+0,12"], ms = 250 },
  { grid = "sausage", ms = 500 },
  { grid = "sausage-wag", ms = 160 },
