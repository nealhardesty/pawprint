# Venus Flytrap, an object: a big open trap with toothed jaws and a pink
# inside, two baby traps resting on the crate rim. What makes it itself is
# the gaping jaw itself, which stands in for a mouth. The signature snaps
# shut at nothing and peers around, puzzled; the rare one actually catches
# a fly, chews it over, and looks very pleased with itself.
id = "venus-flytrap"
name = "Venus Flytrap"
category = "nature"
aliases = ["flytrap"]
accent = "moss"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "green-1"     # lobe light
"f" = "green-2"     # lobe
"F" = "green-3"     # lobe shadow
"g" = "green-3"     # stem
"M" = "red-1"       # the red lip of each lobe
"i" = "pink-1"      # inside of the trap
"r" = "red-2"       # deep inside
"c" = "green-1"     # teeth of the near lobe
"C" = "green-2"     # bristles along the rims
"h" = "white"       # eye highlight
"P" = "pink-1"      # blush

