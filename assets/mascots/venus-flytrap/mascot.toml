[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 2

[[actions]]
use = "doze"

# Signature: SNAP! It bites at nothing, then peers left and right for
# whatever it missed, and opens up again.
[[actions]]
name = "snap"
weight = 4
frames = [
  { ops = ["eyes=closed", "head=shut", "all+0,1"], ms = 120 },
  { ops = ["head=shut"], ms = 300 },
  { ops = ["head=shut", "eyes=left"], ms = 500 },
  { ops = ["head=shut", "eyes=right"], ms = 500 },
  { ops = ["eyes=right"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a fly buzzes in, and this time the trap gets it. It chews and
# beams.
[[actions]]
name = "catch"
weight = 1
frames = [
  { ops = ["eyes=right", "prop:sparkle@25,1"], ms = 300 },
  { ops = ["eyes=right", "prop:sparkle@22,6"], ms = 300 },
  { ops = ["prop:sparkle@13,10"], ms = 200 },
  { ops = ["eyes=closed", "head=shut", "all+0,1"], ms = 140 },
  { ops = ["eyes=closed", "head=shut"], ms = 220 },
  { ops = ["eyes=closed", "head=shut", "all+0,1"], ms = 220 },
  { ops = ["eyes=happy", "head=shut"], ms = 1100 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
