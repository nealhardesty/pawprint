klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
klffffffffffffffffFk
"""

# A round face: russet crown, white brow spots, white cheeks and muzzle,
# and a russet tear track under each eye.
[layers.head]
at = [4, 5]
grid = """
......kkkkkkkkkkkk......
....kkllllllllllffkk....
...kllfwwffffffwwfFFk...
..klffffffffffffffffFk..
..klffffffffffffffffFk..
.klfffffffffffffffffFFk.
kwwwwwwFwwwwwwwwFwwwwwwk
kwwwwwwFFwwwwwwFFwwwwwMk
.kwwwwwwFwwwwwwFwwwwwMk.
..kwwwwwwwwwwwwwwwwwMk..
...kkwwwwwwwwwwwwwMkk...
.....kkkMMMMMMMMkkk.....
"""

# Big rounded ears with white rims and dark insides.
[layers.ears]
at = [4, 1]
follows = "head"
grid = """
..kkkk............kkkk..
.kwwwwk..........kwwwwk.
kwwSSwwk........kwwSSwwk
kwSSSfwk........kwfSSSwk
kwSSffk..........kffSSwk
.kkffk............kffkk.
"""

[layers."ears.flick"]
at = [4, 0]
follows = "head"
grid = """
..................kkkk..
..kkkk...........kwwwwk.
.kwwwwk.........kwwSSwwk
kwwSSwwk........kwfSSSwk
kwSSSfwk.........kffSSwk
kwSSffk...........kffkk.
.kkffk..................
"""

[layers.nose]
at = [15, 12]
follows = "head"
grid = """
nn
"""

[layers."nose.sniff"]
at = [14, 11]
follows = "head"
grid = """
knnk
"""

[layers.mouth]
at = [14, 13]
follows = "head"
