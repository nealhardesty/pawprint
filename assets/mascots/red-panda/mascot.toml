# Red panda, on small-quadruped. Told apart from the fox at a glance: a
# round face (not a pointed one) that is white from the brows down, with
# russet tear tracks running from the eyes; big rounded white-rimmed ears;
# a dark chest and black arms; and a ringed tail with no white tip.
# `paws.raised` is the arms-up "I am very big" stand.
id = "red-panda"
name = "Red Panda"
category = "mammals"
aliases = ["firefox", "lesserpanda"]
accent = "brick"
extends = "small-quadruped"

[palette]
"l" = "orange-2"    # fur light
"f" = "orange-3"    # russet fur
"F" = "red-2"       # fur shadow, tear tracks
"r" = "orange-1"    # NEW: tail rings
"w" = "white"       # face markings, ear rims
"M" = "grey-1"      # shadow on the white
"s" = "grey-4"      # chest and arms light
"S" = "fur-black"   # chest, arms, inner ears
"n" = "fur-black"   # nose
"p" = "pink-2"      # mouth

[layers.tail]
at = [23, 6]
grid = """
..kk...
.kFFk..
krrrrk.
kfffFk.
kfffFk.
.krrrrk
.kfffFk
.kfffFk
.krrrrk
kffffFk
kfffFFk
krrrrrk
kffFFk.
kfFFk..
"""

[layers."tail.flick"]
at = [23, 6]
grid = """
...kk..
..kFFk.
.krrrrk
.kfffFk
.kfffFk
.krrrrk
.kfffFk
.kfffFk
.krrrrk
kffffFk
kfffFFk
krrrrrk
kffFFk.
kfFFk..
"""

# Russet back and sides around a dark chest.
[layers.body]
at = [6, 13]
grid = """
.klffffffffffffffFk.
klfffffffffffffffFFk
klffffsSSSSSSsfffFFk
klfffsSSSSSSSSsfffFk
klfffsSSSSSSSSsfffFk
klfffsSSSSSSSSsfffFk
