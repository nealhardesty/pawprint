kppk
.kk.
"""

[layers.paws]
at = [9, 17]
grid = """
.SSS......SSS.
SsssS....SsssS
kSsSk....kSsSk
"""

# Both arms thrown up beside the face, claws out.
[layers."paws.raised"]
at = [2, 5]
grid = """
.kk......................kk.
kSSk....................kSSk
kSsk....................ksSk
kSsk....................ksSk
.kSsk..................ksSk.
.kSsk..................ksSk.
..kSsk................ksSk..
..kSSk................kSSk..
...kSk................kSk...
...kSk................kSk...
...kSk................kSk...
...kSk................kSk...
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: stands up tall on its hind legs and throws both arms up.
[[actions]]
name = "arms-up"
weight = 5
frames = [
  { ops = ["all+0,-1"], ms = 140 },
  { ops = ["all+0,-3", "paws=raised"], ms = 160 },
  { ops = ["all+0,-3", "paws=raised", "eyes=happy"], ms = 1200 },
  { ops = ["all+0,-3", "paws=raised"], ms = 400 },
  { ops = ["all+0,-1"], ms = 160 },
  { ops = [], ms = 200 },
]

# Rare: stands up so tall it topples over backwards into the crate, then
# climbs back up, a little embarrassed.
[[actions]]
name = "topple"
weight = 1
frames = [
  { ops = ["all+0,-3", "paws=raised", "eyes=happy"], ms = 700 },
  { ops = ["all+1,-3", "paws=raised", "eyes=closed"], ms = 160 },
  { ops = ["all+2,-2", "paws=raised", "eyes=closed"], ms = 120 },
  { ops = ["all+2,6", "paws=raised", "eyes=closed"], ms = 100 },
  { ops = ["all+1,14", "prop:puff@11,14"], ms = 600 },
  { ops = ["all+0,8"], ms = 300 },
  { ops = ["all+0,2", "eyes=left", "prop:sweat@23,4"], ms = 900 },
  { ops = [], ms = 200 },
]
