# Dragon, a bespoke mythical creature. A small, round, green baby dragon
# sitting in the crate, face on: two curved cream horns and a little crest
# on its head, big eyes, rosy cheeks, a pale snout with two nostrils, a
# yellow-scaled belly, rose-pink bat wings spread behind its shoulders, a
# spade-tipped tail curling over the rim, and clawed paws. The signature
# snorts a puff of smoke out of its nostrils; the rare one huffs, puffs,
# and lets out a tiny burst of fire breath, then grins, very proud.
id = "dragon"
name = "Dragon"
category = "mythical"
aliases = ["wyrm"]
accent = "cranberry"
# Template props go top-right between the horn and the wing (the default).

[palette]
"." = "clear"
"k" = "ink"
"l" = "green-1"     # scales light
"f" = "green-2"     # scales
"F" = "green-3"     # scales shadow, tail spade
"m" = "green-1"     # snout
"n" = "green-3"     # nostrils
"w" = "yellow-1"    # belly scales
"M" = "yellow-2"    # belly scale lines
"c" = "cream"       # horns, claws, teeth
"C" = "brown-1"     # horn shadow
"r" = "pink-1"      # cheeks
"R" = "pink-2"      # wing membrane
"Q" = "red-2"       # wing shadow, mouth inside
"h" = "white"       # eye glint
"o" = "orange-2"    # fire

