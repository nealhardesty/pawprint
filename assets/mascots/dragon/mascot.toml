[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "yawn"
weight = 2

[[actions]]
use = "doze"

# Signature: the nostrils flare and it snorts out a puff of smoke, which
# drifts up over its head.
[[actions]]
name = "smoke-puff"
weight = 4
frames = [
  { ops = ["nose=sniff"], ms = 200 },
  { ops = ["nose=sniff", "eyes=closed"], ms = 200 },
  { ops = ["eyes=closed", "prop:puff@11,7"], ms = 250 },
  { ops = ["eyes=happy", "prop:puff@11,3"], ms = 350 },
  { ops = ["eyes=happy", "prop:puff@12,0"], ms = 350 },
  { ops = [], ms = 200 },
]

# Rare: it huffs, puffs, and lets out a tiny burst of fire breath, wings
# up, then grins, very proud of itself.
[[actions]]
name = "fire-breath"
weight = 1
frames = [
  { ops = ["nose=sniff", "head+0,-1"], ms = 250 },
  { ops = ["nose=sniff", "head+0,-1", "eyes=closed"], ms = 300 },
  { ops = ["eyes=squeeze", "+mouth.open", "-mouth", "+fire.small", "wings=flap"], ms = 120 },
  { ops = ["eyes=squeeze", "+mouth.open", "-mouth", "+fire.big", "wings=flap"], ms = 500 },
  { ops = ["eyes=squeeze", "+mouth.open", "-mouth", "+fire.small"], ms = 150 },
  { ops = ["eyes=happy", "-mouth", "+mouth.grin", "prop:puff@11,2"], ms = 400 },
  { ops = ["eyes=happy", "-mouth", "+mouth.grin", "prop:sparkle@24,2"], ms = 700 },
  { ops = [], ms = 200 },
]
