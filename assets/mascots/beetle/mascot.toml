[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "double-blink"
weight = 2

[[actions]]
use = "doze"

# Signature: the shell opens a crack, the wings peek out, and it closes.
[[actions]]
name = "shell-crack"
weight = 4
frames = [
  { ops = ["body=open"], ms = 300 },
  { ops = ["body=open", "+wings.open"], ms = 500 },
  { ops = ["body=open", "+wings.open", "antennae=twitch"], ms = 300 },
  { ops = ["body=open", "+wings"], ms = 200 },
  { ops = ["body=open"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: it tips over onto its back, legs waving, then flips back upright.
[[actions]]
name = "on-its-back"
weight = 1
frames = [
  { ops = ["all+0,-2"], ms = 120 },
  { grid = "on-back-1", ms = 300 },
  { grid = "on-back-2", ms = 250 },
  { grid = "on-back-1", ms = 250, ops = ["prop:sweat@25,1"] },
  { grid = "on-back-2", ms = 250, ops = ["prop:sweat@25,2"] },
  { grid = "on-back-1", ms = 250 },
  { ops = ["all+0,-2"], ms = 120 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
