# Beetle, on bug. A glossy jewel beetle: a black head and pronotum with
# clubbed antennae and big white eyes, and shiny green wing cases (the
# body) split down the middle with a white shine. The base's wings stay
# folded away until the signature cracks the shell open (`body.open`) and
# they peek out. The rare one tips over onto its back (custom frames),
# legs waving, and rights itself.
id = "beetle"
name = "Beetle"
category = "critters"
aliases = ["bug"]
accent = "pine"
extends = "bug"

# The hind wings are folded under the shell at rest.
rest = ["body", "head", "antennae", "eyes", "mouth", "legs"]

[palette]
"l" = "green-1"     # shell light
"f" = "teal"        # shell
"F" = "green-3"     # shell shadow
"s" = "fur-black"   # head, pronotum, and antennae
"S" = "grey-4"      # their light
"h" = "white"       # shine
"e" = "white"       # NEW: eyes
"w" = "white"       # wing light
"m" = "blue-1"      # wing shade

