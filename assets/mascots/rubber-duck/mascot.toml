weight = 2

[[actions]]
use = "doze"

# Signature: a squeak. It squashes flat with its eyes screwed shut and its
# bill open, a note pops out, and it springs back.
[[actions]]
name = "squeak"
weight = 4
frames = [
  { ops = ["head=squash", "eyes=closed", "mouth=open", "all+0,1"], ms = 140 },
  { ops = ["head=squash", "eyes=closed", "mouth=open", "all+0,1", "prop:note@24,1"], ms = 300 },
  { ops = ["eyes=happy", "all+0,-1", "prop:note@24,0"], ms = 160 },
  { ops = ["eyes=happy", "prop:note@25,0"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: a wave rolls through the tub. It bobs up and down on it, happy,
# and a splash of drops flies off.
[[actions]]
name = "bob-on-a-wave"
weight = 1
frames = [
  { ops = ["water=wave", "all+0,-1"], ms = 300 },
  { ops = ["all+0,-2", "eyes=happy"], ms = 300 },
  { ops = ["water=wave", "all+0,-1", "eyes=happy", "prop:sweat@3,9", "prop:sweat@26,8"], ms = 300 },
  { ops = ["all+0,1", "eyes=happy", "prop:sweat@2,11", "prop:sweat@27,10"], ms = 300 },
  { ops = ["water=wave", "eyes=happy"], ms = 300 },
  { ops = ["all+0,-1"], ms = 300 },
  { ops = [], ms = 200 },
]
