# Rubber Duck: a round yellow bath toy floating in a crate full of bath
# water, facing out with a flat orange bill for a mouth and its tail
# cocked up at the back. The signature is a squeak: it squashes flat, bill
# open, and a note pops out. The rare one rides a wave rolling through the
# tub, bobbing up and down while drops splash off.
id = "rubber-duck"
name = "Rubber Duck"
category = "things"
aliases = ["rubberducky"]
accent = "marigold"
extends = "object"

