# Pretzel, an object: a big soft pretzel, its fat belly on top carrying the
# face, the two thin arms twisting once below and reaching back up, salt
# crystals scattered over the crust. The signature makes the salt glint;
# the rare one untwists itself and twists back up the other way.
id = "pretzel"
name = "Pretzel"
category = "food"
aliases = []
accent = "copper"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-1"     # crust light
"f" = "brown-2"     # crust
"F" = "brown-3"     # crust shadow
"w" = "white"       # salt
"h" = "white"       # eye highlight
"p" = "brown-4"     # inside of the mouth

# The pretzel.
[layers."head"]
grid = """
................................
.....kkkkkk..........kkkkkk.....
...kkllllllkk......kkFFFFFFkk...
..kllfffffflllkffkkFFffffffFFk..
..klffkkkkffflFlFfFfffkkkkffFk..
.klffk....kffffFfffffk....kffFk.
.klffk....klfFffFfffFk....kffFk.
.klfk.....klffFffFffFk.....kfFk.
.klfk.....klfffFFfffFk.....kfFk.
.klfk.....klfffFFfffFk.....kfFk.
.klfk.....klffffffffFk.....kfFk.
.klfk.....klffffffffFk.....kfFk.
.klffk....kffffffffffk....kffFk.
.klffk....kffffffffffk....kffFk.
..klffk..kffffffffffffk..kffFk..
