# No blush: it would land in the holes.
[layers."blush"]
at = [9, 11]
grid = """
.
"""

# Salt crystals.
[layers."salt"]
follows = "head"
grid = """
................................
................................
.......w.................w......
..........w...........w.........
................................
................................
............w...................
....................w......w....
...w............................
................................
................................
............................w...
................................
...w............................
................................
............w......w............
.......................w........
........w.......................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
