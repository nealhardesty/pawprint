[layers."head.loose"]
grid = """
................................
.....kkkkkk..........kkkkkk.....
...kkllllllkk......kkFFFFFFkk...
..kllffffffllk....kFFffffffFFk..
..klffkkkkfffk....kfffkkkkffFk..
.klffk....kffk....kffk....kffFk.
.klffk....klfk....kfFk....kffFk.
.klfk.....klfk....kfFk.....kfFk.
.klfk.....klffkkkkffFk.....kfFk.
.klfk.....klfffFFfffFk.....kfFk.
.klfk.....klffffffffFk.....kfFk.
.klfk.....klffffffffFk.....kfFk.
.klffk....kffffffffffk....kffFk.
.klffk....kffffffffffk....kffFk.
..klffk..kffffffffffffk..kffFk..
..klfffkkfffffkkkkfffffkkfffFk..
...klfffffffk......kfffffffFk...
...kffffffffk......kffffffffk...
....kFffffffFkkkkkkFffffffFk....
.....kFFffffffffffffffffFFk.....
......kkFFFFFFFFFFFFFFFFkk......
........kkkkkkkkkkkkkkkk........
................................
................................
