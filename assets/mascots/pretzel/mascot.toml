[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "bob"
weight = 2

[[actions]]
use = "doze"

# Signature: the salt glints here and there.
[[actions]]
name = "salt-glint"
weight = 4
frames = [
  { ops = ["prop:sparkle@3,1"], ms = 300 },
  { ops = [], ms = 200 },
  { ops = ["eyes=happy", "prop:sparkle@21,3"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: it untwists itself, hangs loose for a moment, and twists back up
# the other way round.
[[actions]]
name = "untwist"
weight = 1
frames = [
  { ops = ["eyes=closed", "all+0,1"], ms = 160 },
  { ops = ["head=loose", "+mouth.open", "all+0,-1"], ms = 200 },
  { ops = ["head=loose", "eyes=happy", "all+0,-2"], ms = 700 },
  { ops = ["eyes=closed", "flipx", "all+0,-1"], ms = 200 },
  { ops = ["eyes=closed", "flipx", "all+0,1"], ms = 120 },
  { ops = ["eyes=happy", "flipx"], ms = 500 },
  { ops = [], ms = 200 },
]
