[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 3

[[actions]]
use = "doze"

# Signature: a gentle chest pat, left, right, left.
[[actions]]
name = "chest-pat"
weight = 4
frames = [
  { ops = ["paws=pat"], ms = 200 },
  { ops = ["paws=pat", "all+0,1"], ms = 120 },
  { ops = ["paws=pat2"], ms = 200 },
  { ops = ["paws=pat2", "all+0,1"], ms = 120 },
  { ops = ["paws=pat", "eyes=happy"], ms = 200 },
  { ops = ["paws=pat", "eyes=happy", "all+0,1"], ms = 120 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: a long thoughtful sigh, eyes closed, then a slow scratch of the head.
[[actions]]
name = "sigh-scratch"
weight = 1
frames = [
  { ops = ["eyes=closed", "head+0,-1", "nose=sniff"], ms = 500 },
  { ops = ["eyes=closed", "+mouth.open", "prop:puff@20,10"], ms = 600 },
  { ops = ["eyes=closed", "head+0,1"], ms = 400 },
  { ops = ["eyes=right", "paws=scratch"], ms = 500 },
  { ops = ["eyes=right", "paws=scratch", "head+-1,0"], ms = 300 },
  { ops = ["eyes=closed", "paws=scratch"], ms = 400 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
