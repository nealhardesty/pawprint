# Gorilla on primate. A silverback: the biggest frame in the catalog,
# shoulders out to the crate's edges with a silver saddle across them, a
# tall crested head, a heavy brow ridge shading small gentle brown eyes,
# a broad flat nose with wide nostrils, and huge knuckled hands on the rim.
# Dark grey fur and a lighter grey face so it reads at 32 px. Big, calm,
# kind. The signature pats its chest, left, right, left; the rare one is a
# long thoughtful sigh, then a slow scratch of the head.
id = "gorilla"
name = "Gorilla"
category = "mammals"
aliases = ["silverback"]
accent = "charcoal"
extends = "primate"

[palette]
"l" = "grey-3"      # fur light
"f" = "grey-4"      # fur
"F" = "fur-black"   # fur shadow, arm lines
"S" = "grey-1"      # NEW: silver saddle
"s" = "grey-2"      # NEW: silver shadow
"w" = "grey-2"      # face and hands
"M" = "grey-3"      # brow shadow, nostrils, mouth, knuckles
"e" = "brown-3"     # iris
"h" = "white"       # eye glint
"p" = "pink-2"      # mouth

