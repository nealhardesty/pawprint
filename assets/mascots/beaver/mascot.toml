# Signature: gnaws a stick, turning it like corn on the cob, then slaps its
# tail on the rim.
[[actions]]
name = "gnaw-and-slap"
weight = 5
frames = [
  { ops = ["stick=held", "paws=grip"], ms = 300 },
  { ops = ["stick=held", "paws=grip", "head+0,1", "mouth=gnaw", "stick+1,0"], ms = 130 },
  { ops = ["stick=held", "paws=grip", "chips=a"], ms = 130 },
  { ops = ["stick=bitten", "paws=grip", "head+0,1", "mouth=gnaw", "stick+-1,0"], ms = 130 },
  { ops = ["stick=bitten", "paws=grip", "chips=b"], ms = 300 },
  { ops = ["tail=up"], ms = 200 },
  { ops = ["tail=slap", "all+0,1", "prop:puff@22,12"], ms = 160 },
  { ops = ["tail=slap", "eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: it gnaws the whole stick down to a little point and holds it up,
# very proud of itself.
[[actions]]
name = "whittle"
weight = 1
frames = [
  { ops = ["stick=held", "paws=grip", "head+0,1", "mouth=gnaw", "stick+1,0", "chips=a"], ms = 110 },
  { ops = ["stick=held", "paws=grip", "head+0,1", "mouth=gnaw", "stick+-1,0", "chips=b"], ms = 110 },
  { ops = ["stick=bitten", "paws=grip", "head+0,1", "mouth=gnaw", "stick+1,0", "chips=a"], ms = 110 },
  { ops = ["stick=bitten", "paws=grip", "head+0,1", "mouth=gnaw", "chips=b"], ms = 110 },
  { ops = ["stick=stub", "all+0,-1", "eyes=closed"], ms = 300 },
  { ops = ["stick=stub", "all+0,-1", "eyes=happy", "prop:sparkle@21,5"], ms = 900 },
  { ops = ["stick=stub", "eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
