# Beaver, on rodent-upright. Dark brown and stocky, with a tan muzzle, a big
# black nose, two big orange buck teeth, and the defining feature: a flat,
# cross-hatched paddle tail standing up on the right. `tail.up` and
# `tail.slap` are the slap; `stick` is the stick it gnaws (hidden at rest),
# whittled down to `.stub` in the rare action; `chips` fly off it.
id = "beaver"
name = "Beaver"
category = "mammals"
aliases = []
accent = "copper"
extends = "rodent-upright"

[palette]
"l" = "brown-2"     # fur light
"f" = "brown-3"     # fur
"F" = "brown-4"     # fur shadow
"w" = "brown-1"     # muzzle and belly
"M" = "brown-2"     # muzzle shadow
"t" = "orange-1"    # teeth, fresh wood
"T" = "orange-2"    # NEW: tooth shadow
"B" = "orange-3"    # NEW: bark
"n" = "fur-black"   # nose
"p" = "brown-4"     # inner ear, mouth
"q" = "grey-4"      # NEW: paddle tail
"Q" = "grey-3"      # NEW: paddle scales

