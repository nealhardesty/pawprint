# Pufferfish, on sea-creature. A small, round, spiky yellow fish seen
# side-on, facing right: a cream belly, freckles on its back, a striped
# orange tail fan, and a puckered orange mouth. The whole fish is the head.
# `head.puff` is the inflated spiky ball with a big startled eye drawn in
# (so `-eyes`); `head.huge` is the rare over-inflation, a ball too big for
# the crate that shivers before it lets the air out in a puff.
id = "pufferfish"
name = "Pufferfish"
category = "aquatic"
aliases = ["puffer", "fugu"]
accent = "marigold"
extends = "sea-creature"
# Template props go top-left, clear of the face on the right.
prop_offset = [-19, -1]

# Side-on, so the base fins are left out: the tail fan is drawn in the head.
rest = ["body", "head", "eyes", "water"]

[palette]
"l" = "yellow-1"    # skin light
"f" = "yellow-2"    # skin
"F" = "orange-3"    # skin shadow
"w" = "cream"       # belly
"s" = "brown-3"     # NEW: freckles
"o" = "orange-2"    # NEW: lips and tail
"O" = "orange-3"    # NEW: tail stripes
"p" = "red-2"       # mouth inside

