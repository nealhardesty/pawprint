[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "bob"
weight = 3

[[actions]]
use = "doze"

# Signature: a gulp, fins fluttering, then it puffs up into a spiky ball,
# holds, and lets the air out again.
[[actions]]
name = "inflate"
weight = 4
frames = [
  { ops = ["+mouth.open"], ms = 150 },
  { ops = ["eyes=closed"], ms = 150 },
  { ops = ["head=puff", "-eyes"], ms = 1100 },
  { ops = ["head=puff", "-eyes", "head+0,1"], ms = 250 },
  { ops = ["eyes=closed"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: it keeps going, past the crate edges, shivers, and pops back small
# with a puff of air.
[[actions]]
name = "over-inflate"
weight = 1
frames = [
  { ops = ["head=puff", "-eyes"], ms = 400 },
  { ops = ["head=huge", "-eyes"], ms = 300 },
  { ops = ["head=huge", "-eyes", "all+1,0", "prop:sweat@27,1"], ms = 90 },
  { ops = ["head=huge", "-eyes", "all+-1,0", "prop:sweat@27,1"], ms = 90 },
  { ops = ["head=huge", "-eyes", "all+1,0", "prop:sweat@27,2"], ms = 90 },
  { ops = ["head=huge", "-eyes", "prop:sweat@27,2"], ms = 400 },
  { ops = ["eyes=closed", "+mouth.open", "prop:puff@20,4"], ms = 250 },
  { ops = ["eyes=happy", "prop:puff@21,2"], ms = 400 },
  { ops = [], ms = 200 },
]
