# Teapot, a bespoke oddball: a round white china pot with a pink band, its
# handle on the left and spout up at the right. The signature rattles the
# lid and puffs steam from the spout; the rare one comes to a full boil, the
# lid jumping and steam billowing, then sighs with relief.
id = "teapot"
name = "Teapot"
category = "oddballs"
aliases = ["tea", "kettle"]
accent = "rose"
# Template props (content's heart) go over the handle, clear of the spout.
prop_offset = [-19, -1]

[palette]
"." = "clear"
"k" = "ink"
"l" = "white"       # china light, eye highlight
"f" = "cream"       # china
"F" = "grey-1"      # china shadow
"p" = "pink-2"      # band, knob
"P" = "pink-1"      # band light, knob light, blush
"w" = "white"       # band dots

