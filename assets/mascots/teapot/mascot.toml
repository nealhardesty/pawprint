[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "content"
weight = 3

# Signature: the lid rattles and a puff of steam leaves the spout.
[[actions]]
name = "rattle"
weight = 4
frames = [
  { ops = ["lid+0,-1"], ms = 100 },
  { ops = ["lid+1,0"], ms = 100 },
  { ops = ["lid+0,-1"], ms = 100 },
  { ops = ["lid+-1,0"], ms = 100 },
  { ops = ["eyes=happy", "prop:steam@23,0"], ms = 500 },
  { ops = ["eyes=happy", "prop:steam@24,0"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: a full boil. The lid jumps, the pot shakes, steam billows from the
# spout and under the lid; then a happy sigh.
[[actions]]
name = "boil"
weight = 1
frames = [
  { ops = ["eyes=squeeze", "lid+0,-1"], ms = 100 },
  { ops = ["eyes=squeeze", "lid+1,-2", "all+1,0", "prop:steam@23,0"], ms = 100 },
  { ops = ["eyes=squeeze", "lid+-1,-1", "all+-1,0", "prop:steam@23,0"], ms = 100 },
  { ops = ["eyes=squeeze", "mouth=open", "lid+0,-2", "all+1,0", "prop:steam@24,0", "prop:steam@0,0"], ms = 120 },
  { ops = ["eyes=squeeze", "mouth=open", "lid+1,-2", "all+-1,0", "prop:steam@24,0", "prop:steam@0,0"], ms = 120 },
  { ops = ["eyes=squeeze", "mouth=open", "lid+-1,-2", "all+1,0", "prop:steam@23,0", "prop:steam@1,0"], ms = 120 },
  { ops = ["eyes=squeeze", "mouth=open", "lid+0,-2", "all+-1,0", "prop:steam@24,0", "prop:steam@0,0"], ms = 120 },
  { ops = ["eyes=closed", "lid+0,-1", "prop:steam@24,0"], ms = 300 },
  { ops = ["eyes=happy"], ms = 900 },
  { ops = [], ms = 200 },
]
