[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 4

[[actions]]
use = "doze"

# Signature: eyes on the loose board, then two quick bats with the black paw.
[[actions]]
name = "paw-flap"
weight = 4
frames = [
  { ops = ["eyes=left"], ms = 400 },
  { ops = ["eyes=left", "paws=swipe"], ms = 200 },
  { ops = ["eyes=left", "paws=bat", "flap=down"], ms = 160 },
  { ops = ["eyes=left", "paws=swipe", "flap=up"], ms = 160 },
  { ops = ["eyes=left", "paws=bat", "flap=down"], ms = 160 },
  { ops = ["eyes=left", "paws=swipe", "flap=up"], ms = 160 },
  { ops = ["eyes=left"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: one bat too hard sets the board swinging; it slaps down and the cat
# startles (the startle template's frames, with the board kept on the rim).
[[actions]]
name = "flap-swing"
weight = 1
frames = [
  { ops = ["eyes=left", "paws=swipe"], ms = 200 },
  { ops = ["eyes=left", "paws=bat", "flap=down"], ms = 140 },
  { ops = ["eyes=left", "flap=up"], ms = 110 },
  { ops = ["eyes=left", "flap=over"], ms = 160 },
  { ops = ["eyes=left", "flap=up"], ms = 110 },
  { ops = ["all+0,-1", "flap+0,1", "flap=down", "prop:bang@26,0"], ms = 120 },
  { ops = ["flap=down", "prop:bang@26,1"], ms = 700 },
  { ops = ["prop:bang@26,1"], ms = 100 },
  { ops = [], ms = 300 },
]
