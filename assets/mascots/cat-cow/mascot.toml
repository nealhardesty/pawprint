# Cow cat, a showcase cat on cat-sit. White all over with lopsided black
# patches: a black ear and eye patch on the left, a spot on the crown, a
# patch on the right cheek, a black right flank, a black tail, and one black
# front paw. A loose board (`flap`) lies on the left of the rim; the
# signature paws at it with the black paw, and the rare one sets it swinging.
id = "cat-cow"
name = "Cow Cat"
category = "cats-dogs"
aliases = ["cowcat", "moo"]
accent = "teal"
extends = "cat-sit"

[palette]
"l" = "white"       # fur light
"f" = "white"       # fur
"F" = "grey-1"      # fur shadow
"w" = "white"       # muzzle and chest
"M" = "grey-2"      # mouth lines
"P" = "fur-black"   # NEW: patches
"Q" = "grey-4"      # NEW: patch light
"e" = "green-2"     # iris
"o" = "brown-1"     # NEW: loose board, light
"c" = "brown-2"     # NEW: loose board
"C" = "brown-3"     # NEW: loose board, shadow

[layers.tail]
at = [26, 11]
grid = """
.kk.
kQPk
kQPk
kPPk
kPPk
kPPk
kPPk
kPPk
kPPk
kPPk
"""

