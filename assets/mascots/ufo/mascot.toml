"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "look-right"
weight = 3

# Signature: it hovers up a pixel, rim lights chasing, rings running down
# the beam, and the beam flickers off and back.
[[actions]]
name = "hover"
weight = 4
frames = [
  { ops = ["lights=b", "beam=b"], ms = 160 },
  { ops = ["all+0,-1", "beam=c"], ms = 160 },
  { ops = ["all+0,-1", "lights=b"], ms = 160 },
  { ops = ["all+0,-1", "-beam"], ms = 100 },
  { ops = ["all+0,-1", "lights=b", "beam=b"], ms = 100 },
  { ops = ["all+0,-1", "-beam"], ms = 100 },
  { ops = ["all+0,-1", "beam=c"], ms = 160 },
  { ops = ["lights=b"], ms = 160 },
  { ops = ["beam=b"], ms = 160 },
]

# Rare: a tiny cow-cat-colored visitor floats up the beam (rings running up)
# and in through the emitter. Gulp.
[[actions]]
name = "abduct"
weight = 1
frames = [
  { ops = ["eyes=down"], ms = 400 },
  { ops = ["eyes=down", "+cow.dot", "cow+0,1", "beam=c"], ms = 300 },
  { ops = ["eyes=down", "+cow.dot", "beam=b"], ms = 250 },
  { ops = ["eyes=down", "+cow.dot", "cow+0,-1"], ms = 250 },
  { ops = ["eyes=down", "+cow.dot", "cow+0,-2", "beam=c"], ms = 250 },
  { ops = ["eyes=down", "+cow.dot", "cow+0,-3", "beam=b"], ms = 250 },
  { ops = ["eyes=down", "+cow.dot", "cow+0,-4"], ms = 200 },
  { ops = ["-beam", "eyes=happy"], ms = 300 },
  { ops = ["-beam", "eyes=happy", "lights=b", "all+0,-1"], ms = 200 },
  { ops = ["eyes=happy", "lights=b"], ms = 400 },
  { ops = [], ms = 200 },
]
