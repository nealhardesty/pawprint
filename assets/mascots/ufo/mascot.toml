# UFO, a bespoke oddball: a flying saucer hovering over the crate with its
# tractor beam on. Its portholes are its eyes, the glowing emitter is its
# mouth, and rings of light run down the see-through beam into the crate.
# The signature hovers with the rim lights chasing and the beam flickering;
# the rare one beams up a tiny cow-cat-colored visitor.
id = "ufo"
name = "UFO"
category = "oddballs"
aliases = ["saucer"]
accent = "teal"

[palette]
"." = "clear"
"k" = "ink"
"w" = "white"       # dome glint, eye highlight, visitor
"g" = "blue-1"      # glass dome
"G" = "blue-2"      # glass dome shadow
"l" = "white"       # hull light
"m" = "grey-1"      # hull
"M" = "grey-2"      # hull shadow, rim
"D" = "grey-3"      # underside
"c" = "blue-2"      # porthole band light
"b" = "blue-3"      # porthole band
"y" = "yellow-1"    # emitter glow, beam rings
"Y" = "yellow-2"    # beam edges
"a" = "amber"       # rim lights
"P" = "fur-black"   # visitor's patches

