"""

[layers."dirt.lots"]
at = [2, 4]
grid = """
.kk...................kk...
kddk.................kddk..
kDDk.....kk..........kDDk..
.kk.....kddk..........kk...
........kDDk...........kk..
.........kk...........kddk.
......................kDDk.
.......................kk..
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 4

[[actions]]
use = "peek"
weight = 3

[[actions]]
use = "doze"

# Signature: hunches down and digs, flicking two crumbs of dirt out.
[[actions]]
name = "dig"
weight = 5
frames = [
  { ops = ["all+0,1", "eyes=closed"], ms = 160 },
  { ops = ["all+0,1", "paws=dig-a"], ms = 110 },
  { ops = ["all+0,1", "paws=dig-b", "dirt=a"], ms = 110 },
  { ops = ["all+0,1", "paws=dig-a", "dirt=a", "dirt+-1,-3"], ms = 110 },
  { ops = ["all+0,1", "paws=dig-b", "dirt=b"], ms = 110 },
  { ops = ["all+0,1", "paws=dig-a", "dirt=b", "dirt+1,-3"], ms = 110 },
  { ops = ["paws=dig-b"], ms = 200 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]

# Rare: digs so hard it tunnels clean out of sight, dirt flying, then pops
# back up in a puff of dust.
[[actions]]
name = "tunnel"
weight = 1
frames = [
  { ops = ["all+0,1", "paws=dig-a"], ms = 100 },
  { ops = ["all+0,3", "paws=dig-b", "dirt=a"], ms = 100 },
  { ops = ["all+0,6", "paws=dig-a", "dirt=lots", "dirt+0,-6"], ms = 120 },
  { ops = ["all+0,10", "paws=dig-b", "dirt=lots", "dirt+0,-12"], ms = 120 },
  { ops = ["all+0,14", "dirt=lots", "dirt+0,-17"], ms = 300 },
  { ops = ["all+0,14"], ms = 900 },
  { ops = ["all+0,3", "eyes=closed", "prop:puff@11,13"], ms = 160 },
  { ops = ["eyes=happy", "prop:puff@12,11"], ms = 700 },
  { ops = [], ms = 200 },
]
