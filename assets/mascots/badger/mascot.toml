# Badger, on small-quadruped. Low, broad, and grizzled grey, with the
# defining face: black down both sides and one bold white stripe from the
# nose up over the crown, white cheeks outside the black, small round
# white-tipped ears, a stubby tail, and big black digging paws with white
# claws. `paws.dig-a` / `.dig-b` alternate; `dirt` is what flies out.
id = "badger"
name = "Badger"
category = "mammals"
aliases = []
accent = "charcoal"
extends = "small-quadruped"

[palette]
"l" = "grey-1"      # fur light
"f" = "grey-2"      # grizzled fur
"F" = "grey-3"      # fur shadow
"w" = "white"       # face stripe, cheeks, claws
"M" = "grey-1"      # shadow on the white
"s" = "grey-4"      # face and paws light
"S" = "fur-black"   # face and paws
"n" = "fur-black"   # nose
"d" = "brown-2"     # NEW: dirt
"D" = "brown-3"     # NEW: dirt shadow

[layers.tail]
at = [26, 13]
grid = """
.kk.
kllk
kfFk
.kk.
"""

[layers."tail.flick"]
at = [26, 12]
grid = """
.kk.
kllk
kfFk
.kk.
"""

# Broad and low, with a black chest.
[layers.body]
at = [4, 13]
grid = """
..klffffffffffffffffFk..
.klfffffffffffffffffFFk.
klfffffffffffffffffffFFk
klffffffsSSSSSSsffffffFk
klfffffsSSSSSSSSsfffffFk
klfffffsSSSSSSSSsfffffFk
klffffffsSSSSSSsffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
"""

# Wide, flat-topped head: one white stripe from crown to nose between two
# black bands, with white cheeks outside them.
[layers.head]
at = [3, 6]
grid = """
.......kkkkkkkkkkkk.......
.....kkSSSSwwwwSSSSkk.....
....kSSSSSSwwwwSSSSSSk....
...kwSSSSSSwwwwSSSSSSwk...
..kwwSSSSSSwwwwSSSSSSwwk..
.kwwwSSSSSSwwwwSSSSSSwwMk.
kwwwwwSSSSSwwwwSSSSSwwwwMk
kwwwwwwSSSSwwwwSSSSwwwwwMk
.kwwwwwwSSSwwwwSSSwwwwwMk.
..kkwwwwwSSwwwwSSwwwwMkk..
....kkwwwwSwwwwSwwwwkk....
......kkkkkkMMkkkkkk......
"""

[layers.ears]
at = [5, 5]
follows = "head"
grid = """
.kk................kk.
kwwk..............kwwk
kSSk..............kSSk
"""

[layers."ears.flick"]
at = [5, 4]
follows = "head"
grid = """
...................kk.
.kk...............kwwk
kwwk..............kSSk
kSSk..................
"""

[layers.eyes]
at = [11, 9]
follows = "head"
grid = """
wk......wk
kk......kk
"""

[layers."eyes.closed"]
at = [11, 10]
follows = "head"
grid = """
ss......ss
"""

[layers."eyes.left"]
at = [10, 9]
follows = "head"
grid = """
wk......wk
kk......kk
"""

[layers."eyes.right"]
at = [12, 9]
follows = "head"
grid = """
wk......wk
kk......kk
"""

[layers."eyes.happy"]
at = [10, 9]
follows = "head"
grid = """
.ww......ww.
w..w....w..w
"""

[layers.nose]
at = [14, 15]
follows = "head"
grid = """
knnk
.nn.
"""

[layers."nose.sniff"]
at = [14, 14]
follows = "head"
grid = """
knnk
.nn.
"""

[layers."mouth.open"]
at = [14, 17]
follows = "head"
