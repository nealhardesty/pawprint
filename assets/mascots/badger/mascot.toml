SssssS............
kwSwSwk......SSSS.
............SssssS
............kwSwSw
"""

[layers."paws.dig-b"]
at = [7, 15]
grid = """
.............SSSS.
............SssssS
.SSSS.......kwSwSw
SssssS............
kwSwSwk...........
"""

[layers."dirt.a"]
at = [3, 8]
grid = """
.kk.......................
kddk......................
kDDk......................
.kk.......................
"""

[layers."dirt.b"]
