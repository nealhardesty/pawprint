.kBk..kBk.
kBBBkkBBBk
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: chest out, a proud little strut, head bobbing with each step.
[[actions]]
name = "strut"
weight = 5
frames = [
  { ops = ["all+1,-1", "head+1,0"], ms = 180 },
  { ops = ["all+1,0"], ms = 160 },
  { ops = ["all+-1,-1", "head+-1,0"], ms = 180 },
  { ops = ["all+-1,0"], ms = 160 },
  { ops = ["all+1,-1", "head+1,0", "ears=flick"], ms = 180 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]

# Rare: the train rises and opens into a full wheel of eyespots, shimmers,
# and folds away again.
[[actions]]
name = "fan-display"
weight = 1
frames = [
  { ops = ["body=half", "ears=flick"], ms = 160 },
  { ops = ["body=fan", "ears=flick"], ms = 400 },
  { ops = ["body=fan", "ears=flick", "eyes=happy"], ms = 900 },
  { ops = ["body=fan", "eyes=happy", "all+1,0"], ms = 100 },
  { ops = ["body=fan", "eyes=happy", "all+-1,0"], ms = 100 },
  { ops = ["body=fan", "eyes=happy", "all+1,0"], ms = 100 },
  { ops = ["body=fan", "eyes=happy"], ms = 700 },
  { ops = ["body=half"], ms = 200 },
  { ops = [], ms = 300 },
]
