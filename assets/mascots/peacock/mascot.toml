# Peacock on bird-water. A front-facing peacock: a small blue head striped
# white above and below the eyes, a crest of three teal-tipped plumes, a
# shimmering blue neck and chest, and the long green train folded behind it,
# drooping to both sides with its eyespots peeking out. The train is drawn
# in the `body` slot (the first layer) so it stays behind everything:
# `body.half` and `body.fan` open it. The base's side `wings` are left out.
# Signature: a little strut, chest out, head bobbing. Rare: the whole train
# fans open in a wheel of eyespots and shimmers.
id = "peacock"
name = "Peacock"
category = "birds"
aliases = ["peafowl"]
accent = "teal"
extends = "bird-water"
rest = ["body", "head", "ears", "eyes", "bill", "feet"]

[palette]
"l" = "blue-1"      # feathers light
"f" = "blue-2"      # blue neck and chest
"F" = "blue-3"      # blue shadow, crest stalks
"W" = "white"       # face stripes
"h" = "white"       # eye highlight
"g" = "green-1"     # train, light
"G" = "green-2"     # train
"q" = "green-3"     # train shadow
"t" = "teal"        # crest tips
"e" = "teal"        # eyespot ring
"E" = "blue-3"      # eyespot centre
"y" = "yellow-2"    # eyespot gold
"b" = "brown-1"     # bill
"B" = "grey-2"      # feet

