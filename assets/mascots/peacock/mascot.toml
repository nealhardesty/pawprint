# A small head striped white above and below the eyes, on a slim neck.
[layers.head]
at = [11, 4]
grid = """
...kkkk...
..kllffk..
.kllffffk.
kWWWffWWWk
kffffffffk
kffffffffk
.kWWffWWk.
..kffffk..
..kffffk..
..kfffFk..
"""

