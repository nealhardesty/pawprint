[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "content"
weight = 2

[[actions]]
use = "doze"

# Signature: a little shake, and a few flakes drift down past the horns.
[[actions]]
name = "flake"
weight = 4
frames = [
  { ops = ["all+1,0"], ms = 80 },
  { ops = ["all+-1,0"], ms = 80 },
  { ops = ["+flakes.off"], ms = 200 },
  { ops = ["eyes=left", "+flakes.off", "flakes+0,3"], ms = 260 },
  { ops = ["eyes=left", "+flakes.off", "flakes+0,6"], ms = 260 },
  { ops = ["eyes=left", "+flakes.off", "flakes+0,9"], ms = 300 },
  { ops = ["eyes=left"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a proud fluff-up. It puffs up a size, beams, and shines.
[[actions]]
name = "fluff-up"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 200 },
  { ops = ["eyes=closed", "head=puff"], ms = 160 },
  { ops = ["eyes=happy", "head=puff", "prop:sparkle@24,0"], ms = 500 },
  { ops = ["eyes=happy", "head=puff", "prop:sparkle@1,2"], ms = 500 },
  { ops = ["eyes=happy", "head=puff"], ms = 500 },
  { ops = ["eyes=happy"], ms = 300 },
  { ops = [], ms = 200 },
]
