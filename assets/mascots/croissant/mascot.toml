# Croissant, an object: a plump golden crescent of rolled, layered pastry,
# each layer ridged off from the next, its horns curling down over the
# crate rim; the face is on the big middle roll. The signature shakes loose
# a few buttery flakes; the rare one fluffs itself up, proud, and shines.
id = "croissant"
name = "Croissant"
category = "food"
aliases = []
accent = "honey"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"y" = "yellow-1"    # glaze glints
"l" = "orange-1"    # pastry light
"f" = "orange-2"    # pastry
"F" = "orange-3"    # pastry shadow
"D" = "brown-3"     # the deep ridges between layers
"h" = "white"       # eye highlight
"P" = "pink-1"      # blush
"p" = "orange-3"    # inside of the mouth

