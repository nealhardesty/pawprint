# Signature: the wings slowly close up over its back and open again, the
# antennae twitching.
[[actions]]
name = "wing-fold"
weight = 4
frames = [
  { ops = ["wings=half"], ms = 200 },
  { ops = ["wings=closed", "antennae=twitch"], ms = 700 },
  { ops = ["wings=half"], ms = 200 },
  { ops = [], ms = 500 },
  { ops = ["wings=half"], ms = 160 },
  { ops = [], ms = 200 },
]

# Rare: it flutters up out of the crate, drifts a little, and floats back
# down to the rim.
[[actions]]
name = "flutter-up"
weight = 1
frames = [
  { ops = ["wings=half", "all+0,-2"], ms = 120 },
  { ops = ["all+1,-4", "eyes=happy"], ms = 120 },
  { ops = ["wings=half", "all+2,-6", "eyes=happy"], ms = 120 },
  { ops = ["all+3,-6", "eyes=happy"], ms = 120 },
