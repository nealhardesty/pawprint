# Butterfly, on bug. A violet butterfly sitting on the rim with its big
# wings spread: rounded violet forewings with a lilac flush and a black
# border dotted with white, sky-blue hindwings each with a golden eyespot,
# a lavender face, a slender black body, and long curled antennae. The
# signature slowly closes its wings up over its back and opens them again;
# the rare one flutters up out of the crate, drifts, and floats back down.
id = "butterfly"
name = "Butterfly"
category = "critters"
aliases = []
accent = "violet"
extends = "bug"

[palette]
"l" = "white"       # face light
"f" = "purple-1"    # face
"F" = "purple-2"    # face shadow, smile
"m" = "purple-2"    # forewings
"w" = "purple-1"    # forewing flush
"j" = "fur-black"   # NEW: wing border
"W" = "white"       # NEW: border dots
"b" = "blue-2"      # NEW: hindwings
"y" = "yellow-1"    # NEW: eyespots
"s" = "grey-4"      # body
"S" = "fur-black"   # body segments
"r" = "pink-1"      # NEW: cheeks

