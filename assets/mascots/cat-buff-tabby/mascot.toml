at = [8, 17]
grid = """
.FFFF......FFFF.
FllllF....FllllF
klFlFk....klFlFk
"""

# The ringed tail, wrapped around the right paw along the rim.
[layers.wrap]
at = [20, 16]
grid = """
........kkk
.kkkkkkkfsk
klfsflsffFk
kFsFFsFFFk.
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "content"
weight = 4

[[actions]]
use = "doze"

# Signature: a slow blink, then it melts into the crate until only the ears
# and the spread cheeks show over the rim.
[[actions]]
name = "melt"
weight = 4
frames = [
  { ops = ["eyes=closed"], ms = 500 },
  { ops = [], ms = 250 },
  { ops = ["eyes=closed"], ms = 600 },
  { ops = ["eyes=closed", "head=melt", "all+0,2"], ms = 250 },
  { ops = ["eyes=closed", "head=melt", "all+0,5"], ms = 300 },
  { ops = ["eyes=happy", "head=melt", "all+0,8"], ms = 1200 },
  { ops = ["eyes=closed", "head=melt", "all+0,4"], ms = 200 },
  { ops = ["all+0,1"], ms = 200 },
]

# Rare: tucks its paws and the loaf spills over both crate corners.
[[actions]]
name = "loaf-overflow"
weight = 1
frames = [
  { ops = ["-paws", "head+0,2"], ms = 250 },
  { ops = ["-paws", "-wrap", "head+0,2", "body=loaf", "eyes=closed"], ms = 400 },
  { ops = ["-paws", "-wrap", "head+0,2", "body=loaf", "eyes=happy"], ms = 1400 },
  { ops = ["-paws", "-wrap", "head+0,2", "body=loaf", "eyes=closed"], ms = 400 },
  { ops = ["-paws", "head+0,2"], ms = 250 },
  { ops = [], ms = 200 },
]
