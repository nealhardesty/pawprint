..kFffffffFFFFFFFFffffffFk..
...kkFFFFF........FFFFFkk...
"""

# The signature melt: the same crown, with the cheeks spread flat.
[layers."head.melt"]
at = [0, 4]
grid = """
...........kkkkkkkkkk...........
........kkklllllllfffkkk........
......kkllffffffffffffFFkk......
.....klfffffffffffffffffFFk.....
