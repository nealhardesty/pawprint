# Buff tabby, a showcase cat on cat-sit. Chunky: a low, round, wide head with
# jowly cheeks, small wide-set ears, a broad body, soft stripes, and a ringed
# tail wrapped around its paws on the rim. `head.melt` is the squashed
# pancake head of the signature melt; `body.loaf` is the rare overflow.
id = "cat-buff-tabby"
name = "Buff Tabby"
category = "cats-dogs"
aliases = ["bufftabby", "buff", "chonk"]
accent = "honey"
extends = "cat-sit"

# The base tail is left out: this cat's tail is `wrap`, drawn in front.
rest = ["body", "head", "ears", "eyes", "nose", "paws", "stripes", "wrap"]

[palette]
"l" = "cream"       # fur light
"f" = "orange-1"    # fur
"F" = "brown-1"     # fur shadow
"s" = "brown-2"     # NEW: soft tabby stripes
"w" = "white"       # muzzle and chest
"M" = "brown-1"     # mouth lines

[layers.body]
at = [2, 14]
grid = """
....klfffffffffffffffFFk....
..klfffffffffffffffffffFFk..
.klffffffffffffffffffffFFFk.
klfssffffwwwwwwwwwwffffssFFk
klfffffffwwwwwwwwwwfffffFFFk
klffssfffwwwwwwwwwwfffssfFFk
klfffffffwwwwwwwwwwfffffFFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
klfffffffffffffffffffffffFFk
"""

# Rare: paws tucked, the loaf spreads past both crate corners.
[layers."body.loaf"]
at = [0, 12]
grid = """
....kkkkkkkkkkkkkkkkkkkkkkkk....
..kklffffffffffffffffffffffFkk..
.klffffffffffffffffffffffffffFk.
klfssfffffffffffffffffffffffsFFk
klfffffffffffffffffffffffffffFFk
klffssffffffffffffffffffffssfFFk
