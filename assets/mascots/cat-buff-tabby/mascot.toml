klfffffffffffwwwwwwfffffffffFFFk
klfffffffffwwwwMMwwwwfffffffFFFk
.klffffffffwwwMwwMwwwfffffffFFk.
..kkFFFFFFFFFFFFFFFFFFFFFFFFkk..
"""

# Small, round, wide-set ears.
[layers.ears]
at = [4, 2]
grid = """
...kk..............kk...
..klfk............kfFk..
.klppfk..........kfppFk.
.klppffk........kffppFk.
"""

