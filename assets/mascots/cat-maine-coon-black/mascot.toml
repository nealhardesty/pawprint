[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 4

[[actions]]
use = "doze"

# Signature: a slow amber side-eye, then one fluffy tail flick.
[[actions]]
name = "side-eye"
weight = 4
frames = [
  { ops = ["eyes=right"], ms = 200 },
  { ops = ["eyes=side"], ms = 1000 },
  { ops = ["eyes=side", "tail=flick"], ms = 220 },
  { ops = ["eyes=side"], ms = 500 },
  { ops = ["eyes=closed"], ms = 160 },
  { ops = [], ms = 300 },
]

# Rare: the ruff, cheeks, and plume all fluff up at once, then settle.
[[actions]]
name = "ruff-fluff"
weight = 1
frames = [
  { ops = ["eyes=closed"], ms = 200 },
  { ops = ["eyes=closed", "head=puff", "tail=puff", "all+0,-1"], ms = 250 },
  { ops = ["head=puff", "tail=puff", "all+0,-1"], ms = 1200 },
  { ops = ["head=puff", "tail=puff"], ms = 300 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
