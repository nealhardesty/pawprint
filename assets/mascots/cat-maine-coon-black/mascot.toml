# Black Maine Coon, a showcase cat on cat-sit. Big and fluffy: a wide head
# with tufted cheeks and a chin ruff, tall lynx-tipped ears, a plume tail up
# the right side, and amber eyes. Fur is fur-black so it reads as fur, with
# grey strands for the fluff. `eyes.side` is the half-lidded amber side-eye of
# the signature; `head.puff` and `tail.puff` are the rare ruff fluff-up.
id = "cat-maine-coon-black"
name = "Black Maine Coon"
category = "cats-dogs"
aliases = ["mainecoon", "maine"]
accent = "plum"
extends = "cat-sit"

[palette]
"l" = "grey-3"      # fur sheen
"f" = "fur-black"   # fur
"F" = "fur-black"   # fur shadow (a black cat's shadows sink into the fur)
"r" = "grey-2"      # NEW: fluff strands (ruff, cheeks, plume)
"R" = "grey-1"      # NEW: strand tips
"w" = "fur-black"   # muzzle (only its mouth lines show)
"M" = "grey-3"      # mouth lines
"e" = "amber"       # iris
"h" = "white"       # eye glint
"n" = "grey-2"      # nose
"p" = "grey-3"      # inner ear

