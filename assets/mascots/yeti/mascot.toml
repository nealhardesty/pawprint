[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: shakes the snow out of its fur, head to toe, in a puff.
[[actions]]
name = "snow-shake"
weight = 4
frames = [
  { ops = ["eyes=closed"], ms = 200 },
  { ops = ["eyes=closed", "all+-1,0", "ears=flick"], ms = 100 },
  { ops = ["eyes=closed", "all+1,0", "prop:puff@0,8"], ms = 100 },
  { ops = ["eyes=closed", "all+-1,0", "ears=flick", "prop:puff@22,6"], ms = 100 },
  { ops = ["eyes=closed", "all+1,0", "prop:puff@1,7", "prop:puff@23,5"], ms = 120 },
  { ops = ["eyes=happy", "prop:puff@22,4"], ms = 300 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: packs a snowball, winds up, and lobs it off the top of the frame.
[[actions]]
name = "snowball"
weight = 1
frames = [
  { ops = ["eyes=right", "paws=throw"], ms = 600 },
  { ops = ["eyes=closed", "paws=throw", "head+-1,0"], ms = 300 },
  { ops = ["eyes=right", "+ball.fly", "ball+3,-4", "+mouth.open"], ms = 120 },
  { ops = ["eyes=right", "+ball.fly", "ball+7,-9", "+mouth.open"], ms = 120 },
  { ops = ["eyes=happy", "+mouth.open"], ms = 700 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
