# Yeti on primate, mythical. A big shaggy white snow beast: a ragged,
# zigzag outline all the way down, a spiky tuft on top, shaggy cheek fur
# sticking out at the sides, and a pale blue face with small dark eyes and
# a grin with two tiny friendly fangs. Its hands on the rim are blue too.
# Where the gorilla is dark and smooth, the yeti is white and scruffy. The
# signature shakes the snow out of its fur in a puff; the rare one packs a
# snowball and lobs it out of the frame, very pleased with itself.
id = "yeti"
name = "Yeti"
category = "mythical"
aliases = ["sasquatch", "bigfoot"]
accent = "ice"
extends = "primate"

[palette]
"l" = "white"       # fur light
"f" = "white"       # fur
"F" = "grey-1"      # fur shadow and shag
"G" = "grey-2"      # NEW: deep shag
"w" = "blue-1"      # face and hands
"M" = "blue-2"      # face shadow, nose, knuckles
"e" = "blue-3"      # iris
"h" = "white"       # eye glint
"a" = "white"       # NEW: fangs
"p" = "pink-2"      # mouth

