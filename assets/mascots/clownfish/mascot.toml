[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "bob"
weight = 3

[[actions]]
use = "doze"

# Signature: it darts down under the water line and pops back out, leaving
# a bubble behind.
[[actions]]
name = "dart"
weight = 4
frames = [
  { ops = ["head+0,1"], ms = 120 },
  { ops = ["head+0,6", "water=ripple"], ms = 100 },
  { ops = ["head+0,14", "water=ripple", "prop:bubble@12,7"], ms = 400 },
  { ops = ["head+0,14", "prop:bubble@13,4"], ms = 300 },
  { ops = ["head+0,4", "water=ripple"], ms = 100 },
  { ops = ["head+0,-1", "eyes=happy"], ms = 160 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 150 },
]

# Rare: an anemone sprouts from the water, the fish ducks into it, peeks
# out one way and the other, and pops back out.
[[actions]]
name = "anemone"
weight = 1
frames = [
  { ops = ["head+0,14", "+anemone.low"], ms = 200 },
  { ops = ["head+0,14", "+anemone.up"], ms = 500 },
  { ops = ["head+0,14", "+anemone.peek"], ms = 700 },
  { ops = ["head+0,14", "+anemone.look"], ms = 600 },
  { ops = ["head+0,14", "+anemone.peek"], ms = 400 },
  { ops = ["head+0,14", "+anemone.low", "water=ripple"], ms = 150 },
  { ops = ["head+0,4", "water=ripple"], ms = 120 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 150 },
]
