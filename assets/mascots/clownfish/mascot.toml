# Clownfish, on sea-creature. A chubby orange reef fish seen side-on,
# facing left: three bold white bands edged in black (behind the eye, mid
# body, and at the tail), a black-rimmed fan tail and dorsal fin, and a big
# round eye. The whole fish is the `head`, so it can dive under the water
# line. The signature darts down under the water and pops back out with a
# splash of bubbles; the rare one hides in a pink sea anemone that sprouts
# from the water, peeks out between the fronds, and pops back out happy.
id = "clownfish"
name = "Clownfish"
category = "aquatic"
aliases = []
accent = "marigold"
extends = "sea-creature"

# Side-on, so the base body and fins are left out.
rest = ["head", "eyes", "water"]

[palette]
"l" = "orange-1"    # scales light
"f" = "orange-2"    # scales
"F" = "orange-3"    # scales shadow, fin line
"w" = "white"       # bands
"j" = "fur-black"   # NEW: band and fin edges
"p" = "red-2"       # mouth
"a" = "purple-1"    # NEW: anemone fronds
"A" = "purple-2"    # NEW: anemone frond shadow
"b" = "pink-1"      # NEW: anemone tips

# The whole fish, side-on and facing left.
[layers.head]
at = [0, 0]
grid = """
................................
................................
...........kkkkkkk..............
..........kwjllljwk.............
.........kwwjfffjwwk.......k....
........kjwwjfffjwwk.....kklkk..
......kkljwwjfffjwwjk....klflk..
....kkllfjwwjfffjwwjlkk.klfffjk.
...kllfffjwwjfffjwwjfljkjffffjk.
...klffffjwwjfffjwwjffjwjffffjk.
..klfffffjwwjfffjwwjffjwjFfffjk.
..pfffffjjwwjfFfjwwjffjwjFfffjk.
..klfffffjwwjfFFjwwjffjwjFfffjk.
...klffffjwwjfffjwwjffjwklfffjk.
...klFfffjwwjfffjwwjfFjk.klfFjk.
....kklFfjwwjfffjwwjFkk..kkjkk..
......kkljwwjFFFjwwkk......k....
........kkkkkkkkkkk.............
................................
................................
"""

[layers.eyes]
at = [5, 8]
follows = "head"
grid = """
hk
kk
"""

[layers."eyes.closed"]
at = [5, 9]
follows = "head"
grid = """
kk
"""

[layers."eyes.left"]
at = [4, 8]
follows = "head"
grid = """
hk
kk
"""

[layers."eyes.right"]
at = [6, 8]
follows = "head"
grid = """
hk
kk
"""

[layers."eyes.happy"]
at = [4, 8]
follows = "head"
grid = """
.kk.
k..k
"""

[layers."mouth.open"]
at = [1, 10]
follows = "head"
grid = """
.kk
kpk
.kk
"""

# The anemone it hides in: hidden at rest, it grows out of the water.
[layers."anemone.low"]
at = [6, 4]
grid = """
