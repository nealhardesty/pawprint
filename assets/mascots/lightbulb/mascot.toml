# Lightbulb: a round glass bulb on a ridged screw base, standing in the
# crate. A little coiled filament hangs above its face, cold and grey. The
# signature is an idea: the filament flickers, catches, and glows amber with
# rays around the glass. The rare one is a bright idea: lit up, it hops with
# a sparkle and a grin.
id = "lightbulb"
name = "Lightbulb"
category = "things"
aliases = ["bulb"]
accent = "honey"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "white"
"f" = "cream"
"F" = "yellow-1"
"w" = "white"
"m" = "grey-1"
"M" = "grey-2"
"d" = "grey-3"
"a" = "orange-2"
"y" = "amber"
"h" = "grey-3"
"P" = "pink-1"
"p" = "pink-2"

[layers."head"]
grid = """
............kkkkkkkk............
..........kkllllllFFkk..........
........kkllffffffffFFkk........
.......kllffffffffffffFFk.......
......klwwfffffffffffffFFk......
......klwffffffffffffffFFk......
.....klfwfffffffffffffffFFk.....
.....klfffffffffffffffffFFk.....
.....klfffffffffffffffffFFk.....
.....klfffffffffffffffffFFk.....
.....klfffffffffffffffffFFk.....
......klfffffffffffffffFFk......
......klfffffffffffffffFFk......
.......kklfffffffffffFFkk.......
.........kkkkkkkkkkkkkk.........
..........kddddddddddk..........
..........kmmmmmmmmMMk..........
..........kmmMmmMmmMMk..........
..........kmMmmMmmMMMk..........
..........kMmmMmmMmMMk..........
..........kmmMmmMmmMMk..........
..........kmMmmMmmMMMk..........
..........kMmmMmmMmMMk..........
..........kmmMmmMmmMMk..........
..........kmMmmMmmMMMk..........
..........kMmmMmmMmMMk..........
..........kmmMmmMmmMMk..........
..........kmMmmMmmMMMk..........
..........kMmmMmmMmMMk..........
..........kmmMmmMmmMMk..........
..........kmMmmMmmMMMk..........
..........kMmmMmmMmMMk..........
"""

[layers."filament"]
at = [11, 4]
follows = "head"
grid = """
..d....d..
.d.d..d.d.
d...dd...d
"""

[layers."filament.on"]
at = [10, 3]
follows = "head"
grid = """
...y....y...
..yay..yay..
.yayayyayay.
yay.yaay.yay
.y...yy...y.
"""

[layers."rays.on"]
follows = "head"
grid = """
................................
................................
................................
...y........................y...
....y......................y....
................................
................................
................................
................................
.yy..........................yy.
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: an idea. The filament flickers, catches, and glows; the eyes
# go wide, then it clicks off again.
[[actions]]
name = "idea"
weight = 4
frames = [
  { ops = ["filament=on"], ms = 100 },
  { ops = [], ms = 120 },
  { ops = ["filament=on"], ms = 90 },
  { ops = [], ms = 160 },
  { ops = ["filament=on", "+rays.on", "all+0,-1"], ms = 900 },
  { ops = ["filament=on", "+rays.on", "eyes=happy"], ms = 700 },
  { ops = [], ms = 200 },
]

# Rare: a bright idea. Lit up, a hop and a sparkle, happy eyes and a grin.
[[actions]]
name = "bright-idea"
weight = 1
frames = [
  { ops = ["filament=on", "+rays.on"], ms = 200 },
  { ops = ["filament=on", "+rays.on", "all+0,-2", "eyes=happy", "mouth=open", "prop:sparkle@24,0"], ms = 300 },
  { ops = ["filament=on", "+rays.on", "all+0,-1", "eyes=happy", "mouth=open", "prop:sparkle@25,1", "prop:sparkle@1,4"], ms = 500 },
  { ops = ["filament=on", "+rays.on", "eyes=happy", "prop:sparkle@1,3"], ms = 900 },
  { ops = ["filament=on", "eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
