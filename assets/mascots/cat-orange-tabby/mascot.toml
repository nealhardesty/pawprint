[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "tail-flick"
weight = 3

[[actions]]
use = "doze"

# Signature: a huge yawn, then it forgets its tongue: a blep.
[[actions]]
name = "yawn-blep"
weight = 4
frames = [
  { ops = ["eyes=closed"], ms = 250 },
  { ops = ["eyes=closed", "head+0,-1", "+mouth.open"], ms = 1000 },
  { ops = ["eyes=closed"], ms = 250 },
  { ops = ["+mouth.blep"], ms = 1300 },
  { ops = ["+mouth.blep", "eyes=closed"], ms = 150 },
  { ops = ["+mouth.blep"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: there is a pebble on the crate edge. It looks at the pebble. It
# looks at you. It pushes the pebble off.
[[actions]]
name = "pebble-push"
weight = 1
frames = [
  { ops = ["eyes=left", "prop:pebble@0,13"], ms = 700 },
  { ops = ["prop:pebble@0,13"], ms = 500 },
  { ops = ["eyes=left", "paws=reach", "prop:pebble@0,13"], ms = 300 },
  { ops = ["eyes=left", "paws=reach", "prop:pebble@-2,13"], ms = 160 },
  { ops = ["paws=reach", "prop:pebble@-3,17"], ms = 120 },
  { ops = ["eyes=happy"], ms = 900 },
  { ops = [], ms = 200 },
]
