# Orange tabby on cat-sit: the everyday cat, and the catalog's plain `cat`.
# A bright ginger tom with bold stripes: an M on the brow, bars at the
# temples and under the eyes, tufts sticking out at the cheeks, a white
# muzzle and chest, a barred body, and a thick ringed tail. Green eyes, and
# a notch in the left ear from some old adventure. `mouth.blep` is the
# tongue tip of the signature; `paws.reach` stretches toward the pebble.
id = "cat-orange-tabby"
name = "Orange Tabby"
category = "cats-dogs"
aliases = ["cat", "kitty", "orangecat", "ginger"]
accent = "marigold"
extends = "cat-sit"

[palette]
"l" = "orange-1"    # fur light
"f" = "orange-2"    # fur
"F" = "orange-3"    # fur shadow
"s" = "orange-3"    # NEW: stripes
"w" = "white"       # muzzle and chest
"M" = "grey-2"      # mouth lines and chin shadow
"e" = "green-2"     # iris
"n" = "pink-2"      # nose
"p" = "pink-1"      # inner ear, mouth, tongue

[layers.tail]
at = [25, 9]
grid = """
