[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "ear-flick"
weight = 3

[[actions]]
use = "yawn"
weight = 2

[[actions]]
use = "doze"
when = "day"

# Signature: the wings swing wide open, hold, and wrap back up.
[[actions]]
name = "wing-stretch"
weight = 5
frames = [
  { ops = ["wings=open", "all+0,1"], ms = 120 },
  { ops = ["wings=open", "all+0,-1", "eyes=happy"], ms = 900 },
  { ops = ["wings=open", "eyes=happy"], ms = 300 },
  { ops = ["all+0,1"], ms = 120 },
  { ops = [], ms = 300 },
]

# Rare, at night: it flips upside down and hangs from the ceiling for a
# while, looking about, then flips back.
[[actions]]
name = "hang"
weight = 1
when = "night"
frames = [
  { ops = ["all+0,-2", "wings=open"], ms = 120 },
  { grid = "hang", ops = ["all+0,-4"], ms = 120 },
  { grid = "hang", ms = 1400 },
  { grid = "hang", ops = ["all+0,1"], ms = 600 },
  { grid = "hang", ms = 600 },
  { ops = ["all+0,-2", "wings=open"], ms = 120 },
  { ops = [], ms = 300 },
]

