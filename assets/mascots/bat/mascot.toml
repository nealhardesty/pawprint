# Bat, bespoke (no base). A little fruit bat wrapped up in its own wings
# like a cloak: two huge pointed ears with pink insides, a round furry
# brown face with bright eyes and two tiny white fangs, and plum wing
# membranes folded around the body, their finger bones showing as ridges
# and their thumb claws poking up at the shoulders. Nocturnal. The
# signature throws the wings wide open and folds them back. The rare one,
# at night, flips upside down to hang from the ceiling for a while, then
# flips back.
id = "bat"
name = "Bat"
category = "mammals"
aliases = []
accent = "plum"
nocturnal = true

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-2"     # fur light
"f" = "brown-3"     # fur
"F" = "brown-4"     # fur shadow, mouth
"w" = "brown-2"     # chest fur
"a" = "purple-1"    # wing edge light
"A" = "purple-2"    # wing membrane
"d" = "grey-4"      # wing bones and folds
"p" = "pink-2"      # inner ears
"h" = "white"       # eye glint, fangs

