[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 4

[[actions]]
use = "ear-flick"
weight = 2

[[actions]]
use = "doze"

# Signature: popcorning. A crouch, a sudden straight-up hop that twists in
# mid-air (the patches flip sides), a second smaller hop, and a wiggle.
[[actions]]
name = "popcorn"
weight = 5
frames = [
  { ops = ["all+0,1"], ms = 140 },
  { ops = ["all+0,-3", "eyes=happy", "ears=flick"], ms = 120 },
  { ops = ["all+0,-4", "eyes=happy", "ears=flick", "flipx"], ms = 160 },
  { ops = ["all+0,-1", "eyes=happy"], ms = 100 },
  { ops = ["all+0,-2", "eyes=happy", "ears=flick"], ms = 100 },
  { ops = ["all+1,0", "eyes=happy"], ms = 100 },
  { ops = ["all+-1,0", "eyes=happy"], ms = 100 },
  { ops = ["eyes=happy"], ms = 500 },
]

# Rare: a wheek. It hears the fridge door, draws itself up, and squeals at
# full volume: notes fly, then an exclamation.
[[actions]]
name = "wheek"
weight = 1
frames = [
  { ops = ["eyes=right", "ears=flick"], ms = 600 },
  { ops = ["all+0,-1", "eyes=closed", "+mouth.open", "prop:note@22,6"], ms = 300 },
  { ops = ["all+0,-1", "eyes=closed", "+mouth.open", "prop:note@23,3", "prop:note@2,5"], ms = 300 },
  { ops = ["all+0,-2", "eyes=closed", "+mouth.open", "prop:note@24,0", "prop:note@1,2"], ms = 300 },
  { ops = ["all+0,-2", "+mouth.open", "prop:bang@26,0"], ms = 600 },
  { ops = ["eyes=happy"], ms = 500 },
  { ops = [], ms = 200 },
]
