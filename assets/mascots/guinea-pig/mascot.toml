klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
klfffffwwwwwwwwwwwwwbbbbbk
"""

