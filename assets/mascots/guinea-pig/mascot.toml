# Guinea pig (cavy), on rodent-upright. A round potato with no neck at all:
# head and body are one loaf, wider at the bottom. Tricolor coat: a black
# patch over the left ear and crown, a white blaze and muzzle, ginger over
# the right eye, and the patches swap sides lower down. Petal ears droop
# at the top corners, the eyes are wide-set, the nose sits over a little
# split lip, and tiny pink feet grip the rim. No tail, no buck teeth. The
# signature is a popcorn: a sudden hop with a twist in mid-air (the
# patches flip sides). The rare one is a full-volume wheek: mouth wide,
# notes flying, then an exclamation.
id = "guinea-pig"
name = "Guinea Pig"
category = "mammals"
aliases = ["cavy"]
accent = "honey"
extends = "rodent-upright"

[palette]
"l" = "orange-1"    # ginger light
"f" = "orange-2"    # ginger
"F" = "orange-3"    # ginger shadow
"w" = "white"       # blaze, muzzle, belly
"M" = "grey-1"      # shadow on the white, lip lines
"b" = "fur-black"   # NEW: black patches
"h" = "grey-3"      # left-eye glint: white would vanish on the white blaze
"H" = "white"       # NEW: right-eye glint, on ginger
"n" = "pink-2"      # nose
"p" = "pink-1"      # inner ears, feet

# No tail to speak of.
[layers.tail]
at = [24, 18]
grid = """
.
"""

# The bottom of the potato: wider than the head, patches swapped.
[layers.body]
