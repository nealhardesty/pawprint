# Pangolin, bespoke (no base). A walking pinecone: standing up on its hind
# legs, every inch of it shingled in overlapping copper-brown scales, from
# the top of its small head to the thick tail curling up its right side.
# Only the narrow face is bare: soft pink skin, small eyes, a long tapering
# snout. The signature rolls it up into a tight scaly ball (custom
# frames), rocks once, and unrolls. The rare one is a curious shuffle
# along the rim, snout twitching, with a question.
id = "pangolin"
name = "Pangolin"
category = "mammals"
aliases = []
accent = "copper"

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-1"     # scale light
"f" = "brown-2"     # scales
"F" = "brown-3"     # scale shadow
"d" = "brown-4"     # scale edges, nose
"w" = "pink-1"      # bare face
"M" = "pink-2"      # face shadow, snout tip
"h" = "white"       # eye glint
"n" = "brown-4"     # nostrils

# The thick, scaly tail, curling up behind on the right.
[layers.tail]
at = [23, 1]
grid = """
....kk.
...kllk
..kfffk
.kFFfFk
.klFFFk
kfffFfk
kfFFlFk
kFFlllk
kFffffk
klFFfFk
kllFFFk
kfffFfk
kfFFlFk
kFFlllk
kFffffk
klFFfFk
"""

[layers."tail.flick"]
