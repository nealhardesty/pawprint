# A small head, scaled on top, bare and narrow below, tapering to a long snout.
[layers.head]
at = [11, 4]
grid = """
..kkkkkk..
.klFFFllk.
kfffFffffk
kfFFlFFfFk
kFFwwwwFFk
kFwwwwwMfk
klwwwwwMFk
.klwwwMlk.
..kwwwMk..
..kwwwMk..
...kwMk...
...kMMk...
....kk....
"""

[layers.eyes]
at = [13, 9]
follows = "head"
grid = """
hk..hk
kk..kk
"""

[layers."eyes.closed"]
at = [13, 10]
follows = "head"
grid = """
kk..kk
"""

[layers."eyes.left"]
at = [12, 9]
follows = "head"
grid = """
hk..hk
kk..kk
"""

[layers."eyes.right"]
at = [14, 9]
follows = "head"
grid = """
hk..hk
kk..kk
"""

[layers."eyes.happy"]
at = [12, 9]
follows = "head"
grid = """
.kk..kk.
k..kk..k
"""

[layers.nose]
at = [15, 15]
follows = "head"
grid = """
nn
"""

[layers."nose.sniff"]
at = [15, 14]
follows = "head"
grid = """
nn
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "sniff"
weight = 4

[[actions]]
use = "tail-flick"
weight = 2

[[actions]]
use = "doze"

# Signature: it tucks its head, rolls up into a tight scaly ball, rocks on
# the rim, and unrolls.
[[actions]]
name = "roll-up"
weight = 5
frames = [
  { ops = ["head+0,2", "eyes=closed"], ms = 200 },
  { grid = "ball-0", ms = 700 },
  { grid = "ball-1", ops = ["all+1,0"], ms = 200 },
  { grid = "ball-0", ops = ["all+-1,0"], ms = 200 },
  { grid = "ball-0", ms = 500 },
  { ops = ["head+0,2", "eyes=closed"], ms = 200 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: a curious shuffle. It waddles left along the rim, snout going,
# stops, wonders, and waddles back.
[[actions]]
name = "shuffle"
weight = 1
frames = [
  { ops = ["all+-1,0", "nose=sniff", "eyes=left"], ms = 160 },
  { ops = ["all+-2,-1", "eyes=left"], ms = 160 },
  { ops = ["all+-3,0", "nose=sniff", "eyes=left"], ms = 160 },
  { ops = ["all+-3,0", "head+1,0", "prop:question@22,0"], ms = 900 },
  { ops = ["all+-3,0", "nose=sniff", "head+1,0", "prop:question@22,1"], ms = 300 },
  { ops = ["all+-2,-1", "eyes=right"], ms = 160 },
  { ops = ["all+-1,0", "eyes=right"], ms = 160 },
  { ops = [], ms = 300 },
]

