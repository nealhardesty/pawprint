# Jackalope, on rodent-upright. A jackrabbit with antlers: a long-legged
# tawny hare with huge splayed ears tipped in black, big side-set eyes, a
# cream muzzle and buck teeth, and a pair of small forked antlers sprouting
# between the ears. The signature is an itch: it reaches up and scratches
# an antler, eyes squeezed in bliss. The rare one is a jackrabbit thump: a
# hind foot slams the crate (puff of dust) and the thump launches it into
# a big hop.
id = "jackalope"
name = "Jackalope"
category = "mythical"
aliases = []
accent = "ochre"
extends = "rodent-upright"

[palette]
"l" = "brown-1"     # fur light
"f" = "brown-2"     # tawny fur
"F" = "brown-3"     # fur shadow
"w" = "cream"       # muzzle, belly
"M" = "brown-1"     # shadow on the cream
"t" = "white"       # teeth
"n" = "pink-2"      # nose
"p" = "pink-1"      # inner ears
"d" = "fur-black"   # NEW: ear tips
"A" = "brown-3"     # NEW: antlers: thin tines, no outline (like whiskers)
"x" = "brown-2"     # NEW: antler tips

# The scut is tucked away behind.
