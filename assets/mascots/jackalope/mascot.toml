# Signature: an itch. A paw reaches up and scratches the right antler,
# the head leaning into it, eyes squeezed in bliss.
[[actions]]
name = "antler-scratch"
weight = 5
frames = [
  { ops = ["paws=one", "+scratch.up", "scratch+0,2"], ms = 140 },
  { ops = ["paws=one", "+scratch.up", "head+1,0", "eyes=squeeze"], ms = 160 },
  { ops = ["paws=one", "+scratch.up", "scratch+0,1", "head+1,0", "eyes=squeeze"], ms = 120 },
  { ops = ["paws=one", "+scratch.up", "head+1,0", "eyes=squeeze"], ms = 120 },
  { ops = ["paws=one", "+scratch.up", "scratch+0,1", "head+1,0", "eyes=squeeze"], ms = 120 },
  { ops = ["paws=one", "+scratch.up", "scratch+0,2", "eyes=happy"], ms = 400 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]

# Rare: the thump. Eyes go wide, a hind foot slams the crate floor with a
# puff of dust, and the thump launches it into a big hop.
