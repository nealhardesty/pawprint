weight = 1
frames = [
  { ops = ["eyes=wide", "ears=flick"], ms = 500 },
  { ops = ["eyes=wide", "all+0,1", "prop:puff@0,12", "prop:puff@23,12"], ms = 160 },
  { ops = ["eyes=happy", "all+0,-3"], ms = 120 },
  { ops = ["eyes=happy", "all+0,-5"], ms = 220 },
  { ops = ["eyes=happy", "all+0,-2"], ms = 100 },
  { ops = ["all+0,1"], ms = 140 },
  { ops = [], ms = 300 },
