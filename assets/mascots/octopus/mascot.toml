# Octopus, bespoke. A round lavender mantle with a shine, big glossy eyes,
# pink cheeks, and a little smile; arms hang over the crate rim, the outer
# two curling at the tips. The right outer arm is its own slot (`arm`, with
# `arm.up` and `arm.curl`) for the signature curl. The rare action inks a
# little cloud (`ink.puff`, `ink.cloud`, `ink.wisp`) and hides behind it.
id = "octopus"
name = "Octopus"
category = "aquatic"
aliases = ["octo", "kraken"]
accent = "violet"

[palette]
"." = "clear"
"k" = "ink"
"l" = "white"       # shine
"f" = "purple-1"    # skin
"F" = "purple-2"    # skin shadow, smile
"c" = "pink-1"      # cheeks and suckers
"h" = "white"       # eye highlight
"i" = "grey-4"      # ink cloud
"I" = "grey-3"      # ink cloud light

[layers.head]
at = [5, 1]
grid = """
.......kkkkkkkk.......
....kkkffffffffkkk....
..kkfllfffffffffFFkk..
.kfllfffffffffffffFFk.
kfflfffffffffffffffFFk
kffffffffffffffffffFFk
kffffffffffffffffffFFk
kffffffffffffffffffFFk
kffffffffffffffffffFFk
kfccffffffffffffffccFk
kffffffffFffFffffffFFk
kfffffffffFFfffffffFFk
.kFFFFFFFFFFFFFFFFFFk.
"""

[layers.tentacles]
at = [0, 13]
follows = "head"
grid = """
.....kffk.kfk.kffk.kfk.
....kffk..kfk.kffk.kfk.
.kk.kfk...kck.kcck.kck.
kfk.kfk...kfk.kffk.kfk.
kfkkffk..kfk..kcck..kfk
kfffffk..kck..kffk..kck
.kkkkk...kk....kk....kk
"""

