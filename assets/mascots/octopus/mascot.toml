[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "curious"
weight = 3

[[actions]]
use = "doze"

# Signature: the right arm lifts off the rim, curls up, and settles back.
[[actions]]
name = "arm-curl"
weight = 4
frames = [
  { ops = ["arm=up", "eyes=right"], ms = 200 },
  { ops = ["arm=curl", "eyes=right"], ms = 700 },
  { ops = ["arm=up", "eyes=happy"], ms = 200 },
  { ops = ["arm=curl", "eyes=happy"], ms = 400 },
  { ops = ["arm=up"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: startled, it squirts a little ink cloud and hides behind it, then
# peeks out once the ink thins.
[[actions]]
name = "ink-cloud"
weight = 1
frames = [
  { ops = ["all+0,-1", "prop:bang@26,0"], ms = 150 },
  { ops = ["+ink.puff", "+mouth.open"], ms = 150 },
  { ops = ["+ink.cloud", "head+0,6"], ms = 250 },
  { ops = ["+ink.cloud", "head+0,19"], ms = 500 },
  { ops = ["+ink.wisp", "head+0,19"], ms = 400 },
  { ops = ["head+0,8", "eyes=left"], ms = 400 },
  { ops = ["head+0,8", "eyes=right"], ms = 400 },
  { ops = ["head+0,4"], ms = 150 },
  { ops = [], ms = 200 },
]
