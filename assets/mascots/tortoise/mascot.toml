[[actions]]
use = "doze"

# Signature: the head pulls into the shell, waits, and slowly comes back
# out, peeking both ways first.
[[actions]]
name = "retract"
weight = 4
frames = [
  { ops = ["eyes=closed", "head+3,0"], ms = 120 },
  { ops = ["head+9,0"], ms = 800 },
  { ops = ["head+5,0"], ms = 500 },
  { ops = ["head+3,0", "eyes=left"], ms = 500 },
  { ops = ["head+1,0", "eyes=right"], ms = 500 },
  { ops = [], ms = 300 },
]

# Rare: a leaf flutters down; the tortoise catches it and munches it up.
[[actions]]
name = "leaf-munch"
weight = 1
frames = [
  { ops = ["prop:leaf@6,-3", "eyes=right"], ms = 300 },
  { ops = ["prop:leaf@3,0", "eyes=right"], ms = 300 },
  { ops = ["prop:leaf@1,4", "+mouth.open"], ms = 300 },
  { ops = ["prop:leaf@0,8"], ms = 200 },
  { ops = ["eyes=happy", "+mouth.open"], ms = 200 },
  { ops = ["eyes=happy"], ms = 200 },
  { ops = ["eyes=happy", "+mouth.open"], ms = 200 },
  { ops = ["eyes=happy"], ms = 400 },
  { ops = [], ms = 200 },
]
