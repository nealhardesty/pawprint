# Tortoise, on critter, in profile facing left. A high, domed green shell
# with brown seams between the scutes and a yellow rim (`shell`, a new slot
# drawn last, so the head can slide in under it), a round tan head on a
# long neck, and stumpy elephant legs with white claws on the rim.
# The signature pulls the head in and lets it slowly re-emerge; the rare one
# catches a falling leaf and munches it.
id = "tortoise"
name = "Tortoise"
category = "critters"
aliases = ["turtle"]
accent = "pine"
extends = "critter"

[palette]
"l" = "orange-1"    # skin light
"f" = "brown-1"     # skin
"F" = "brown-2"     # skin shadow, mouth line, nostrils
"q" = "green-1"     # NEW: shell light
"g" = "green-2"     # NEW: shell
"G" = "green-3"     # NEW: shell shadow
"B" = "brown-3"     # NEW: seams between the scutes
"r" = "yellow-2"    # NEW: shell rim
"R" = "orange-3"    # NEW: seams on the rim
"w" = "yellow-1"    # plastron
"W" = "yellow-2"    # NEW: plastron seams
"m" = "white"       # NEW: claws
"p" = "pink-2"      # mouth

