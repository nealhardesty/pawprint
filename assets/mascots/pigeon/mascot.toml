[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "bob"
weight = 4

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "doze"

# Signature: the chest swells, the collar flashes, and a coo rolls out.
[[actions]]
name = "coo"
weight = 5
frames = [
  { ops = ["body=puff", "head+0,-1"], ms = 220 },
  { ops = ["body=puff", "head+0,-1", "eyes=closed"], ms = 500 },
  { ops = ["body=puff", "head+0,-2", "eyes=closed"], ms = 260 },
  { ops = ["body=puff", "head+0,-1", "eyes=happy"], ms = 600 },
  { ops = ["head+0,1"], ms = 160 },
  { ops = [], ms = 200 },
]

# Rare: struts along the rim, the head bobbing forward with every step.
[[actions]]
name = "strut"
weight = 1
frames = [
  { ops = ["head+0,1", "eyes=left"], ms = 180 },
  { ops = ["all+-2,0", "eyes=left"], ms = 180 },
  { ops = ["all+-2,0", "head+0,1", "eyes=left"], ms = 180 },
  { ops = ["all+-4,0", "eyes=left"], ms = 180 },
  { ops = ["all+-4,0", "eyes=right"], ms = 400 },
  { ops = ["all+-4,0", "flipx", "head+0,1", "eyes=left"], ms = 180 },
  { ops = ["all+-2,0", "flipx", "eyes=left"], ms = 180 },
  { ops = ["all+-2,0", "flipx", "head+0,1", "eyes=left"], ms = 180 },
  { ops = ["flipx", "eyes=left"], ms = 180 },
  { ops = ["head+0,1"], ms = 180 },
  { ops = [], ms = 300 },
]
