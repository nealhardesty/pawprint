# Pigeon on bird-perched. A small grey head on a plump body, an iridescent
# green-and-violet collar, orange eyes, a dark beak with a white cere, two
# black wing bars, and pink feet. Its small head shows shoulders, which no
# other perched bird has. Signature: the chest puffs up and it coos.
# Rare: it struts along the rim, head bobbing with every step.
id = "pigeon"
name = "Pigeon"
category = "birds"
aliases = ["dove"]
accent = "slate"
extends = "bird-perched"

[palette]
"l" = "grey-1"      # feathers light
"f" = "grey-2"      # feathers
"F" = "grey-3"      # feather shadow
"w" = "grey-1"      # chest
"m" = "grey-2"
"t" = "teal"        # collar sheen
"P" = "purple-2"    # collar sheen
"d" = "grey-4"      # wing bars
"e" = "orange-2"    # iris
"c" = "white"       # cere
"b" = "grey-4"      # beak
"B" = "grey-3"      # beak shadow
"n" = "pink-2"      # feet

[layers.body]
at = [5, 12]
grid = """
..kkllllllllllllffkk..
.klllfttttttttttffFFk.
kllftttttPPPPtttttfFFk
klffttttPPPPPPttttffFk
klfffftttwwwwwwtttffFk
