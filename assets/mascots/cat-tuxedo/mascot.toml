# Tuxedo cat, a showcase cat on cat-sit. Sleek and upright: a narrow head
# with tall ears, a glossy dark coat with a 3-step sheen, a symmetric white
# blaze from the brow down the muzzle, a white bib, and white paws. Its paws
# have `tuck` (one tucked under the chest) and `chest` (one held to the bib).
id = "cat-tuxedo"
name = "Tuxedo Cat"
category = "cats-dogs"
aliases = ["tuxedo", "tux"]
accent = "brick"
extends = "cat-sit"

[palette]
"l" = "grey-3"      # coat sheen
"f" = "grey-4"      # coat
"F" = "fur-black"   # coat shadow
"w" = "white"       # blaze, bib, and paws
"M" = "grey-1"      # shadow on the white
"e" = "yellow-1"    # iris
"n" = "pink-2"      # nose
"p" = "pink-2"      # inner ear

[layers.tail]
at = [25, 10]
grid = """
.kk.
klfk
klFk
kfFk
kfFk
kfFk
kfFk
kfFk
kfFk
kfFk
kfFk
"""

[layers."tail.flick"]
at = [25, 9]
grid = """
..kk.
.klfk
.klFk
kffFk
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
kfFk.
"""

[layers.body]
