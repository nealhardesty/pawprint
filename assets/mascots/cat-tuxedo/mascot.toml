MwwwwM........
kwMwMk........
"""

[layers."paws.chest"]
at = [9, 15]
grid = """
..........kkkk.
.........kwwwwk
.MMMM....kwMwMk
MwwwwM.........
kwMwMk.........
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "tail-flick"
weight = 4

[[actions]]
use = "doze"

# Signature: sits up straight, tucks a white paw under its chest, and looks
# pleased with itself.
[[actions]]
name = "paw-tuck"
weight = 4
frames = [
  { ops = ["head+0,-1", "body+0,-1", "tail+0,-1"], ms = 200 },
  { ops = ["head+0,-1", "body+0,-1", "tail+0,-1", "eyes=closed"], ms = 160 },
  { ops = ["head+0,-1", "body+0,-1", "tail+0,-1"], ms = 400 },
  { ops = ["head+0,-1", "body+0,-1", "tail+0,-1", "paws=tuck"], ms = 300 },
  { ops = ["paws=tuck", "eyes=happy"], ms = 1200 },
  { ops = ["paws=tuck"], ms = 500 },
  { ops = [], ms = 200 },
]

# Rare: a formal bow, one paw to the bib.
[[actions]]
name = "formal-bow"
weight = 1
frames = [
  { ops = ["head+0,-1", "body+0,-1", "tail+0,-1", "paws=chest"], ms = 300 },
  { ops = ["paws=chest", "eyes=closed", "head+0,1"], ms = 200 },
  { ops = ["paws=chest", "eyes=closed", "head+0,2"], ms = 900 },
  { ops = ["paws=chest", "eyes=closed", "head+0,1"], ms = 200 },
  { ops = ["paws=chest", "eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]
