"""

# White paws: both on the rim, one tucked under the chest, or one held to
# the bib.
[layers.paws]
at = [9, 17]
grid = """
.MMMM....MMMM.
MwwwwM..MwwwwM
kwMwMk..kwMwMk
"""

[layers."paws.tuck"]
at = [9, 17]
grid = """
