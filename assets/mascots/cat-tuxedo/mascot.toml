kffffwwwwwwwwffFFk
kfffwwwwMMwwwwfFFk
.kffwwwMwwMwwwfFk.
..kfFwwwwwwwwFFk..
...kkFMMMMMMFkk...
"""

# Tall, pointed ears.
[layers.ears]
at = [7, 1]
grid = """
..k............k..
.klk..........kFk.
.klpk........kpFk.
klppfk......kfppFk
klff..........ffFk
"""

