[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-right"
weight = 3

[[actions]]
use = "yawn"
weight = 2

[[actions]]
use = "doze"

# Signature: a deep rumble shakes the cone, and a puff of smoke rolls out
# of the crater.
[[actions]]
name = "rumble"
weight = 4
frames = [
  { ops = ["eyes=closed", "all+1,0"], ms = 80 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 80 },
  { ops = ["eyes=closed", "all+1,0"], ms = 80 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 80 },
  { ops = ["prop:puff@11,0"], ms = 400 },
  { ops = ["eyes=left", "prop:puff@12,-1"], ms = 500 },
  { ops = ["eyes=left"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: a tiny eruption. The rumble builds, lava and embers jump out of
# the crater, and then a long, relieved sigh of smoke.
[[actions]]
name = "erupt"
weight = 1
frames = [
  { ops = ["eyes=closed", "all+1,0"], ms = 80 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 80 },
  { ops = ["eyes=closed", "all+1,0", "+mouth.open"], ms = 80 },
  { ops = ["eyes=closed", "all+-1,0", "+mouth.open"], ms = 80 },
  { ops = ["eyes=happy", "+burst.go", "prop:sparkle@22,0"], ms = 300 },
  { ops = ["eyes=happy", "+burst.go", "head+0,1", "prop:sparkle@3,1"], ms = 300 },
  { ops = ["eyes=happy", "+burst.go", "prop:sparkle@23,2"], ms = 250 },
  { ops = ["eyes=closed", "+mouth.open", "prop:puff@11,0"], ms = 900 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]
