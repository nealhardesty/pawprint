# Volcano, an object: a stout rocky cone with a glowing lava crater on
# top and a few trickles running over the lip; the face sits on the slope.
# What makes it itself is the cone and the bright pool. The signature is
# a rumble that ends in a puff of smoke; the rare one is a tiny, very
# satisfying eruption, followed by a relieved sigh.
id = "volcano"
name = "Volcano"
category = "nature"
aliases = []
accent = "brick"
extends = "object"
# Template props go to the top right corner, clear of the crater.
prop_offset = [3, -2]

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-1"     # rock light
"f" = "brown-2"     # rock
"F" = "brown-3"     # rock shadow, streaks
"D" = "brown-4"     # deep streaks on the shady side
"R" = "red-2"       # cooling lava
"r" = "orange-2"    # lava
"y" = "yellow-1"    # the hottest lava
"A" = "amber"       # flying embers
"h" = "white"       # eye highlight
"P" = "red-1"       # blush
"p" = "red-2"       # inside of the mouth

# The cone, the crater pool, and the lava over its lip.
[layers."head"]
grid = """
................................
................................
................................
................................
...........kkkkkkkkkk...........
.........kkRrryyyyrrRkk.........
........klRRrrrrrrrrRRFk........
........kllRrRRRRRRRRrFk........
.......klfffRffffffffrfFk.......
.......klfffffffffffffrFk.......
......klffffffffffffffRfFk......
......klfffffffffffffffRFk......
.....klffFfffffffffffffRfFk.....
.....klffFfffffffffffffffFk.....
....klffFfffffffffffffffffFk....
....klffFfffFfffDfffDffffDFk....
...klffFffffFfffDfffDffffDfFk...
...klffFfffFffffDffffDffffDFk...
..klffFffffFffffDffffDffffDfFk..
..klffFffffFffffDffffDfffffDFk..
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
.klffffffffffffffffffffffffffFk.
"""

# A little fountain of lava and embers, for the rare eruption.
[layers."burst.go"]
follows = "head"
grid = """
.............kk.................
...k........kyAk..k.............
..kAk..k...kyyrk.kAk....k.......
...k..kAk..krrRk..k....kAk......
.......k....kRk.........k.......
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
