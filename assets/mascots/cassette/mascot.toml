# Cassette: a dark grey tape standing in the crate, a cream label with an
# orange stripe for its face and the reel window below it, two white hubs
# in a ring of brown tape. The signature plays a song: the reels turn and
# it bobs to the beat while a note floats up. The rare one eats its tape:
# a loop springs out and tangles, and the reels wind it back in.
id = "cassette"
name = "Cassette"
category = "things"
aliases = []
accent = "charcoal"
extends = "object"

[palette]
"." = "clear"
"k" = "ink"
"l" = "grey-2"
"f" = "grey-3"
"F" = "grey-4"
"w" = "cream"
"m" = "grey-1"
"o" = "orange-2"
"K" = "fur-black"
"T" = "brown-2"
"W" = "white"
"h" = "grey-3"
"P" = "pink-1"
"p" = "pink-2"

[layers."head"]
grid = """
................................
................................
................................
....kkkkkkkkkkkkkkkkkkkkkkkk....
...klllllllllllllllllllllllFk...
...klFfooooooooooooooooomfFFk...
...klffooooooooooooooooomffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffwwwwwwwwwwwwwwwwwmffFk...
...klffmmmmmmmmmmmmmmmmmmffFk...
...klfffFFFFFFFFFFFFFFFFfffFk...
...klfffFKTTTKKKKKKTTTKFfffFk...
...klfffFTKKKTKKKKTKKKTFfffFk...
...klfffFKTTTKKKKKKTTTKFfffFk...
...klfffFFFFFFFFFFFFFFFFfffFk...
...klffffllllllllllllllffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
...klffffffffffffffffffffffFk...
"""

[layers."reels"]
at = [10, 15]
follows = "head"
grid = """
.W........W.
WkW......WkW
.W........W.
"""

[layers."reels.b"]
at = [10, 15]
follows = "head"
grid = """
W.W......W.W
.k........k.
W.W......W.W
"""

[layers."tape.small"]
at = [10, 1]
follows = "head"
grid = """
....TTTT....
...T....T...
"""

[layers."tape.big"]
follows = "head"
grid = """
............TTTT...TTTT.........
...........T....T.T....T........
............T....T......TTTTT...
.............................T..
..............................T.
..............................T.
..............................T.
.............................T..
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
................................
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: it plays. The reels turn, it bobs to the beat with happy eyes,
# and a note floats up.
[[actions]]
name = "play"
weight = 4
frames = [
  { ops = ["reels=b"], ms = 150 },
  { ops = ["eyes=happy"], ms = 150 },
  { ops = ["reels=b", "eyes=happy", "all+0,1", "prop:note@24,2"], ms = 150 },
  { ops = ["eyes=happy", "prop:note@24,1"], ms = 150 },
  { ops = ["reels=b", "eyes=happy", "all+0,1", "prop:note@25,0"], ms = 150 },
  { ops = ["eyes=happy", "prop:note@25,0"], ms = 300 },
  { ops = [], ms = 200 },
]

# Rare: it eats its tape. A loop springs out of the top and tangles, the
# reels spin it back in, and it sighs with relief.
[[actions]]
name = "unspool"
weight = 1
frames = [
  { ops = ["+tape.small", "reels=b", "mouth=open"], ms = 150 },
  { ops = ["+tape.big", "mouth=open", "all+0,1"], ms = 700 },
  { ops = ["+tape.big", "reels=b", "eyes=closed"], ms = 120 },
  { ops = ["+tape.small", "eyes=closed"], ms = 120 },
  { ops = ["+tape.small", "reels=b", "eyes=closed"], ms = 120 },
  { ops = ["eyes=closed"], ms = 300 },
  { ops = ["eyes=happy"], ms = 600 },
  { ops = [], ms = 200 },
]
