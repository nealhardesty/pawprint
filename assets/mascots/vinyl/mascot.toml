# Vinyl Record: a black record standing on a little wooden turntable, its
# yellow label the face, the tonearm reaching up the right side with the
# needle on the grooves. The signature drops the needle and spins the disc:
# glints sweep round the grooves while it grooves along. The rare one is a
# scratch: the needle skips, the record jumps, and it looks shocked.
id = "vinyl"
name = "Vinyl Record"
category = "things"
aliases = ["turntable"]
accent = "charcoal"
extends = "object"

[palette]
