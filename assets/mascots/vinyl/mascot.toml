[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "doze"

# Signature: the needle drops and the record spins, the glints sweeping
# round the grooves, while it grooves along with happy eyes.
[[actions]]
name = "spin"
weight = 4
frames = [
  { ops = ["arm+0,-2"], ms = 300 },
  { ops = [], ms = 200 },
  { ops = ["head=b", "eyes=happy"], ms = 160 },
  { ops = ["head=c", "eyes=happy"], ms = 160 },
  { ops = ["head=d", "eyes=happy"], ms = 160 },
  { ops = ["eyes=happy"], ms = 160 },
  { ops = ["head=b"], ms = 200 },
  { ops = [], ms = 200 },
]

# Rare: a scratch. The needle skips, the record jumps, and it looks shocked.
[[actions]]
name = "scratch"
weight = 1
frames = [
  { ops = ["head=b"], ms = 150 },
  { ops = ["head=c", "arm+0,-2", "all+0,-2", "mouth=open", "prop:bang@26,0"], ms = 120 },
  { ops = ["head=d", "arm+0,-2", "all+1,-1", "mouth=open", "prop:bang@26,0"], ms = 100 },
  { ops = ["arm+0,-2", "all+-1,0", "mouth=open", "prop:bang@26,1"], ms = 100 },
  { ops = ["arm+0,-2", "mouth=open", "prop:bang@26,1"], ms = 700 },
  { ops = ["eyes=closed"], ms = 300 },
  { ops = [], ms = 200 },
]
