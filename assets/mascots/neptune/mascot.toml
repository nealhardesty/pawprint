# Neptune, an object on `orb`: a deep blue world, darker than any other
# planet in the catalog, with bright white storm wisps racing across it in
# its fierce winds. The signature lets the wisps drift,
# the high ones one way and the low ones the other; the rare one shivers
# with cold, out here so far from the sun, and then sneezes.
id = "neptune"
name = "Neptune"
category = "space"
aliases = []
accent = "sky"
extends = "orb"

[palette]
"l" = "blue-2"      # light
"f" = "blue-3"      # deep blue
"F" = "grey-4"      # shadow
"w" = "white"       # storm wisps
"m" = "blue-1"      # wisp tails

# The planet, the plain orb shape in deep blue.
[layers.head]
grid = """
................................
................................
................................
............kkkkkkkk............
..........kkllllllllkk..........
.........kllllllffffffk.........
........klfffffffffffffk........
.......klfllffffffffffffk.......
......klfflfffffffffffffFk......
......klffffffffffffffffFk......
.....klffffffffffffffffffFk.....
.....klffffffffffffffffffFk.....
.....klfffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
.....kffffffffffffffffffFFk.....
......kffffffffffffffffFFk......
......kffffffffffffffffFFk......
.......kffffffffffffffFFk.......
........kffffFFFFFFFFFFk........
.........kFFFFFFFFFFFFk.........
..........kkFFFFFFFFkk..........
............kkkkkkkk............
................................
................................
................................
................................
................................
................................
................................
"""

# White storm wisps, high and low, to drift in the signature.
[layers.wisps-hi]
at = [11, 5]
follows = "head"
grid = """
wwwmm.....
..........
.....mwwww
"""

[layers.wisps-lo]
at = [10, 15]
follows = "head"
grid = """
....mwwwww...
wwm..........
.........mwww
..mw.........
"""

[[actions]]
use = "blink"
weight = 6

[[actions]]
use = "look-left"
weight = 3

[[actions]]
use = "curious"
weight = 2

[[actions]]
use = "doze"

# Signature: the storm wisps drift, the high ones east and the low ones
# west, while Neptune half-closes its eyes into the wind.
[[actions]]
name = "storm-drift"
weight = 4
frames = [
  { ops = ["wisps-hi+1,0", "wisps-lo+-1,0"], ms = 240 },
  { ops = ["wisps-hi+2,0", "wisps-lo+-2,0", "eyes=happy"], ms = 240 },
  { ops = ["wisps-hi+3,0", "wisps-lo+-3,0", "eyes=happy"], ms = 600 },
  { ops = ["wisps-hi+3,0", "wisps-lo+-3,0"], ms = 800 },
  { ops = ["wisps-hi+1,0", "wisps-lo+-1,0"], ms = 200 },
]

# Rare: Neptune shivers with cold, winds up, and sneezes a puff of frost.
[[actions]]
name = "sneeze"
weight = 1
frames = [
  { ops = ["eyes=closed", "all+1,0"], ms = 90 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 90 },
  { ops = ["eyes=closed", "all+1,0"], ms = 90 },
  { ops = ["eyes=closed", "all+-1,0"], ms = 90 },
  { ops = ["eyes=closed", "+mouth.open", "all+0,-1"], ms = 400 },
  { ops = ["eyes=closed", "+mouth.open", "all+0,1", "prop:puff@19,10"], ms = 300 },
  { ops = ["eyes=happy", "prop:puff@22,8"], ms = 600 },
  { ops = [], ms = 200 },
]
