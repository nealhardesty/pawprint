# PAWPRINT's 3x5 micro font (SPEC §4.4): printable ASCII 0x20-0x7E on a
# 4-pixel advance, for labels too long for the 5x7 font. '#' is ink, '.' is
# clear. Lowercase letters use the capital forms: 3x5 has no room for
# legible lowercase. Original to this repository, MIT licensed.

