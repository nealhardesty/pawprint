grid = """
.....kkkkkkkkkkkk.....
...kkllllllllllffkk...
..kllffffffffffffFFk..
.klfffffffffffffffFFk.
.klfffffffffffffffFFk.
.klfffffffffffffffFFk.
.klfffffffffffffffFFk.
