grid = """
..........kkkkkkkkkk..........
.......kkksssssssssskkk.......
.....kksssssssssssssssskk.....
...kkssssSssssssssssSsssskk...
..kssssSssssssssssssssSssssk..
.kssssSssssssssssssssssSssssk.
.kssssSssssssssssssssssSssssk.
ksssSssssssssssssssssssssSsssk
ksssSssssssssssssssssssssSsssk
kssSssssssssssssssssssssssSssk
kssSssssssssssssssssssssssSssk
ksssSssssssssssssssssssssSsssk
.kssSssssssssssssssssssssSssk.
.ksssSssssssssssssssssssSsssk.
.kssSsssssSssssssssSsssssSssk.
..ksssssssSssssssssSsssssssk..
...kksssssssSssssSssssssskk...
.....kkkssssssSSsssssskkk.....
........kkksssssssskkk........
"""

[layers.head]
