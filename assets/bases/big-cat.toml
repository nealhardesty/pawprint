# Base: big-cat (SPEC §12.8). A large feline head with a broad muzzle and
# small round ears, framed by a mane, with heavy paws on the rim and a tufted
# tail up the right side. Members: lion, tiger.
#
# Role glyphs (map them in the mascot's [palette]):
#   k ink (outline, pupils)    l f F  fur light / base / shadow
#   w M    muzzle and chest light / its shadow (mouth lines)
#   s S    mane and tail tuft / their shadow
#   e iris (the glint in the default eyes)   h eye highlight (unused)
#   n nose   p inner ear and mouth inside
#
# Slots, in drawing order: tail (+flick), body, mane, head, ears (+flick),
# eyes (+closed, left, right, happy), nose (+sniff), mouth (.open only,
# hidden at rest: a roar), paws. ears, eyes, nose, and mouth follow head;
# the mane does not, so a mane shake is `mane+1,0` / `mane+-1,0`.
#
# A maneless big cat (tiger) hides the mane with `rest` listing every slot
# but "mane", or replaces `mane` with cheek ruffs of its own.

[palette]
"." = "clear"
"k" = "ink"
"l" = "orange-1"
"f" = "yellow-2"
"F" = "orange-3"
"w" = "cream"
"M" = "orange-1"
"s" = "brown-2"
"S" = "brown-3"
"e" = "amber"
"h" = "white"
"n" = "brown-3"
"p" = "pink-2"

[layers.tail]
at = [25, 11]
grid = """
.kkk.
kSSSk
kSsSk
.kSk.
.kfk.
.kfk.
.kfk.
kfFk.
kfFk.
"""

[layers."tail.flick"]
at = [25, 11]
grid = """
..kkk.
.kSSSk
.kSsSk
.kSk..
.kfk..
.kfk..
.kfk..
kfFk..
kfFk..
"""

[layers.body]
at = [4, 14]
grid = """
....klffffffffffffFk....
...klfffffffffffffFFk...
.kklffffffwwwwffffffFkk.
klfffffffwwwwwwffffffFFk
klfffffffwwwwwwffffffFFk
klffffffffwwwwfffffffFFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
klffffffffffffffffffffFk
"""

[layers.mane]
