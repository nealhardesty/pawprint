......kkkkkkkkkkkk......
....kkllllllllllffkk....
...kllffffffffffffFFk...
..klfffffffffffffffFFk..
..klfffffffffffffffFFk..
..klfffffffffffffffFFk..
.kwwffffffffffffffffwMk.
