# Base: rodent-upright (SPEC §12.8). A small mammal standing up in the crate:
# a round head on a pear-shaped body, puffy cheeks, small round ears, buck
# teeth, front paws held together at the chest, and a bushy tail on the
# right. Its default colors make a marmot. Members: marmot, chipmunk,
# squirrel, mouse, hamster, beaver.
#
# Role glyphs (map them in the mascot's [palette]):
#   k ink (outline, pupils)    l f F  fur light / base / shadow
#   w M    cheeks, muzzle, and belly / their shadow
#   t teeth   e iris (unused by the default eyes)   h eye highlight
#   n nose    p inner ear and mouth inside
#
# Slots, in drawing order: tail (+flick), body, head, ears (+flick), eyes
# (+closed, left, right, happy), nose (+sniff), mouth (the teeth; +open),
# paws. ears, eyes, nose, and mouth follow head. The paws sit at the chest,
# so a held prop (seed, pebble) goes at about prop:seed@14,14.

[palette]
"." = "clear"
"k" = "ink"
"l" = "brown-1"
"f" = "brown-2"
"F" = "brown-3"
"w" = "orange-1"
"M" = "brown-1"
"t" = "white"
"e" = "brown-4"
"h" = "white"
"n" = "brown-4"
"p" = "pink-2"

[layers.tail]
at = [24, 11]
grid = """
.kkk..
klffk.
kfffFk
kffFFk
.kfFFk
.kfFFk
.kfFk.
kffFk.
kfFFk.
"""

[layers."tail.flick"]
