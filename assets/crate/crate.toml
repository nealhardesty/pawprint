# The shared crate (SPEC §4.1-4.2), drawn in accent shades so any accent
# tints it. Back rim: rows 18-19 behind the mascot. Front: rows 20-31 in front
# of it, with the cream label strip at rows 22-30, columns 2-29. The strip
# stays plain cream: the label is stenciled onto it at physical resolution,
# always inside it (SPEC §4.4). There is nothing outside the 32 x 32 canvas.
#
# Glyphs: k ink outline, 3 lit wood (top, left), 2 wood, 1 shaded wood
# (bottom, right, inside), n nail heads (ink) on the top rail, s cream label.
#
# The crate front has a top rail only: the strip runs down to the bottom
# outline so it is 9 rows tall. A 7-row glyph then gets one clear row above
# and below at 1x instead of touching the rail.

[palette]
"." = "clear"
"k" = "ink"
"1" = "accent-shadow"
"2" = "accent"
"3" = "accent-highlight"
"n" = "ink"
"s" = "cream"

# The far wall seen over the front: a lit top edge, then its shaded inside
# face, split into two planks.
[layers.back]
at = [0, 18]
grid = """
kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
k31111111111111k111111111111111k
"""

# Corner posts, a top rail with a seam and nails, the label, a bottom rail.
[layers.front]
at = [0, 20]
grid = """
kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
k3n33332233333323333333223333n2k
k3ssssssssssssssssssssssssssss1k
k3ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
k2ssssssssssssssssssssssssssss1k
kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
"""

