# The shared crate (SPEC §4.1-4.2), drawn in accent shades so any accent
# tints it. Back rim: rows 18-19 behind the mascot. Front: rows 20-31 in front
# of it, with the cream label strip at rows 22-29, columns 2-29. The strip
# stays plain cream: the label is stenciled onto it at any font scale.
#
# Glyphs: k ink outline, 3 lit wood (top, left), 2 wood, 1 shaded wood
# (bottom, right, inside), n and o nail heads (ink) on the top and bottom
# rails, s cream label.
#
# The nameplate (used when the label doesn't fit the strip) is a board
# nailed under or beside the crate, drawn in font pixels: plate-left, then
# plate-mid once per text column, then plate-right. Text starts right after
# plate-left and is centered vertically.

[palette]
"." = "clear"
"k" = "ink"
"1" = "accent-shadow"
"2" = "accent"
"3" = "accent-highlight"
"n" = "ink"
"o" = "ink"
"s" = "cream"

# The far wall seen over the front: a lit top edge, then its shaded inside
# face, split into two planks.
[layers.back]
at = [0, 18]
grid = """
kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
k31111111111111k111111111111111k
"""

# Corner posts, a top rail with a seam and nails, the label, a bottom rail.
[layers.front]
at = [0, 20]
grid = """
