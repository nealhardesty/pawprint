# Spike F22 (SPEC §14.4, §18): proves that the Linux platform crates link into
# a fully static musl binary with only rustup-provided pieces. Not part of the
# workspace. Run with `make spike-f22`.
[package]
name = "f22-static-musl"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
x11rb = { version = "0.14", features = ["shape", "xfixes", "randr"] }
# No features: the pure-Rust backend. `system`/`dlopen` load libwayland and
# `log` compiles a C shim, so all three stay off.
wayland-client = "0.31"
# Default features pull in libxkbcommon via pkg-config.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
calloop = "0.14"
# ksni 0.3 still needs zbus 5 (zbus 6 dropped `zbus::blocking`).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
strip = true

[workspace]
