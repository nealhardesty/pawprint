[package]
name = "pawdev"
description = "PAWPRINT developer tool (never shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pawprint-core.workspace = true
pawprint-sprite.workspace = true
gif.workspace = true
toml.workspace = true
# Release archives (`make package`) and the installer tests.
flate2 = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "time"] }

# `make power-check` on macOS reads proc_pid_rusage.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
