# CI calls make targets only (SPEC §14.1), so it behaves like a local run.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: make ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # macOS keeps its own GNU Make 3.81 on purpose, to prove compatibility.
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make --no-progress -y

      - uses: Swatinem/rust-cache@v2

      - name: make ci
        run: make ci

  # The X11 and Wayland backends against real display servers: Xvfb (bare,
  # with xcompmgr, with openbox) and headless sway, checked pixel by pixel.
  linux-display:
    name: make test-linux-display (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install display servers and test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xcompmgr openbox sway swaybg grim foot wtype

      - uses: Swatinem/rust-cache@v2

      - name: make test-linux-display
        run: make test-linux-display
