# CI calls make targets only (SPEC §14.1), so it behaves like a local run.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: make ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # macOS keeps its own GNU Make 3.81 on purpose, to prove compatibility.
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make --no-progress -y

      - uses: Swatinem/rust-cache@v2

      - name: make ci
        run: make ci
