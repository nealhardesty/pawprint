[package]
name = "pawprint"
description = "Always-on-top pixel-art hostname badge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# `pawprintw` is the Windows GUI-subsystem twin (SPEC §11.1.6).
default-run = "pawprint"

[dependencies]
pawprint-core.workspace = true
clap.workspace = true
directories.workspace = true
log = "0.4"
serde.workspace = true
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux backends (SPEC §10.3). All pure Rust, so the musl build stays static
# (F22): sctk without `xkbcommon`, wayland-client without `system`/`dlopen`/`log`.
[target.'cfg(target_os = "linux")'.dependencies]
calloop = "0.14"
# The tray (SPEC §10.3): blocking API on async-io, so no tokio.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["shape", "xfixes", "randr"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# macOS backend (SPEC §11.2). Each framework crate is trimmed to the
# features the backend uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "block2", "objc2-core-graphics", "NSApplication", "NSColor", "NSColorSpace", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSEnumerator", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSOperation", "NSProcessInfo", "NSRunLoop", "NSString", "NSThread"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-system-configuration = { version = "0.3", default-features = false, features = ["std", "SCDynamicStore", "SCDynamicStoreCopySpecific", "SCPreferences", "SCPreferencesPath"] }

# Windows backend (SPEC §11.1), named-pipe IPC, and the session key.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Display-server tests (`make test-x11`, `make test-wayland`): they drive real
# Xvfb and headless sway sessions, so they are `#[ignore]`d in `make test`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
png.workspace = true
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["randr", "xtest"] }
# A stand-in StatusNotifierWatcher on a private session bus (the tray test).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The macOS GUI-session test (`make test-macos-display`) asks the window
# server about the badge's window and posts synthetic input.
[target.'cfg(target_os = "macos")'.dev-dependencies]
png.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue"] }

# The Windows display test (`make test-windows-display`) needs a real
# desktop session, so it is `#[ignore]`d in `make test` too.
[target.'cfg(windows)'.dev-dependencies]
png.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
